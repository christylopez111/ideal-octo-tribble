      C.sfx.dropTone(); C.haptic(8);
      api.refresh();
    }
    function goHome(at){
      var h = S.held, to = slotXY(h.from, S.poles[h.from].length);
      S.anim = {type:h.type, x0:at.x, y0:at.y, x1:to.x, y1:to.y, t:0, T:.2, to:h.from, back:true};
      S.held = null; C.sfx.dropTone();
    }
    function settle(a){
      S.poles[a.to].push(a.type);
      S.anim = null;
      S.bounce[a.to] = .26;
      if(a.back) return;
      if(isDone(a.to) && !S.done[a.to]){
        S.done[a.to] = true; S.popT[a.to] = .45;
        C.sfx.clear(); C.haptic([10,30,10]);
        var pos = slotXY(a.to, Math.floor(cap/2));
        burst(pos, '#ffd34d', 20);
        api.coins(6);
        S.earned = (S.earned || 0) + 6;
        float(pos.x, pos.y - G.pitch, '+6', '#ffd34d', 18);
      }
      if(SL.isSolved(S.poles, {cap:cap})){
        S.over = true; S.winT = 0; api.refresh();
      } else if(!anyMove()){
        S.over = true; inst.status = 'lost';
        inst.lose = {title:C.t('stuckSigns'), sub:C.t('stuckSignsSub'), extraStop:false, undo:true};
        api.refresh();
      }
    }
    function undo(){
      if(S.anim || S.over) return false;
      if(S.held){ S.poles[S.held.from].push(S.held.type); S.held = null; C.sfx.dropTone(); return true; }
      if(!S.history.length){ api.toast(C.t('noMoves')); return false; }
      if(!api.spend(C.COST.undo)) return false;
      var m = S.history.pop();
      S.poles[m.to].pop(); S.poles[m.from].push(m.type);
      if(S.done[m.to] && !isDone(m.to)) delete S.done[m.to];
      S.moves = Math.max(0, S.moves - 1);
      S.over = false; inst.status = 'play'; inst.lose = null;
      C.sfx.liftTone(); api.refresh();
      return true;
    }
    function hint(){
      if(S.anim || S.over) return false;
      if(!api.spend(C.COST.hint)) return false;
      if(S.held){ S.poles[S.held.from].push(S.held.type); S.held = null; }
      var sol = SL.greedy(S.poles, cap, Math.random, 160);
      if(!sol || !sol.length){ api.toast(C.t('noMoves')); return false; }
      S.hintMove = sol[0]; S.hintT = 4;
      C.sfx.coin();
      return true;
    }

    /* ---------- effects ---------- */
    function burst(pos, colour, n){
      for(var i = 0; i < n; i++){
        var a = Math.random()*Math.PI*2, sp = 70 + Math.random()*170;
        S.parts.push({x:pos.x, y:pos.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 110,
                      rot:Math.random()*6, vr:(Math.random()-.5)*14, life:0,
                      T:.7 + Math.random()*.4, c:Math.random() < .4 ? '#ffffff' : colour});
      }
    }
    function float(x, y, text, colour, size){ S.floats.push({x:x, y:y, text:text, color:colour, size:size, t:0, T:1}); }

    /* ---------- drawing ---------- */
    function paintStatic(c){
      var W = G.W, H = G.H, i;
      var sn = C.season();
      var sky = c.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, sn.sky[0]); sky.addColorStop(.45, sn.sky[1]); sky.addColorStop(1, sn.sky[2]);
      c.fillStyle = sky; c.fillRect(0, 0, W, H);
      // the place: its sky, its skyline and landmark, and its own kind of street
      var bh = G.top + 24;
      window.Places.drawBand(c, 0, 0, W, bh + 2, {});
      var x;
      // sidewalk and snow
      c.fillStyle = sn.ground; c.fillRect(0, bh, W, H - bh);
      c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1;
      for(var gx = 0; gx < W; gx += 46){ c.beginPath(); c.moveTo(gx + .5, bh); c.lineTo(gx + .5, bh + 26); c.stroke(); }
      c.fillStyle = sn.verge;
      c.beginPath(); c.moveTo(0, bh);
      for(var sx = 0; sx <= W; sx += 30) c.quadraticCurveTo(sx + 15, bh + ((sx/30) % 2 ? 18 : 10), sx + 30, bh + 7);
      c.lineTo(W, bh + 22); c.lineTo(0, bh + 22); c.closePath(); c.fill();
      // a kerb and road at the very bottom, so the poles stand on a real street
      var roadY = H - 34;
      c.fillStyle = sn.verge; c.fillRect(0, roadY - 8, W, 10);
      c.fillStyle = '#5c687a'; c.fillRect(0, roadY, W, H - roadY);
      c.save(); c.setLineDash([14, 12]); c.strokeStyle = '#f6c945'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(0, roadY + 17); c.lineTo(W, roadY + 17); c.stroke(); c.restore();
      window.Places.shade(c, 0, bh + 2, W, H - bh - 2);
    }
    function drawPole(c, i){
      var p = G.pos[i], shake = S.shake[i] || 0;
      var ox = shake > 0 ? Math.sin(S.time*60)*3*(shake/.3) : 0;
      var x = p.x + ox, baseY = p.y, topY = baseY - G.poleH - 6;
      // snow mound at the foot
      var sb = C.season();
      c.fillStyle = sb.vergeShade; c.beginPath(); c.ellipse(x, baseY + 8, G.signW*.62, 8, 0, 0, Math.PI*2); c.fill();
      c.fillStyle = sb.verge; c.beginPath(); c.ellipse(x - 1, baseY + 5, G.signW*.56, 7, 0, 0, Math.PI*2); c.fill();
      // the post
      var pw = Math.max(5, G.signW*.14);
      c.fillStyle = 'rgba(20,28,40,.18)'; C.rrect(c, x - pw/2 + 2, topY + 3, pw, baseY - topY, pw/2); c.fill();
      var grad = c.createLinearGradient(x - pw/2, 0, x + pw/2, 0);
      grad.addColorStop(0, '#8d99a8'); grad.addColorStop(.45, '#d5dde6'); grad.addColorStop(1, '#79848f');
      c.fillStyle = grad; C.rrect(c, x - pw/2, topY, pw, baseY - topY, pw/2); c.fill();
      // finished pole gets a warm glow and a tick
      if(S.done[i]){
        c.save();
        c.strokeStyle = 'rgba(255,208,70,' + (.55 + .35*Math.sin(S.time*3)) + ')';
        c.lineWidth = 3;
        C.rrect(c, x - G.signW*.62, topY - 4, G.signW*1.24, baseY - topY + 10, 10);
        c.stroke(); c.restore();
      }
      // the signs, bottom first
      var list = S.poles[i];
      var bnc = S.bounce[i] || 0, pop = S.popT[i] || 0;
      for(var j = 0; j < list.length; j++){
        var pos = slotXY(i, j), yy = pos.y;
        var sw = G.signW, sh = G.slot*.92;
        if(pop > 0){                                  // the whole pole pulses when it is finished
          var pu = 1 + .14*Math.sin(Math.PI*(1 - pop/.45));
          sw *= pu; sh *= pu;
        }
        if(bnc > 0 && j === list.length - 1){         // the sign that just landed squashes
          var bu = bnc/.26;
          sw *= 1 + .16*bu; sh *= 1 - .16*bu; yy += G.slot*.09*bu;
        }
        c.save(); c.translate(ox, 0);
        // bracket
        c.fillStyle = '#6d7885'; c.fillRect(pos.x - pw*.8, yy - 1.5, pw*1.6, 3);
        // thickness: a dark plate behind, offset down, so the sign reads as solid
        var key = i + ':' + j;
        if(S.hidden[key]){
          // buried under snow: no shape, no colour, nothing to give it away
          c.fillStyle = 'rgba(22,30,42,.3)'; C.rrect(c, pos.x - sw*.5, yy - sh*.46 + 3, sw, sh*.92, sh*.3); c.fill();
          var sg = c.createLinearGradient(0, yy - sh*.5, 0, yy + sh*.5);
          sg.addColorStop(0, '#ffffff'); sg.addColorStop(1, '#cfdeeb');
          c.fillStyle = sg; C.rrect(c, pos.x - sw*.5, yy - sh*.46, sw, sh*.92, sh*.3); c.fill();
          c.strokeStyle = 'rgba(140,165,190,.7)'; c.lineWidth = 1.5; c.stroke();
          c.fillStyle = '#8aa4bf'; c.font = '400 ' + Math.round(sh*.55) + 'px "Lilita One", Nunito, sans-serif';
          c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', pos.x, yy + 1);
          c.restore();
          continue;
        }
        C.drawSignEdge(c, list[j], pos.x, yy + Math.max(2, sh*.085), sw, sh, 'rgba(22,30,42,.45)');
        C.drawSignEdge(c, list[j], pos.x, yy + Math.max(1, sh*.045), sw, sh, 'rgba(40,52,68,.7)');
        C.drawSign(c, list[j], pos.x, yy, sw, sh);
        if(S.frozen[key]){
          c.save();
          C.shapePath(c, 'circle', pos.x, yy, sw*.52);
          c.fillStyle = 'rgba(190,225,250,.62)'; c.fill();
          c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 2; c.stroke();
          c.fillStyle = 'rgba(255,255,255,.9)';
          for(var k = 0; k < 3; k++){
            var a = S.time*.6 + k*2.1, rr = sw*.3;
            c.beginPath(); c.arc(pos.x + Math.cos(a)*rr, yy + Math.sin(a)*rr, 2, 0, Math.PI*2); c.fill();
          }
          c.restore();
        }
        c.restore();
      }
      // hint arrows
      if(S.hintMove && S.hintT > 0){
        var pulse = (Math.sin(S.time*6) + 1)/2;
        if(i === S.hintMove[0] || i === S.hintMove[1]){
          c.save();
          c.strokeStyle = i === S.hintMove[0] ? 'rgba(255,210,70,' + (.5+.5*pulse) + ')' : 'rgba(110,230,140,' + (.5+.5*pulse) + ')';
          c.lineWidth = 3; c.setLineDash([8,6]); c.lineDashOffset = -S.time*30;
          C.rrect(c, x - G.signW*.64, topY - 6, G.signW*1.28, baseY - topY + 12, 10);
          c.stroke(); c.restore();
        }
      }
    }
    function draw(c){
      var i;
      for(i = 0; i < S.poles.length; i++) drawPole(c, i);
      if(S.held){
        // every pole that can take the sign gets a soft green marker, so the player sees where it can go
        for(i = 0; i < S.poles.length; i++){
          if(i === S.held.from || !canDrop(i, S.held.type)) continue;
          var tp = slotXY(i, S.poles[i].length), on = S.drag && S.drag.on && poleNear(S.drag.x, S.drag.y) === i;
          c.save(); c.globalAlpha = on ? 0.95 : 0.45 + 0.25*Math.sin(S.time*5);
          c.strokeStyle = '#3ee07a'; c.lineWidth = on ? 4 : 3; c.setLineDash(on ? [] : [7, 5]);
          C.rrect(c, tp.x - G.signW*0.55, tp.y - G.slot*0.5, G.signW*1.1, G.slot*0.95, G.slot*0.25); c.stroke();
          c.restore();
        }
        var lp = S.drag && S.drag.on ? {x:S.drag.x, y:S.drag.y - G.slot*0.9} : liftXY(S.held.from);   // above the finger, so it stays visible
        var bob = S.drag && S.drag.on ? 0 : Math.sin(S.time*6)*2;
        c.save();
        c.globalAlpha = .25;
        C.drawSign(c, S.held.type, lp.x + 3, lp.y + 6 + bob, G.signW, G.slot*.92);
        c.restore();
        C.drawSignEdge(c, S.held.type, lp.x, lp.y + bob + 5, G.signW*1.06, G.slot*.98, 'rgba(22,30,42,.45)');
        C.drawSign(c, S.held.type, lp.x, lp.y + bob, G.signW*1.06, G.slot*.98);
      }
      if(S.anim){
        var a = S.anim, u = C.easeInOut(Math.min(1, a.t/a.T));
        var x = a.x0 + (a.x1 - a.x0)*u, y = a.y0 + (a.y1 - a.y0)*u - (a.back ? 10 : 26)*Math.sin(Math.PI*u);
        C.drawSignEdge(c, a.type, x, y + 4, G.signW, G.slot*.92, 'rgba(22,30,42,.4)');
        C.drawSign(c, a.type, x, y, G.signW, G.slot*.92);
      }
      S.parts.forEach(function(p){
        c.save(); c.globalAlpha = C.clamp(1 - p.life/p.T, 0, 1);
        c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.c; c.fillRect(-3,-2,6,4); c.restore();
      });
      S.floats.forEach(function(f){
        c.save(); c.globalAlpha = C.clamp(1 - f.t/f.T, 0, 1);
        c.font = f.size + 'px "Lilita One", Nunito, sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.lineWidth = 4; c.strokeStyle = 'rgba(17,24,36,.75)'; c.strokeText(f.text, f.x, f.y);
        c.fillStyle = f.color; c.fillText(f.text, f.x, f.y); c.restore();
      });
      if(S.tut === 1 && S.time > .7){
        var pulse = (Math.sin(S.time*5) + 1)/2, target = 0;
        for(i = 0; i < S.poles.length; i++) if(S.poles[i].length && !isDone(i) && !frozenAt(i)){ target = i; break; }
        var p = G.pos[target];
        c.save(); c.strokeStyle = 'rgba(255,255,255,' + (.5 + .4*pulse) + ')'; c.lineWidth = 4;
        c.setLineDash([9,7]); c.lineDashOffset = -S.time*30;
        C.rrect(c, p.x - G.signW*.66, p.y - G.poleH - 10, G.signW*1.32, G.poleH + 24, 12);
        c.stroke(); c.restore();
      }
      C.drawSnow(c, flakes);
    }

    /* ---------- update ---------- */
    function starsFor(){
      // ref is a solution the generator actually found, a few moves off perfect.
      var ref = level.ref || 24;
      if(S.moves <= Math.round(ref*0.8)) return 3;
      if(S.moves <= Math.round(ref*1.05)) return 2;
      return 1;
    }
    function update(dt){
      C.stepSnow(flakes, dt, G.W, G.H);
      S.time += dt;
      for(var key in S.shake){ S.shake[key] -= dt; if(S.shake[key] <= 0) delete S.shake[key]; }
      for(var bk in S.bounce){ S.bounce[bk] -= dt; if(S.bounce[bk] <= 0) delete S.bounce[bk]; }
      for(var pk in S.popT){ S.popT[pk] -= dt; if(S.popT[pk] <= 0) delete S.popT[pk]; }
      if(S.hintT > 0){ S.hintT -= dt; if(S.hintT <= 0) S.hintMove = null; }
      if(S.anim){ S.anim.t += dt; if(S.anim.t >= S.anim.T) settle(S.anim); }
      // a buried sign that reaches the top of its pole shakes off its snow
      for(var hk in S.hidden){
        var parts = hk.split(':'), pi = +parts[0], si = +parts[1];
        if(S.poles[pi].length - 1 === si && !(S.held && S.held.from === pi && S.poles[pi].length === si)){
          delete S.hidden[hk];
          var sp = slotXY(pi, si); burst(sp, '#ffffff', 12); C.sfx.liftTone();
        }
      }
      for(var i = S.parts.length - 1; i >= 0; i--){
        var p = S.parts[i]; p.life += dt;
        if(p.life > p.T){ S.parts.splice(i,1); continue; }
        p.vy += 580*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
      }
      for(var f = S.floats.length - 1; f >= 0; f--){
        var fl = S.floats[f]; fl.t += dt; fl.y -= 32*dt;
        if(fl.t > fl.T) S.floats.splice(f,1);
      }

      if(S.winT >= 0){
        S.winT += dt;
        if(S.winT > .7){
          S.winT = -1; inst.status = 'won';
          inst.result = {stars:starsFor(), coins:S.earned || 0};
          api.refresh();
        }
      }
    }

    /* ---------- input ---------- */
    function down(px, py){
      if(S.over || S.anim) return;
      var i = poleAt(px, py);
      if(i < 0) return;
      if(S.held) drop(i); else lift(i);
      api.refresh();
    }
    /* Both ways work: tap a pole then tap another, or press a sign and drag it
       onto another pole. A press lifts the sign at once; moving more than a
       few pixels turns it into a drag; letting go drops it on the nearest pole. */
    var press = null;
    function pointer(kind, px, py){
      if(kind === 'down'){
        press = null;
        if(S.over || S.anim) return;
        var i = poleAt(px, py);
        if(S.held){
          press = {x:px, y:py, i:i, carry:i === S.held.from};      // pressing the lifted sign's pole can pick it up to drag
          if(press.carry) S.drag = {x:px, y:py, on:false};
          return;
        }
        if(i < 0) return;
        lift(i);
        if(S.held){ press = {x:px, y:py, i:i, carry:true, fresh:true}; S.drag = {x:px, y:py, on:false}; }
        api.refresh();
        return;
      }
      if(!press) return;
      if(kind === 'move'){
        if(press.carry && S.held && S.drag){
          S.drag.x = px; S.drag.y = py;
          if(!S.drag.on && Math.hypot(px - press.x, py - press.y) > 10){ S.drag.on = true; S.hintMove = null; }
        }
        return;
      }
      // up
      var pr = press; press = null;
      var dragged = S.drag && S.drag.on, at = dragged ? {x:S.drag.x, y:S.drag.y - G.slot*0.9} : null;
      S.drag = null;
      if(!S.held || S.over || S.anim) return;
      if(dragged){
        var t = poleNear(px, py);
        if(t < 0 || t === S.held.from) goHome(at); else drop(t, at);
      } else if(!pr.fresh){
        var j = pr.i >= 0 ? pr.i : poleAt(px, py);               // a plain tap with a sign up: drop it there
        if(j >= 0) drop(j);
      }
      api.refresh();
    }
    function booster(id){
      if(id === 'undo') return undo();
      if(id === 'hint') return hint();
      return false;
    }
    function boosterState(id){
      if(id === 'undo') return {disabled:!!S.anim || (!S.history.length && !S.held), on:false, cost:C.COST.undo};
      if(id === 'hint') return {disabled:S.over || !!S.anim, on:S.hintT > 0, cost:C.COST.hint};
      return {disabled:true, on:false, cost:0};
    }
    function hud(){ return {main:String(S.moves), sub:C.t('moves') + ' · ★★★ ' + Math.round((level.ref || 24)*0.8)}; }

    inst.layout = layout; inst.paintStatic = paintStatic; inst.update = update; inst.draw = draw;
    inst.down = down; inst.pointer = pointer; inst.booster = booster; inst.boosterState = boosterState; inst.hud = hud;
    inst.continueAfterLoss = function(){ undo(); };
    inst.state = S;
    inst.polePos = function(i){ return G ? G.pos[i] : null; };   // used by the automated player

    /* The coach: the next good move, shown on the board with a hand. */
    var cache = {key:null, mv:null};
    inst.coachNow = function(){ return S.tut === 1 && !S.over; };
    inst.coachMove = function(){
      if(S.over || S.anim || (S.drag && S.drag.on)) return null;
      var key = S.poles.map(function(p){ return p.join(','); }).join('|') + (S.held ? '#' + S.held.from : '');
      if(key !== cache.key){
        cache.key = key; cache.mv = null;
        var poles = SL.clone(S.poles); if(S.held) poles[S.held.from].push(S.held.type);
        var sol = SL.greedy(poles, cap, Math.random, 240);
        if(sol && sol.length) cache.mv = sol[0];
      }
      if(S.held){                                              // a sign is up: show where it can go
        var b = cache.mv && cache.mv[0] === S.held.from ? cache.mv[1] : -1;
        for(var j = 0; b < 0 && j < S.poles.length; j++) if(j !== S.held.from && canDrop(j, S.held.type)) b = j;
        if(b < 0) return null;
        var lp = liftXY(S.held.from), tp = slotXY(b, S.poles[b].length);
        return {kind:'drag', x:lp.x, y:lp.y, x2:tp.x, y2:tp.y, r:G.signW*0.55, text:C.t(S.poles[b].length ? 'coSignDrop' : 'coSignEmpty')};
      }
      if(!cache.mv) return null;
      var a = cache.mv[0], b2 = cache.mv[1], fp = slotXY(a, S.poles[a].length - 1), to = slotXY(b2, S.poles[b2].length);
      return {kind:'drag', x:fp.x, y:fp.y, x2:to.x, y2:to.y, r:G.signW*0.55, text:C.t(S.poles[b2].length ? 'coSign' : 'coSignEmpty')};
    };
    if(api.firstTime) S.tut = 1;
    return inst;
  }

  window.Games = window.Games || {};
  window.Games.signs = {
    id:'signs', titleKey:'gameSigns', boosters:['undo','hint'],
    generate:function(n){ return SL.generate(n); },
    create:create
  };
})();
</script>
<script>
/* Downtown Rush: a four-way Montréal intersection with no working lights.

   Rules:
   - Every vehicle drives itself. Tap one to brake it, tap again to release it.
   - Vehicles behind a stopped one do NOT stop by themselves. Brake them too,
     or they bump the one in front and you lose points.
   - Two vehicles meeting in the box is a crash: both are lost, big penalty.
     Three crashes ends the level.
   - Every vehicle through scores, and most of that score is a speed bonus
     that drains while the vehicle is kept waiting. Holding everybody back is
     safe, but it does not earn enough to pass.
   - You need the target score to move on.

   The rules themselves live in TrafficLogic.step, shared with the level
   generator and the tests. This file adds the pictures, sound and input.
   The scene is drawn in real 3D when the device can do it, and falls back to
   a flat drawing when it cannot. */
(function(){
  'use strict';
  var C = window.Core, TL = window.TrafficLogic;

  var BOX = TL.BOX;
  function lenOf(car){ return TL.lenOf(car.kind); }
  var worldOf = TL.worldOf;
  function headingOf(d){               // rotation about the vertical axis
    return d === 'N' ? -Math.PI/2 : d === 'S' ? Math.PI/2 : d === 'W' ? 0 : Math.PI;
  }

  function create(level, n, api){
    var goal = level.goal, maxPts = level.maxPts;
    var S = TL.newState(level);
    S.over = false; S.parts = []; S.floats = []; S.shakeT = 0; S.nearMiss = 0; S.pulse = 0; S.endT = -1;
    /* Learning: the first traffic level, a level not yet won, or one lost twice.
       Vehicles then slow behind a stopped one by themselves, getting through
       without three crashes is enough to pass, and after repeated losses the
       traffic is slower. The first time, the junction also freezes twice to
       show the two taps: stop a car, then let it go. */
    var ease = api.ease || 0, learn = api.firstTime || ease > 0 || n <= 1;
    S.assist = learn || n <= 2;
    if(ease) S.cars.forEach(function(c){ c.speed *= ease >= 2 ? 0.75 : 0.87; });
    S.lesson = api.firstTime ? 1 : 0;
    var lessonCar = null, frozen = false;
    var G = null, flakes = C.makeSnow(22), view3d = null;
    var inst = {
      status:'play', result:null, lose:null, tip:null,
      boosters:['allstop'], subtitle:null, showHud:true,
      twist:level.cars.some(function(c){ return c.amb; }) ? 'amb' : null
    };

    /* ---------- geometry ---------- */
    function layout(g){
      G = g;
      G.top = Math.min(96, g.H*0.12);
      G.bottomPad = 40;
      G.cx = g.W/2;
      G.cy = G.top + (g.H - G.top - G.bottomPad)/2;
      G.unit = Math.min(g.W*0.175, (g.H - G.top - G.bottomPad)*0.105);
      G.box = G.unit*BOX;
      if(view3d){ view3d.dispose(); view3d = null; }
      if(window.Kit3D && window.Kit3D.available()){
        try { view3d = window.Kit3D.trafficView(G, S.cars, lenOf, headingOf, BOX + TL.LANE_IN - 0.9); }
        catch(e){ view3d = null; }
      }
    }
    function use3d(){ return view3d && window.Kit3D.available(); }
    /* Screen position, in game units, for taps and effects. */
    function posOf(car){
      var w = worldOf(car);
      if(use3d()) return view3d.project(w.x, w.z);
      return {x:G.cx + w.x*G.unit, y:G.cy + w.z*G.unit};
    }
    /* On screen, where a finger can reach it. Only these can be braked, so
       a braked vehicle is always one the player can see and release. */
    function reachable(car){
      var p = posOf(car), m = G.unit*0.25;
      return p.x > m && p.x < G.W - m && p.y > G.top + m && p.y < G.H - m;
    }

    /* ---------- effects for the events the rules report ---------- */
    function floatAt(car, txt, bad){
      var p = posOf(car);
      S.floats.push({x:p.x, y:p.y, t:0, txt:txt, bad:bad});
    }
    function burst(car, n2, cols){
      var p = posOf(car), k;
      for(k = 0; k < n2; k++){
        var ang = Math.random()*Math.PI*2, sp = 60 + Math.random()*200;
        S.parts.push({x:p.x, y:p.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 100,
                      t:0, life:0.6 + Math.random()*0.5, c:cols[k % cols.length]});
      }
    }
    var EV = {
      bump:function(car){
        S.shakeT = 0.18; floatAt(car, '-' + TL.PTS.bump, true);
        burst(car, 8, ['#ffd34d', '#ffffff']);
        C.sfx.bump(); C.haptic(25); api.refresh();
      },
      through:function(car, pts){
        S.pulse = 0.35; floatAt(car, '+' + pts, false);
        api.coins(2); C.sfx.coin(); api.refresh();
      },
      crash:function(a){
        S.shakeT = 0.45; floatAt(a, '-' + TL.PTS.crash, true);
        burst(a, 24, ['#ffd34d', '#ff6b1a', '#ffffff']);
        C.sfx.lose(); C.haptic([30, 40, 60]); api.refresh();
      },
      near:function(){ S.nearMiss = 0.4; },
      siren:function(car){
        floatAt(car, C.t('sirenBonus'), false); burst(car, 16, ['#e03b30', '#2f6fe0', '#ffffff']);
        api.coins(5); C.sfx.clear(); C.haptic(20);
      }
    };

    function update(dt){
      C.stepSnow(flakes, dt, G.W, G.H);
      stepFx(dt);
      if(S.shakeT > 0) S.shakeT -= dt;
      if(S.pulse > 0) S.pulse -= dt;
      if(S.nearMiss > 0) S.nearMiss -= dt;
      if(S.over) return;
      // a braked vehicle that is off the screen (All Stop catches those too)
      // waits in the queue instead, and follows on its own
      // and one still off screen pulls up behind a stopped queue instead of
      // bumping it, since nobody could have braked it
      S.cars.forEach(function(car){
        if(car.state !== 'run' || reachable(car)) return;
        if(car.held){ car.held = false; car.queued = true; return; }
        var a = TL.carAhead(S, car);
        if(a && (a.held || a.queued) && a.p - car.p < TL.gapFor(car.kind, a.kind) + 0.3) car.queued = true;
      });
      if(S.lesson && !S.done){
        var want = advise(0.55);
        if(S.lesson === 1 && !frozen && want && want.act === 'stop'){ frozen = true; lessonCar = want.car; }
        if(S.lesson === 2 && !frozen && lessonCar && lessonCar.held && S.time - (lessonCar.heldAt || 0) > 0.9 &&
           want && want.act === 'go' && want.car === lessonCar){ frozen = true; }
        if(lessonCar && lessonCar.state !== 'run'){ frozen = false; S.lesson = 0; }
      }
      if(!S.done && !frozen) TL.step(S, dt, EV);
      watchStall(dt);
      S.cars.forEach(function(car){                  // the siren sounds as an ambulance drives in
        if(car.amb && car.state === 'run' && !car.sirenOn){ car.sirenOn = true; C.sfx.siren(); }
      });
      if(S.done){
        // a short beat so the last vehicle or crash is seen before the result
        if(S.endT < 0) S.endT = S.crashes >= 3 ? 0.8 : 0.55;
        S.endT -= dt;
        if(S.endT <= 0) finish();
      }
    }
    /* Everything on the road stopped and waiting on a braked vehicle: after a
       few seconds, say which car to tap. */
    function watchStall(dt){
      var moving = false, braked = false;
      S.cars.forEach(function(k){
        if(k.state !== 'run') return;
        if(k.held) braked = true; else if(!k.queued) moving = true;
      });
      if(braked && !moving && !S.done) S.stallT = (S.stallT || 0) + dt;      // the coach then points at the car to release
      else S.stallT = 0;
    }
    /* What a careful driver would do now: a car to stop, or a stopped car that can go. */
    function advise(react){
      var T = {cars:S.cars.map(function(k){ return Object.assign({}, k); }), time:S.time};
      TL.POLICIES.careful(T, {react:react});
      var stop = null, go = null;
      T.cars.forEach(function(k, i){
        var c = S.cars[i];
        if(c.state !== 'run' || !reachable(c)) return;
        if(k.held && !c.held && c.p <= TL.limitOf(c)){ if(!stop || c.p > stop.p) stop = c; }
        if(!k.held && c.held){ if(!go || (c.heldAt || 0) < (go.heldAt || 0)) go = c; }
      });
      return stop ? {car:stop, act:'stop'} : go ? {car:go, act:'go'} : null;
    }
    function stepFx(dt){
      var i;
      for(i = S.parts.length - 1; i >= 0; i--){
        var p = S.parts[i];
        p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 420*dt;
        if(p.t > p.life) S.parts.splice(i, 1);
      }
      for(i = S.floats.length - 1; i >= 0; i--){
        S.floats[i].t += dt;
        if(S.floats[i].t > 1.0) S.floats.splice(i, 1);
      }
      S.cars.forEach(function(car){                  // the wreck tumble keeps playing after the end
        if(S.done && car.state === 'wreck'){ car.wreckT -= dt; if(car.wreckT <= 0) car.state = 'gone'; }
      });
    }
    function finish(){
      S.over = true;
      if(S.crashes >= 3){
        inst.status = 'lost';
        inst.lose = {title:C.t('crashTitle'), sub:C.t('crashSub'), undo:false};
      } else if(S.score >= goal.pass || learn){                 // learning: getting through is enough
        inst.status = 'won';
        inst.result = {stars:S.score >= goal.three ? 3 : S.score >= goal.two ? 2 : 1, coins:S.through*2};
        C.sfx.win();
      } else {
        inst.status = 'lost';
        inst.lose = {title:C.t('needPts'),
                     sub:C.t('needPtsSub').replace('{n}', goal.pass).replace('{s}', S.score), undo:false};
      }
      api.refresh();
    }

    /* ---------- input ---------- */
    function down(x, y){
      if(S.over) return;
      var best = null, bd = 1e9;
      S.cars.forEach(function(car){
        if(car.state !== 'run' || !reachable(car)) return;
        var p = posOf(car), d = Math.hypot(p.x - x, p.y - y);
        if(d < bd){ bd = d; best = car; }
      });
      if(!best || bd > G.unit*1.15) return;
      if(best.p > TL.limitOf(best) && !best.held){ api.toast(C.t('tooLate')); C.sfx.bump(); return; }
      best.held = !best.held; best.queued = false;
      if(best.held) best.heldAt = S.time;
      C.sfx.lift(); C.haptic(8);
      if(S.lesson === 1 && best.held){ S.lesson = 2; lessonCar = best; frozen = false; }
      else if(S.lesson === 2 && best === lessonCar && !best.held){ S.lesson = 0; frozen = false; }
      api.refresh();
    }
    function booster(id){
      if(id !== 'allstop' || S.over) return false;
      if(!api.spend(C.COST.allstop)) return false;
      // everything on screen brakes; anything still off screen waits behind it
      S.cars.forEach(function(car){
        if(car.state !== 'run' || car.p > TL.limitOf(car)) return;
        if(reachable(car)) car.held = true; else car.queued = true;
      });
      C.sfx.clear(); api.refresh();
      return true;
    }
    function boosterState(){ return {disabled:S.over, on:false, cost:C.COST.allstop}; }
    function hud(){                                  // while learning, the goal is simply getting cars through
      if(learn) return {main:S.through + ' / ' + S.cars.length, sub:C.t('carsThrough')};
      return {main:S.score + ' / ' + goal.pass, sub:C.t('pts')};
    }

    /* ---------- flat fallback painting ---------- */
    function paintStatic(c){
      var W = G.W, H = G.H, u = G.unit, box = G.box, sn = C.season();
      var sky = c.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, sn.sky[1]); sky.addColorStop(1, sn.sky[2]);
      c.fillStyle = sky; c.fillRect(0, 0, W, H);
      if(use3d()) return;                      // the 3D view paints everything else
      c.fillStyle = sn.ground; c.fillRect(0, 0, W, H);
      var cols = ['#d9574e','#e2a33b','#3fa3a3','#8f5fa8','#4a7fc1','#c96f3f'];
      [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(q, qi){
        var k;
        for(k = 0; k < 2; k++){
          var sw = u*1.6, sh = u*(1.5 + ((qi + k) % 3)*0.4);
          var sx = G.cx + q[0]*(box + u*0.5 + k*sw*1.1) - (q[0] > 0 ? 0 : sw);
          var sy = G.cy + q[1]*(box + u*0.5) - (q[1] > 0 ? 0 : sh);
          c.fillStyle = cols[(qi*2 + k) % cols.length];
          C.rrect(c, sx, sy, sw, sh, 4); c.fill();
          c.fillStyle = sn.snowRoof ? '#f8fcff' : 'rgba(0,0,0,.2)';
          C.rrect(c, sx - 2, sy - 4, sw + 4, 6, 2); c.fill();
        }
      });
      c.fillStyle = '#5c687a';
      c.fillRect(G.cx - box, 0, box*2, H); c.fillRect(0, G.cy - box, W, box*2);
      c.save(); c.setLineDash([u*0.34, u*0.3]); c.strokeStyle = '#f6c945'; c.lineWidth = 3;
      c.beginPath();
      c.moveTo(G.cx, 0); c.lineTo(G.cx, G.cy - box); c.moveTo(G.cx, G.cy + box); c.lineTo(G.cx, H);
      c.moveTo(0, G.cy); c.lineTo(G.cx - box, G.cy); c.moveTo(G.cx + box, G.cy); c.lineTo(W, G.cy);
      c.stroke(); c.restore();
    }
    function drawFlatCar(c, car){
      var col = C.COLORS[car.col % C.COLORS.length], p = posOf(car), u = G.unit;
      var len = u*lenOf(car), wd = u*0.56, r = u*0.16, dep = wd*0.3;
      var ang = -headingOf(car.dir) + (car.state === 'wreck' ? (0.7 - car.wreckT)*9 : 0);
      c.save(); c.translate(p.x, p.y + dep); c.rotate(ang);
      C.rrect(c, -len/2, -wd/2, len, wd, r); c.fillStyle = col.d; c.fill(); c.restore();
      c.save(); c.translate(p.x, p.y); c.rotate(ang);
      C.rrect(c, -len/2, -wd/2, len, wd, r); c.fillStyle = car.bumpT > 0 ? '#ffffff' : car.amb ? '#f6f8fb' : col.c; c.fill();
      if(car.amb){ c.fillStyle = '#e03b30'; c.fillRect(-len*0.4, -wd*0.08, len*0.62, wd*0.16); c.fillRect(-len*0.17, -wd*0.32, wd*0.16, wd*0.64); }
      c.fillStyle = 'rgba(26,38,56,.86)';
      C.rrect(c, len*0.1, -wd*0.36, len*0.24, wd*0.72, r*0.5); c.fill();
      c.restore();
      if(car.held){
        c.strokeStyle = 'rgba(255,59,48,.9)'; c.lineWidth = 3;
        c.beginPath(); c.arc(p.x, p.y, u*0.72, 0, Math.PI*2); c.stroke();
      }
    }

    /* Flashing lights over each ambulance on the road. */
    function drawSirens(c){
      S.cars.forEach(function(car){
        if(!car.amb || car.state !== 'run') return;
        var w = worldOf(car), p = use3d() ? view3d.project(w.x, w.z, 0.85) : {x:G.cx + w.x*G.unit, y:G.cy + w.z*G.unit - G.unit*0.3};
        var on = Math.floor(S.time*8) % 2, r = Math.max(5, G.unit*0.1);
        [[-1, on ? '#ff3b30' : '#7a1a14'], [1, on ? '#1e5bd8' : '#4aa0ff']].forEach(function(l){
          c.fillStyle = l[1]; c.globalAlpha = 0.35; c.beginPath(); c.arc(p.x + l[0]*r*1.2, p.y, r*2.2, 0, Math.PI*2); c.fill();
          c.globalAlpha = 1; c.beginPath(); c.arc(p.x + l[0]*r*1.2, p.y, r, 0, Math.PI*2); c.fill();
        });
      });
    }
    /* A small stop sign floating over every braked vehicle. */
    function drawStopSigns(c){
      S.cars.forEach(function(car){
        if(!car.held || car.state !== 'run') return;
        var w = worldOf(car), p = use3d() ? view3d.project(w.x, w.z, 1.15) : {x:G.cx + w.x*G.unit, y:G.cy + w.z*G.unit - G.unit*0.7};
        var r = Math.max(9, G.unit*0.2), bob = Math.sin(S.time*6 + car.i)*1.5;
        c.save(); c.translate(p.x, p.y + bob);
        C.shapePath(c, 'octagon', 0, 2, r); c.fillStyle = 'rgba(15,22,34,.35)'; c.fill();
        C.shapePath(c, 'octagon', 0, 0, r); c.fillStyle = '#e5352b'; c.fill();
        c.lineWidth = 2; c.strokeStyle = '#ffffff'; c.stroke();
        c.fillStyle = '#ffffff'; c.fillRect(-r*0.55, -r*0.17, r*1.1, r*0.34);
        c.restore();
      });
    }

    /* Arrows on the edge of the screen for vehicles about to drive in, or
       still off-screen, so a car from the side road never comes as a surprise. */
    function drawIncoming(c){
      var top = G.top + 20, bot = G.H - 6, pad = 20, i;
      for(i = 0; i < S.cars.length; i++){
        var car = S.cars[i], soon;
        if(car.state === 'pending') soon = C.clamp(1 - (car.at - S.time)/2.2, 0, 1);
        else if(car.state === 'run' && car.p < 0) soon = 1;
        else continue;
        if(soon <= 0) continue;
        var ref = car.state === 'pending' ? {dir:car.dir, p:-TL.LANE_IN + 0.6, kind:car.kind} : car;
        var sp = posOf(ref);
        var x = sp.x, y = sp.y, onScreen = x > pad && x < G.W - pad && y > top && y < bot;
        if(onScreen) continue;
        x = C.clamp(x, pad, G.W - pad); y = C.clamp(y, top + 8, bot - 14);
        var ang = car.dir === 'N' ? Math.PI/2 : car.dir === 'S' ? -Math.PI/2 : car.dir === 'W' ? 0 : Math.PI;
        var col = C.COLORS[car.col % C.COLORS.length], pul = 1 + 0.12*Math.sin(S.time*10);
        c.save(); c.translate(x, y); c.rotate(ang); c.scale(pul, pul);
        c.globalAlpha = 0.35 + 0.65*soon;
        c.fillStyle = 'rgba(15,22,34,.55)';
        C.poly(c, [[15, 0], [-9, -13], [-4, 0], [-9, 13]]); c.fill();
        c.fillStyle = col.c; c.strokeStyle = '#ffffff'; c.lineWidth = 2.4; c.lineJoin = 'round';
        C.poly(c, [[13, 0], [-9, -11], [-5, 0], [-9, 11]]); c.fill(); c.stroke();
        c.restore();
      }
      c.globalAlpha = 1;
    }

    /* The score bar: how far along you are, the mark you must reach, and
       where the second and third stars sit. */
    function drawScoreBar(c){
      var x = 14, w = G.W - 28 - 70, h = 16, y = G.top - 22, f = C.clamp(S.score/maxPts, 0, 1), i;
      var grow = S.pulse > 0 ? 1 + 0.5*S.pulse : 1;
      c.fillStyle = 'rgba(18,26,38,.62)'; C.rrect(c, x, y, w, h, 8); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2; C.rrect(c, x, y, w, h, 8); c.stroke();
      if(f > 0){
        var gr = c.createLinearGradient(x, 0, x + w, 0);
        if(S.score >= goal.pass){ gr.addColorStop(0, '#36b44a'); gr.addColorStop(1, '#8be096'); }
        else { gr.addColorStop(0, '#ff8a1f'); gr.addColorStop(1, '#ffd34d'); }
        c.fillStyle = gr; C.rrect(c, x + 3, y + 3, Math.max(h - 6, (w - 6)*f), h - 6, 5); c.fill();
      }
      [goal.pass, goal.two, goal.three].forEach(function(g2, gi){
        var tx = x + 3 + (w - 6)*g2/maxPts, hit = S.score >= g2;
        c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(tx, y + 2); c.lineTo(tx, y + h - 2); c.stroke();
        C.shapePath(c, 'star', tx, y - 9, (hit ? 7.5 : 6.5)*(hit && gi === 0 ? grow : 1));
        c.fillStyle = hit ? '#ffd34d' : 'rgba(255,255,255,.55)'; c.fill();
        c.strokeStyle = 'rgba(40,30,0,.55)'; c.lineWidth = 1.2; c.stroke();
      });
      for(i = 0; i < 3; i++){                       // crash strikes
        var sx2 = G.W - 20 - i*20, sy2 = y + h/2;
        c.beginPath(); c.arc(sx2, sy2, 7, 0, Math.PI*2);
        c.fillStyle = i < S.crashes ? '#e03b30' : 'rgba(255,255,255,.8)'; c.fill();
        c.strokeStyle = 'rgba(20,28,40,.55)'; c.lineWidth = 1.5; c.stroke();
        if(i < S.crashes){
          c.strokeStyle = '#fff'; c.lineWidth = 2; c.lineCap = 'round';
          c.beginPath(); c.moveTo(sx2 - 3, sy2 - 3); c.lineTo(sx2 + 3, sy2 + 3);
          c.moveTo(sx2 + 3, sy2 - 3); c.lineTo(sx2 - 3, sy2 + 3); c.stroke();
        }
      }
    }

    function draw(c){
      var i;
      c.save();
      if(S.shakeT > 0){
        var k = S.shakeT*14;
        c.translate(Math.sin(k*3.1)*6*S.shakeT, Math.cos(k*2.7)*6*S.shakeT);
      }
      if(use3d()){
        view3d.sync(S.cars, worldOf, S.time);
        view3d.drawTo(c);
      } else {
        for(i = 0; i < S.cars.length; i++){
          if(S.cars[i].state === 'run' || S.cars[i].state === 'wreck') drawFlatCar(c, S.cars[i]);
        }
      }
      drawIncoming(c);
      drawSirens(c); drawStopSigns(c);
      if(S.nearMiss > 0){
        c.fillStyle = 'rgba(255,200,60,' + (S.nearMiss*0.3) + ')'; c.fillRect(0, 0, G.W, G.H);
      }
      for(i = 0; i < S.parts.length; i++){
        var p2 = S.parts[i];
        c.globalAlpha = Math.max(0, 1 - p2.t/p2.life);
        c.fillStyle = p2.c; c.fillRect(p2.x - 3, p2.y - 3, 6, 6);
      }
      c.globalAlpha = 1;
      for(i = 0; i < S.floats.length; i++){
        var f = S.floats[i];
        c.globalAlpha = Math.max(0, 1 - f.t/1.0);
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = '20px "Lilita One", Nunito, sans-serif';
        c.lineWidth = 4; c.strokeStyle = 'rgba(20,28,40,.8)';
        c.strokeText(f.txt, f.x, f.y - 18 - f.t*38);
        c.fillStyle = f.bad ? '#ff7a6c' : '#ffe066';
        c.fillText(f.txt, f.x, f.y - 18 - f.t*38);
      }
      c.globalAlpha = 1;
      c.restore();
      drawScoreBar(c);
      C.drawSnow(c, flakes);
    }

    inst.tapSlop = 70;                                // pushing a vehicle with a swipe works like a tap
    inst.layout = layout; inst.paintStatic = paintStatic; inst.update = update; inst.draw = draw;
    inst.down = down; inst.booster = booster; inst.boosterState = boosterState; inst.hud = hud;
    inst.dispose = function(){ if(view3d){ view3d.dispose(); view3d = null; } };
    inst.__S = S; inst.__pos = posOf; inst.__reach = reachable; inst.__goal = goal; inst.__max = maxPts; inst.__level = level;

    inst.canEase = true;

    inst.coachMove = function(){

  }

  window.Games = window.Games || {};
  window.Games.traffic = {
    id:'traffic', titleKey:'gameTraffic', boosters:['allstop'],
    generate:function(n){ return TL.generate(n); },

})();

<script>
/* Trouve le changement: two photos of the same Montréal street. Some things

   - the photos are real 3D renders of a busy street, as large as the screen
     allows, and nothing moves over them (no falling leaves to mistake for a
     difference);

     says what it was ("Door colour", "New cat");

     tap costs five seconds, and the stars come from how fast you were;

(function(){

        mailbox:'mailbox', cone:'cone', ticone:'Ti-Cône', cat:'cat', bench:'bench', car:'car', van:'van',
        lightOn:'Light on', lightOff:'Light off', colour:'{n} colour', gone:'{n} gone', 'new':'New {n}', swap:'{n} to {m}',
        intro:'Find {n} changes', combo:'Combo!', timeUp:'Time’s up!', timeUpSub:'You found {f} of {n}. The ones you missed were circled in red. You’ll get them next time!'},
    fr:{house:'maison', shop:'commerce', awning:'auvent', door:'porte', flowers:'fleurs', dish:'antenne', tree:'arbre',
        pine:'sapin', lamp:'lampadaire', sign:'panneau', person:'passant', tuque:'tuque', hydrant:'borne-fontaine', bin:'poubelle',
        mailbox:'boîte aux lettres', cone:'cône', ticone:'Ti-Cône', cat:'chat', bench:'banc', car:'auto', van:'camionnette',
        lightOn:'Lumière allumée', lightOff:'Lumière éteinte', colour:'Couleur : {n}', gone:'En moins : {n}', 'new':'En plus : {n}', swap:'{n} → {m}',
        intro:'Trouve {n} changements', combo:'Combo!', timeUp:'Temps écoulé!', timeUpSub:'Tu en as trouvé {f} sur {n}. Ceux qui t’ont échappé étaient encerclés en rouge. La prochaine fois, c’est la bonne!'}

  function create(level, n, api){
    var S = {

    if(api.ease){ S.T = S.left = Math.round(level.time*(1 + 0.35*api.ease)); }   // lost twice: more time on the clock
    var G = null, view = null, imgs = [null, null], boxes = [{}, {}], is3d = false, tapMap = null;
    var inst = {

      boosters:['zoom'], subtitle:null, showHud:true

    var itemById = {};
    level.items.forEach(function(it){ itemById[it.id] = it; });

    /* ---------- layout: two photos, stacked on a tall screen ---------- */
    function layout(g){

      G.top = 62;

      // band above the photos showing the neighbourhood's skyline.

      if(G.band < 56) G.band = 0;

      } else {

        var y1 = G.top + (availH - sideH)/2;

      }

    }
    function renderPhotos(){
      boxes = [{}, {}];
      imgs = [null, null]; tapMap = null;
      var K = window.Kit3D;
      is3d = !!(level.rich && K && K.available());
      if(!is3d) return;
      try {
        if(!view) view = K.findView(level.items, level.edits.map(function(e){ return e.id; }));
        var cv = document.getElementById('cv'), px = cv && cv.width ? cv.width/G.W : 2;
        var w = Math.round(G.paneW*px), h = Math.round(G.paneH*px);
        var f = Math.min(1, Math.sqrt(1.6e6/(w*h)));
        w = Math.max(2, Math.round(w*f)); h = Math.max(2, Math.round(h*f));
        imgs = [view.render(0, w, h), view.render(1, w, h)];

    }

    /* ---------- where things are on each photo ---------- */
    var CAM = FL.CAM;
    /* The flat drawing's camera: the same pinhole as the 3D one. */
    function flatCam(){
      var asp = G.paneW/G.paneH, t = Math.tan(CAM.fov*Math.PI/360);

      var fy = CAM.ty - py, fz = CAM.tz - pz, fl = Math.hypot(fy, fz); fy /= fl; fz /= fl;

    function project(p, x, y, z){
      // the camera has no yaw or roll: right is +x, forward is (0, fy, fz),
      // and up is right crossed with forward, (0, -fz, fy)
      var k = flatCam(), dx = x - k.px, dy = y - k.py, dz = z - k.pz;
      var depth = dy*k.fy + dz*k.fz, up = -dy*k.fz + dz*k.fy;

      var P = G.panes[p];

    }
    function shownIn(it, p){ return !(p === 0 ? it.only === 'B' : it.only === 'A'); }
    /* The tap circle for a difference on photo p, in game units. */
    function hitBox(p, id){
      if(boxes[p][id]) return boxes[p][id];
      var it = itemById[id], P = G.panes[p], b;
      if(!it) return null;
      var ring = null;
      function toPane(r){ return {x0:P.x + r.x0*G.paneW, x1:P.x + r.x1*G.paneW, y0:P.y + r.y0*G.paneH, y1:P.y + r.y1*G.paneH}; }
      if(is3d && view){
        var r = view.box(p, id, G.paneW/G.paneH);
        if(!r) return null;
        b = toPane(r);
        if(r.f) ring = toPane(r.f);
      } else {
        var kind = p === 1 && it.kindB ? it.kindB : it.kind, sz = FL.SIZE[kind] || [1, 1];
        var f = project(p, it.x, it.y || 0, it.z), w = sz[0]*f.ppm, h = sz[1]*f.ppm;
        b = {x0:f.x - w/2, x1:f.x + w/2, y0:f.y - h, y1:f.y};

    function down(x, y){

      if(pane < 0) return;
      var best = tapMap ? pickAt(pane, x, y) : boxPick(pane, x, y);
      if(best === 'again') return;                  // a change already found: no harm done
      if(best) found(best, pane);

    /* 3D: read the tap map under the finger; a near miss still counts if a

    function pickAt(pane, x, y){
      var P = G.panes[pane], M = tapMap, sx = M.w/G.paneW;
      var u = Math.round((x - P.x)*sx), v = Math.round((y - P.y)*sx), R = Math.round(12*sx), best = null, bd = 1e9;
      var k0 = u >= 0 && v >= 0 && u < M.w && v < M.h ? M.id[v*M.w + u] : 0;

      for(var i = 0; i < level.edits.length; i++){
        var e = level.edits[i], b = hitBox(pane, e.id);
        if(!b) continue;
        var inBox = Math.abs(x - b.x) <= b.w/2 + 6 && Math.abs(y - b.y) <= b.h/2 + 6;
        if(S.found[e.id]){ if(inBox) again = true; continue; }
        if(inBox){ var area = b.w*b.h; if(area < bestA){ bestA = area; best = e; } }

    /* A spot that taps change id on photo p (for tests). */
    function tapPoint(p, id){
      var b = hitBox(p, id);

        var e = level.edits.filter(function(q){ return q.id === id; })[0], saved = S.found;

    }

          var a = k/10*Math.PI*2 + Math.random()*0.3;
          S.sparks.push({x:bb.rx, y:bb.ry, vx:Math.cos(a)*(70 + Math.random()*50), vy:Math.sin(a)*(70 + Math.random()*50), t:0,
                         c:k % 2 ? '#ffd34d' : '#ffffff'});
        }
      }

      var coins = 8;
      if(S.combo > 0){
        coins += 4; S.bonus += 4; S.left = Math.min(S.T, S.left + COMBO_TIME);
        S.floats.push({x:G.W/2, y:G.panes[0].y + 22, t:0, txt:word('combo') + ' +' + COMBO_TIME + 's', col:'#ff8a1f', big:true});

      }

    }
    function win(){
      S.over = true; S.winT = 0;

      inst.result = {stars:stars, coins:S.nFound*8 + S.bonus};
      C.sfx.win(); api.refresh();
    }
    function timeUp(){

    }
    function booster(id){
      if(id !== 'zoom' || S.over) return false;

      if(!left.length){ api.toast(C.t('noMoves')); return false; }
      if(!api.spend(C.COST.zoom)) return false;

    }
    function boosterState(){ return {disabled:S.over, on:S.hintT > 0, cost:C.COST.zoom}; }
    function hud(){ return {main:S.nFound + '/' + level.edits.length, sub:C.t('found')}; }

          api.refresh();
        }
      }
      if(S.shakeT > 0) S.shakeT -= dt;
      if(S.hintT > 0){ S.hintT -= dt; if(S.hintT <= 0) S.hintId = null; }
      if(S.winT >= 0) S.winT += dt;
      var i;
      for(i = 0; i < S.rings.length; i++) S.rings[i].t += dt;
      age(S.misses, 0.7, dt); age(S.floats, 1.1, dt); age(S.chips, 1.9, dt); age(S.sparks, 0.55, dt);
      for(i = 0; i < S.sparks.length; i++){ var s = S.sparks[i]; s.x += s.vx*dt; s.y += s.vy*dt; s.vx *= 0.9; s.vy *= 0.9; }
    }
    function age(list, life, dt){ for(var i = list.length - 1; i >= 0; i--){ list[i].t += dt; if(list[i].t > life) list.splice(i, 1); } }

    /* ---------- the flat street, when there is no 3D ---------- */
    var M2U = {house:8.2, shop:7.4, pine:8.6, tree:6.2, lamp:6.4, car:9.2, cone:19, sign:14, bench:17, hydrant:24, person:14.4};
    function flatScene(c, p){
      var sn = C.season(), P = G.panes[p];
      function band(z0, z1, col){
        var a = project(p, 0, 0, z0).y, b = project(p, 0, 0, z1).y;
        c.fillStyle = col; c.fillRect(P.x, a, G.paneW, b - a + 1);
      }

      c.beginPath(); c.moveTo(P.x, dash.y); c.lineTo(P.x + G.paneW, dash.y); c.stroke(); c.restore();

      list.sort(function(a, b){ return a.z - b.z; });
      list.forEach(function(it){
        var kind = p === 1 && it.kindB ? it.kindB : it.kind;
        var hue = p === 1 && it.hueB != null ? it.hueB : it.hue;

    }
    function drawFlat(c, kind, hue, it, x, y, ppm){

      var s = ppm/(M2U[kind] || 10), col = HUE[(hue || 0) % HUE.length];
      c.save(); c.translate(x, y); c.scale(s*(it.rot ? -1 : 1), s);
      switch(kind){
        case 'house':
          c.fillStyle = col; c.fillRect(-23, -58, 46, 58);
          c.fillStyle = 'rgba(0,0,0,.16)'; c.fillRect(16, -58, 7, 58);
          c.fillStyle = '#ffe9b0'; C.rrect(c, -16, -47, 11, 13, 2); c.fill(); C.rrect(c, 2, -26, 11, 13, 2); c.fill();
          c.fillStyle = '#cfe0ef'; C.rrect(c, 2, -47, 11, 13, 2); c.fill(); C.rrect(c, -16, -26, 11, 13, 2); c.fill();
          c.fillStyle = C.season().snowRoof ? '#f8fcff' : 'rgba(0,0,0,.2)'; C.rrect(c, -26, -63, 52, 6, 2); c.fill();
          break;
        case 'shop':
          c.fillStyle = col; c.fillRect(-25, -40, 50, 40);
          c.fillStyle = '#2e3a4a'; C.rrect(c, -20, -22, 18, 22, 2); c.fill();
          c.fillStyle = '#7a4a2c'; C.rrect(c, 7, -20, 12, 20, 2); c.fill();

        case 'pine':
          c.fillStyle = '#6a4a30'; c.fillRect(-2, -7, 4, 8);
          for(var q = 0; q < 3; q++){ var pw = 26 - q*6, py = -5 - q*11; c.fillStyle = C.season().pine[q]; C.poly(c, [[-pw/2, py], [pw/2, py], [0, py - 15]]); c.fill(); }

        case 'tree':
          c.strokeStyle = '#7a5a3c'; c.lineWidth = 3; c.lineCap = 'round';
          c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -20); c.stroke();
          c.fillStyle = C.season().leaves || '#cfd8e2';
          [[0,-24,11],[-9,-19,8],[9,-20,8]].forEach(function(t){ c.beginPath(); c.arc(t[0], t[1], t[2], 0, Math.PI*2); c.fill(); });
          break;

          c.strokeStyle = '#3c4654'; c.lineWidth = 2.6; c.lineCap = 'round';
          c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -28); c.stroke();
          c.fillStyle = '#ffd98a'; c.beginPath(); c.arc(0, -31, 4, 0, Math.PI*2); c.fill();
          break;
        case 'car':
          c.fillStyle = col; C.rrect(c, -19, -12, 38, 14, 5); c.fill(); C.rrect(c, -11, -21, 22, 11, 4); c.fill();
          c.fillStyle = '#26384f'; C.rrect(c, -8, -19, 8, 7, 2); c.fill(); C.rrect(c, 1, -19, 7, 7, 2); c.fill();
          c.fillStyle = '#2b3342'; c.beginPath(); c.arc(-10, 2, 4.6, 0, Math.PI*2); c.arc(10, 2, 4.6, 0, Math.PI*2); c.fill();
          break;
        case 'cone': C.drawCone(c, 0, -6, 22, 0); break;
        case 'sign':
          c.strokeStyle = '#8d99a8'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -22); c.stroke();

          break;
        case 'bench':
          c.fillStyle = col; C.rrect(c, -16, -12, 32, 5, 2); c.fill(); C.rrect(c, -16, -5, 32, 5, 2); c.fill();
          c.fillStyle = '#4a5260'; c.fillRect(-14, -1, 3, 7); c.fillRect(11, -1, 3, 7);

    /* ---------- painting ---------- */
    function paintStatic(c){
      var g = c.createLinearGradient(0, 0, 0, G.H);
      g.addColorStop(0, '#e7eef7'); g.addColorStop(1, '#f4f8fc');
      c.fillStyle = g; c.fillRect(0, 0, G.W, G.H);
      var PL = window.Places;
      if(G.band && G.stacked && PL && PL.current()){
        var bx = G.panes[0].x - 5, bw = G.paneW + 10, by = G.top + 2;
        c.save(); C.rrect(c, bx, by, bw, G.band, 12); c.clip(); PL.drawBand(c, bx, by, bw, G.band, {}); c.restore();
      }

    }
    function paintPhoto(c, p){
      var P = G.panes[p], W = G.paneW, H = G.paneH, sn = C.season();

      c.fillStyle = '#ffffff'; C.rrect(c, P.x - 5, P.y - 5, W + 10, H + 10, 14); c.fill();

    function draw(c){

        for(i = 0; i < 2; i++){
          var hb = hitBox(i, S.hintId);
          if(!hb) continue;
          c.strokeStyle = 'rgba(154,95,208,' + (0.45 + pul*0.5) + ')'; c.lineWidth = 4;
          c.beginPath(); c.arc(hb.rx, hb.ry, hb.r + 4 + pul*6, 0, Math.PI*2); c.stroke();
        }
      }
      // time is up: show what was missed
      if(S.revealT >= 0){
        var a = Math.min(1, S.revealT/0.3), pr = 1 + Math.sin(S.time*7)*0.06;
        level.edits.forEach(function(e){
          if(S.found[e.id]) return;
          for(var p = 0; p < 2; p++){
            var bb = hitBox(p, e.id);
            if(!bb) continue;
            c.globalAlpha = a; c.lineWidth = 6; c.strokeStyle = 'rgba(255,255,255,.9)';
            c.beginPath(); c.arc(bb.rx, bb.ry, bb.r*pr, 0, Math.PI*2); c.stroke();
            c.lineWidth = 3.4; c.strokeStyle = '#e03b30';
            c.beginPath(); c.arc(bb.rx, bb.ry, bb.r*pr, 0, Math.PI*2); c.stroke();

        c.beginPath(); c.moveTo(m.x - d, m.y - d); c.lineTo(m.x + d, m.y + d); c.moveTo(m.x + d, m.y - d); c.lineTo(m.x - d, m.y + d); c.stroke();

        if(!cb) continue;

        var al = t < 0.15 ? t/0.15 : t > 1.5 ? Math.max(0, 1 - (t - 1.5)/0.4) : 1;
        c.globalAlpha = al;
        c.font = '900 14px Nunito, sans-serif';
        var tw = c.measureText(ch.txt).width + 20, cx = C.clamp(ch.x, tw/2 + 6, G.W - tw/2 - 6), cy = Math.max(G.top + 12, ch.y - t*10);
        c.fillStyle = '#2fae47'; C.rrect(c, cx - tw/2, cy - 13, tw, 26, 13); c.fill();

        c.fillText(ch.txt, cx, cy + 1);
      }
      c.globalAlpha = 1;
      for(i = 0; i < S.floats.length; i++){
        var f = S.floats[i];

        c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,.9)'; c.strokeText(f.txt, f.x, f.y - f.t*26);

      C.rrect(c, bx, by - 6, bw, 12, 6); c.fillStyle = 'rgba(120,134,152,.22)'; c.fill();
      if(frac > 0){ C.rrect(c, bx, by - 6, Math.max(12, bw*frac), 12, 6); c.fillStyle = col; c.fill(); }
      // star marks: finish before the bar passes them
      [0.5, 0.2].forEach(function(m){
        var mx = bx + bw*m;
        c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(mx - 1, by - 6, 2, 12);
      });
      var secs = Math.max(0, Math.ceil(S.left));
      c.font = '400 ' + (urgent ? 20 : 18) + 'px "Lilita One", Nunito, sans-serif';
      c.textAlign = 'right'; c.textBaseline = 'middle';
      c.fillStyle = urgent && Math.floor(S.time*4) % 2 ? '#e03b30' : '#3a4659';
      c.fillText(secs + 's', bx - 8, by + 1);
    }

    inst.layout = layout; inst.paintStatic = paintStatic; inst.update = update; inst.draw = draw;
    inst.down = down; inst.booster = booster; inst.boosterState = boosterState; inst.hud = hud;
    inst.dispose = function(){ if(view){ view.dispose(); view = null; } };
    inst.__S = S; inst.__hitBox = hitBox; inst.__edits = level.edits; inst.__level = level;
    inst.__is3d = function(){ return is3d; }; inst.__label = labelFor; inst.__tapPoint = tapPoint;
    inst.canEase = true;
    /* The coach: the first time (or after a loss), a hand taps one change. */
    var coachId = null;
    inst.coachNow = function(){ return S.tut === 1 && S.time > INTRO + 0.6 && !S.over; };
    inst.coachMove = function(){
      if(S.over || S.time < INTRO || !(S.tut || (api.fails || 0) >= 1)) return null;
      if(!coachId || S.found[coachId]){
        var left = level.edits.filter(function(e){ return !S.found[e.id]; });
        coachId = left.length ? left[0].id : null;
      }
      if(!coachId) return null;
      var tp = tapPoint(1, coachId) || tapPoint(0, coachId);

    if(api.firstTime) S.tut = 1;
    return inst;
  }

  window.Games = window.Games || {};
  window.Games.find = {
    id:'find', titleKey:'gameFind', boosters:['zoom'],
    generate:function(n){ return FL.generate(n); },
    create:create

})();

<script>
/* Kit3D: the game's 3D toolbox, built on three.js.

   One WebGL renderer is shared by everything. A scene is rendered off-screen
   and painted onto whichever 2D canvas asked for it, so the rest of the game
   keeps drawing the way it always has.

   What lives here:
   - models: vehicles, traffic cones, trees, lamps, Montréal triplexes with
     their outdoor staircases, shops, a métro kiosk, an office tower
   - views: the bus lot (lotView), the traffic junction (trafficView) and the
     home screen diorama (homeView)

  /* ---------- lighting ---------- */
  function lights(scene, o){
    var hemi = o.hemi == null ? 0.72 : o.hemi, sunI = o.sun == null ? 0.55 : o.sun;
    // under the premium look the sky environment supplies most of the fill, so the
    // sun must carry more of the light or shadows wash out
    if(FX.pbr){ hemi *= 0.32; sunI *= 1.55; }
    // a warm sun and a cool sky fill: lit faces glow, shaded faces go blue rather than grey
    var skyHex = o.sky || (FX.pbr ? 0xc4dcff : 0xffffff), sunHex = o.sunHex || (FX.pbr ? 0xfff0d8 : 0xffffff);
    scene.add(new THREE.HemisphereLight(skyHex, o.ground || 0x8d97a6, hemi));
    var sun = new THREE.DirectionalLight(sunHex, sunI);
    sun.position.copy(o.from); sun.target.position.copy(o.to || new THREE.Vector3());
    scene.add(sun); scene.add(sun.target);
    if(o.shadow && (o.fixed || quality().map)){
      sun.castShadow = true;
      if(!o.fixed) o.map = Math.min(o.map || 1024, quality().map);
      var sc = sun.shadow.camera, e = o.shadow;
      sc.left = -e; sc.right = e; sc.top = e; sc.bottom = -e; sc.near = o.near || 0.5; sc.far = o.far || e*6;
      sun.shadow.mapSize.set(o.map || 1024, o.map || 1024);
      sun.shadow.bias = o.bias == null ? -0.0015 : o.bias;
      sun.shadow.normalBias = o.nbias || 0;
      sun.shadow.radius = 2.2;
    }
    return sun;
  }

  /* ---------- the bus lot ----------

  var KX = 0.16, KY = 0.56;
  function lotView(G){
    var W = G.W, H = G.H, R = 9000, px = viewPixels(G);
    var cam = new THREE.Camera();
    cam.projectionMatrix.set(
      2/W, 2*KX/W, 0,    -1,
      0,   2*KY/H, -2/H,  1,
      0,  -1/R,   -KY/R,  0,
      0,   0,      0,     1);
    cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
    var scene = new THREE.Scene(), span = Math.max(W, H)*0.62;
    lights(scene, moodLight({hemi:0.66, sun:0.44, from:new THREE.Vector3(W/2 - 380, 900, H/2 - 250),
                   to:new THREE.Vector3(W/2, 0, H/2), shadow:span, near:100, far:2600, map:2048, bias:-0.002}));
    premium(scene);

    var items = {};

    return {
      kx:KX, ky:KY,
      add:function(id, obj){ items[id] = noCull(obj); scene.add(obj); return obj; },
      get:function(id){ return items[id]; },
      vehicle:function(id, kind, col, len, wid){ return this.add(id, vehicle(kind, col, len, wid, false)); },
      cone:function(id, size){ var c = cone(false); c.scale.setScalar(size); return this.add(id, c); },
      drawTo:function(c){ c.drawImage(render(scene, cam, px.w, px.h, true), 0, 0, W, H); },
      dispose:function(){ disposeScene(scene); }

      if(lmObj){

<script>
/* Kenney: the traffic cone from Kenney's free (CC0) Car Kit, loaded as a
   glTF model. Every vehicle in the game is our own (Kit3D), so they all
   share one look; only the cone comes from here.

   Nothing here is required: if the model fails to load, ready() reports
   false and the game keeps its own drawn cone. Credit: cone and sounds by
   Kenney (www.kenney.nl). */
(function(){
  'use strict';
  var BASE = 'assets/';
  var models = {}, state = 'idle', waiters = [];

  function ready(cb){
    if(state === 'done') return cb(true);
    if(state === 'failed') return cb(false);
    waiters.push(cb);
    if(state === 'loading') return;
    state = 'loading';
    if(!window.THREE || !THREE.GLTFLoader){ finish(false); return; }
    var loader = new THREE.GLTFLoader();
    function parse(){
      var b64 = (window.__KENNEY_GLB || {}).cone;
      if(!b64) return finish(false);
      try {
        var bin = atob(b64), bytes = new Uint8Array(bin.length);
        for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        loader.parse(bytes.buffer, BASE + 'cars/', function(g){ models.cone = prepare(g.scene); finish(true); },
                     function(){ finish(false); });
      } catch(e){ finish(false); }
    }
    // the model comes packed in a script file, because the host serves .js but not .glb
    if(window.__KENNEY_GLB) parse();
    else {
      var sc = document.createElement('script');
      sc.src = BASE + 'cars/models.js';
      sc.onload = parse;
      sc.onerror = function(){ finish(false); };
      document.head.appendChild(sc);
    }
  }
  function finish(ok){
    state = ok ? 'done' : 'failed';
    var w = waiters; waiters = [];
    w.forEach(function(cb){ cb(ok); });
  }
  function isReady(){ return state === 'done'; }

  /* Plain lit materials: the same look in this art style, cheaper on phones. */
  function prepare(root){
    root.traverse(function(o){
      if(!o.isMesh) return;
      var m = o.material;
      if(m.map){ m.map.encoding = THREE.LinearEncoding; m.map.anisotropy = 4; }
      o.material = new THREE.MeshLambertMaterial({map:m.map || null, color:m.map ? 0xffffff : m.color});
      o.castShadow = true; o.receiveShadow = false;
    });
    return root;
  }
  function cone(size){
    // under the premium look the picture is written out in sRGB, so the texture must be read as sRGB too,
    // or the cone comes out washed out next to everything else
    var pbr = window.Kit3D && window.Kit3D.fx() !== 'off';
    models.cone.traverse(function(o){
      var mp = o.isMesh && o.material.map; if(!mp) return;
      var want = pbr ? THREE.sRGBEncoding : THREE.LinearEncoding;
      if(mp.encoding !== want){ mp.encoding = want; mp.needsUpdate = true; o.material.needsUpdate = true; }
    });
    var c = models.cone.clone(true), g = new THREE.Group();
    c.scale.setScalar(size/0.6); g.add(c);
    return g;
  }

  window.Kenney = {ready:ready, isReady:isReady, cone:cone};
})();
</script>
<script>
/* Lignes de métro: draw each metro line from one terminus to the other.
   Lines cannot cross or share a square, and together they must cover the
   whole map. Small stations on the way must be served by their own line.

   Drawing works like a pen: press on a terminus (or anywhere on a line you
   already drew) and drag. Dragging back over your own line rubs it out;
   dragging across another line cuts it. When a line reaches its other
   terminus a little train starts running on it. */
(function(){
  'use strict';
  var C = window.Core, ML = window.MetroLogic;

  function create(level, n, api){
    var W = level.size, N = W*W, K = level.lines.length, COLS = ML.COLORS;
    var S = {
      paths:{}, done:{}, active:null, strokes:0, changed:false, hints:0,
      time:0, over:false, winT:-1, pops:[], parts:[], floats:[], lastTick:0,
      trains:{}, nag:0, tut:0, emptyPulse:0, nudge:-1, ghosts:[], freeHint:false, freeUsed:false
    };
    var termAt = {}, stopAt = {};
    level.lines.forEach(function(L){
      termAt[L.a] = L.c; termAt[L.b] = L.c; S.paths[L.c] = []; S.done[L.c] = false;
      L.stops.forEach(function(s){ stopAt[s] = L.c; });
    });
    var G = null;
    var inst = {status:'play', result:null, lose:null, tip:null, boosters:['hint'], subtitle:null, showHud:true};

    /* ---------- geometry ---------- */
    function layout(g){
      G = g;
      G.top = 70;
      var avW = g.W - 44, avH = g.H - G.top - 26;
      G.cell = Math.floor(Math.min(avW/W, avH/W));
      G.bw = G.cell*W;
      G.bx = Math.round((g.W - G.bw)/2);
      // when there is room, the street above the station shows through a window
      var spare = avH - G.bw;
      G.band = spare >= 120 ? Math.min(250, spare - 44) : 0;
      G.by = G.band ? Math.round(G.top + G.band + 34) : Math.round(G.top + (avH - G.bw)/2 + 4);
    }
    function cxy(cell){ var x = cell % W, y = (cell - x)/W; return {x:G.bx + (x + 0.5)*G.cell, y:G.by + (y + 0.5)*G.cell}; }
    function cellAt(px, py){
      var x = Math.floor((px - G.bx)/G.cell), y = Math.floor((py - G.by)/G.cell);
      if(x < 0 || y < 0 || x >= W || y >= W) return -1;
      return y*W + x;
    }
    function ownerOf(cell){
      for(var c in S.paths) if(S.paths[c].indexOf(cell) >= 0) return +c;
      return -1;
    }
    function lineOf(c){ return level.lines[c]; }

    /* ---------- drawing a line ---------- */
    function press(px, py){
      var cell = cellAt(px, py);

        var c = termAt[cell];
        S.paths[c] = [cell]; S.done[c] = false; S.active = c; S.changed = true;
        C.sfx.tap(); C.haptic(6);
        return;

      var o = ownerOf(cell);
      if(o >= 0){
        var p = S.paths[o];
        p.length = p.indexOf(cell) + 1; S.done[o] = false; S.active = o; S.changed = true;
      }
    }
    function drag(px, py){
      if(S.active == null) return;
      var target = cellAt(px, py);
      if(target < 0) return;
      var guard = 0;
      while(guard++ < 24 && S.active != null){             // stops once the line reaches its far end
        var p = S.paths[S.active], last = p[p.length - 1];
        if(last === target) break;
        var lx = last % W, ly = (last - lx)/W, tx = target % W, ty = (target - tx)/W;
        var dx = tx - lx, dy = ty - ly, next;
        var h = dx ? last + (dx > 0 ? 1 : -1) : -1, v = dy ? last + (dy > 0 ? W : -W) : -1;
        next = Math.abs(dx) >= Math.abs(dy) ? h : v;
        // When the finger skipped a square (a quick diagonal swipe), step into a
        // free one rather than cutting through a finished line it never touched.
        var other = next === h ? v : h;
        if(other >= 0 && next !== target && blocked(next) && !blocked(other)) next = other;
        if(!enter(next)) break;
      }
    }
    function blocked(cell){
      var o = ownerOf(cell), t = termAt[cell];
      return (o >= 0 && o !== S.active) || (t != null && t !== S.active);
    }
    /* Step the active line into one neighbouring square. False if it cannot. */
    function enter(cell){
      var c = S.active, p = S.paths[c], last = p[p.length - 1];

      var back = p.indexOf(cell);

      if(S.done[c]) return false;
      var t = termAt[cell];
      if(t != null && t !== c) return false;                       // another line's terminus
      var o = ownerOf(cell);

        var q = S.paths[o]; q.length = q.indexOf(cell); S.done[o] = false;
        C.sfx.bump(); C.haptic(12);
      }
      p.push(cell); S.changed = true;
      if(S.time - S.lastTick > 0.035){ S.lastTick = S.time; C.sfx.board(Math.min(14, p.length)); }
      if(t === c && cell !== p[0]){                                // reached the other terminus
        S.done[c] = true; S.active = null;
        var e = cxy(cell);
        S.pops.push({cell:cell, t:0}); S.pops.push({cell:p[0], t:0});
        burst(e.x, e.y, COLS[c].c, 14);
        S.trains[c] = {s:0, dir:1};
        C.sfx.park(); C.haptic(16);
        if(S.tut){ S.tut = 0; }
      }
      return true;
    }
    function release(){
      if(S.active == null && !S.changed) return;
