  /* ---------- the coach: help drawn on the board itself ----------
     Players look at the middle of the board and at their finger, not at a
     banner. So a game names its next good move (inst.coachMove), and the
     coach shows it there with a hand doing the gesture on the real pieces and
     a few words beside it. It appears at once when a game asks for it (its
     first moves), and after a few idle seconds on early stops or after a
     loss. Any touch hides it. */
  var coach = {idle:0, mv:null, t:0, idleUsed:false, byIdle:false};
  function coachReset(){ coach.idle = 0; coach.mv = null; coach.t = 0; coach.idleUsed = false; coach.byIdle = false; }
  function coachTick(dt){
    if(screen !== 'game' || !game || paused || game.status !== 'play' || !game.coachMove){ coach.mv = null; return; }
    if(ptr){ if(coach.mv && coach.byIdle) coach.idleUsed = true; coach.idle = 0; coach.mv = null; return; }
    coach.idle += dt;
    var fails = game.isDaily || game.isEndless ? 0 : failsAt(gameStop);
    var asked = game.coachNow && game.coachNow();
    var idleAt = fails >= 2 ? 3.5 : fails >= 1 ? 5 : (gameStop <= 12 || game.isDaily) ? 7 : 0;
    // an idle hint comes once per level, unless the player has already lost here
    var due = asked ? coach.idle > 0.4 : C.save.hints !== false && idleAt > 0 && coach.idle > idleAt && (!coach.idleUsed || fails >= 1);
    coach.byIdle = !asked;
    if(!due){ coach.mv = null; return; }
    var mv = game.coachMove();
    if(!mv){ coach.mv = null; return; }
    if(!coach.mv){
      coach.t = 0; if(placeTag.classList.contains('show')) hidePlace();   // the lesson matters more than the postcard
      if(!asked) logPlay('hint');                                          // for testers: where people stalled
    }
    coach.mv = mv; coach.t += dt;
  }
  function drawHand(c, x, y, sc, press){
    c.save(); c.translate(x, y); c.rotate(-0.38); c.scale(sc*(press ? 0.92 : 1), sc*(press ? 0.92 : 1));
    c.shadowColor = 'rgba(0,0,0,.3)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    c.fillStyle = '#ffffff'; c.strokeStyle = '#1b2331'; c.lineWidth = 2.4; c.lineJoin = 'round';
    c.beginPath();                                                       // the pointing finger, then the fist
    c.moveTo(-7, 6); c.arc(0, 6, 7, Math.PI, 0); c.lineTo(7, 30);
    c.quadraticCurveTo(12, 25, 16, 30); c.quadraticCurveTo(21, 27, 24, 33); c.quadraticCurveTo(30, 32, 30, 40);
    c.lineTo(29, 56); c.quadraticCurveTo(28, 70, 14, 72); c.lineTo(0, 72); c.quadraticCurveTo(-12, 70, -15, 60);
    c.lineTo(-21, 44); c.quadraticCurveTo(-23, 36, -15, 37); c.lineTo(-7, 46); c.closePath();
    c.fill(); c.shadowColor = 'transparent'; c.stroke();
    c.beginPath(); c.moveTo(7, 30); c.lineTo(7, 40); c.moveTo(16, 30); c.lineTo(16, 40); c.moveTo(24, 33); c.lineTo(24, 42); c.stroke();
    c.restore();
  }
  function coachBubble(c, txt, x, y, below){
    if(!txt) return;
    c.save();
    c.font = '800 17px Nunito, sans-serif';
    var maxW = Math.min(G.W - 36, 300), words = txt.split(' '), lines = [], cur = '';
    words.forEach(function(w){ var t2 = cur ? cur + ' ' + w : w; if(c.measureText(t2).width > maxW - 28 && cur){ lines.push(cur); cur = w; } else cur = t2; });
    if(cur) lines.push(cur);
    var bw = Math.max.apply(null, lines.map(function(l){ return c.measureText(l).width; })) + 30, bh = lines.length*22 + 18;
    var bx = C.clamp(x - bw/2, 14, G.W - 14 - bw), by = below ? y : y - bh;
    by = C.clamp(by, 74, G.H - bh - 70);
    c.shadowColor = 'rgba(15,22,34,.3)'; c.shadowBlur = 14; c.shadowOffsetY = 4;
    c.fillStyle = '#fffdf7'; C.rrect(c, bx, by, bw, bh, 16); c.fill();
    c.shadowColor = 'transparent'; c.strokeStyle = '#ff8a1f'; c.lineWidth = 3; c.stroke();
    C.clayShade(c, bx, by, bw, bh, .3);
    c.fillStyle = '#1b2331'; c.textAlign = 'center'; c.textBaseline = 'middle';
    lines.forEach(function(l, i){ c.fillText(l, bx + bw/2, by + 20 + i*22); });
    c.restore();
  }
  function drawCoach(c){
    var m = coach.mv; if(!m) return;
    var a = Math.min(1, coach.t*3), sc = Math.max(0.8, Math.min(1.05, G.W/400));
    c.save(); c.globalAlpha = a;
    var pts = m.path || (m.kind === 'tap' ? [{x:m.x, y:m.y}] : [{x:m.x, y:m.y}, {x:m.x2, y:m.y2}]);
    var p0 = pts[0], pe = pts[pts.length - 1], per = m.kind === 'tap' ? 1.1 : m.kind === 'swipe' ? 1.2 : 1.8;
    var ph = (coach.t % per)/per, hx, hy, press = false, i;
    // rings on where the move starts and ends
    var pr = 1 + ((coach.t*1.3) % 1)*0.5;
    c.strokeStyle = 'rgba(255,170,40,' + (1 - (pr - 1)*1.6) + ')'; c.lineWidth = 4;
    c.beginPath(); c.arc(p0.x, p0.y, (m.r || 26)*pr, 0, Math.PI*2); c.stroke();
    if(m.kind === 'drag'){ c.strokeStyle = 'rgba(62,224,122,.85)'; c.setLineDash([8, 6]); c.lineDashOffset = -coach.t*30;
      c.beginPath(); c.arc(pe.x, pe.y, (m.r2 || m.r || 26), 0, Math.PI*2); c.stroke(); c.setLineDash([]); }

      var lift = ph < 0.3 ? 1 - ph/0.3 : ph > 0.7 ? (ph - 0.7)/0.3 : 0;
      hx = p0.x + lift*18; hy = p0.y + lift*26;
      if(ph > 0.3 && ph < 0.8){ var rr = (ph - 0.3)/0.5; c.strokeStyle = 'rgba(255,255,255,' + (1 - rr) + ')'; c.lineWidth = 3;
        c.beginPath(); c.arc(p0.x, p0.y, 12 + rr*30, 0, Math.PI*2); c.stroke(); }
    } else {
      // press, travel along the path, let go
      var u = ph < 0.15 ? 0 : ph < 0.75 ? (function(v){ return v*v*(3 - 2*v); })((ph - 0.15)/0.6) : 1;
      press = ph > 0.08 && ph < 0.82;

      for(i = 1; i < pts.length; i++){ tot += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); lens.push(tot); }
      var want = u*tot, k = 1; while(k < pts.length - 1 && lens[k] < want) k++;

        c.globalAlpha = a*(ph > 0.85 ? Math.max(0, 1 - (ph - 0.85)/0.15) : 0.9);

  /* ---------- screens ---------- */
  /* A play log for testers: which stop, how long, how it ended. It stays on
     this device (no names, nothing sent anywhere); Settings copies it so a
     tester can paste it into a message. */
  var playT0 = Date.now();
  function logPlay(e, extra){
    try {
      if(!game && e !== 'start') return;
      var L = C.save.plog || (C.save.plog = []);
      var rec = {e:e, s:gameStop, g:game ? (game.isDaily ? 'daily' : game.isEndless ? 'endless' : gameFor(gameStop)) : '',
                 sec:Math.round((Date.now() - playT0)/1000), at:new Date().toISOString().slice(0, 16)};
      for(var k in (extra || {})) rec[k] = extra[k];
      L.push(rec); if(L.length > 500) L.splice(0, L.length - 500);
      C.persist();
    } catch(err){}
  }
  function playLogText(){
    var L = C.save.plog || [], by = {}, out = [];
    L.forEach(function(r){
      if(r.g === 'endless' || r.g === 'daily' || !r.s) return;
      var o = by[r.s] || (by[r.s] = {g:r.g, tries:0, wins:0, lost:0, quit:0, secs:[], stars:0, hints:0, skip:0});
      if(r.e === 'hint') o.hints++;
      if(r.e === 'skip') o.skip++;
      if(r.e === 'start') o.tries++;
      if(r.e === 'win'){ o.wins++; o.secs.push(r.sec); o.stars = Math.max(o.stars, r.stars || 0); }
      if(r.e === 'lose') o.lost++;
      if(r.e === 'quit' || r.e === 'retry') o.quit++;
    });
    out.push('Détour play log (' + new Date().toISOString().slice(0, 10) + ')');
    out.push('stop, game, tries, wins, lost, gave up, stalled (hand shown), skipped, best stars, seconds to win');
    Object.keys(by).sort(function(a, b){ return a - b; }).forEach(function(s){
      var o = by[s]; out.push([s, o.g, o.tries, o.wins, o.lost, o.quit, o.hints, o.skip, o.stars, o.secs.join(' ')].join(', '));
    });
    out.push(''); out.push(JSON.stringify(L.slice(-200)));
    return out.join('\n');
  }
  function goMap(scrollToStop){
    if(game && game.status === 'play') logPlay('quit');
    if(game && game.dispose) game.dispose();
    screen = 'map'; game = null; paused = false;
    Places.leave(); hidePlace(); C.setMusic('calm');
    tip(null); layoutMap();
    if(scrollToStop){
      var want = (scrollToStop - 1)*map.spacing - G.H*0.45;
      map.scroll = C.clamp(want, 0, map.maxScroll);
    }
    buildBar(); bgDirty = true; refresh();
  }
  /* Every stop happens somewhere real; say where as the level opens. */
  var placeTag = $('#placeTag'), placeTimer = 0, pendingPlace = null;
  function esc(t){ return String(t).replace(/[&<>"]/g, function(ch){ return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[ch]; }); }
  Places.onPhoto(function(){ bgDirty = true; });     // a stop's photo arrived: repaint its scenery
  // the banner steps aside as soon as the player starts
  stage.addEventListener('pointerdown', function(){ if(placeTag.classList.contains('show')) hidePlace(); }, true);
  function showPlace(p){
    clearTimeout(placeTimer); placeTag.classList.remove('show');
    if(!p) return;
    placeTag.querySelector('b').textContent = Places.name(p);
    placeTag.querySelector('.ar').textContent = Places.area(p) === Places.name(p) ? '' : Places.area(p);
    placeTag.querySelector('p').textContent = Places.fact(p);
    var ph = placeTag.querySelector('.ph'), src = Places.photoSrc(p);
    ph.hidden = !src; placeTag.querySelector('.pin').hidden = !!src;
    if(src) ph.src = src;
    placeTag.querySelector('.by').textContent = Places.photoBy(p);
    var waited = 0;
    (function reveal(){
      // a tutorial tip has the top of the screen first; the place waits its turn
      if(tipEl.classList.contains('show') && waited < 30000){ waited += 400; placeTimer = setTimeout(reveal, 400); return; }
      placeTag.classList.add('show');
      placeTimer = setTimeout(function(){ placeTag.classList.remove('show'); }, 4200);
    })();
  }
  function hidePlace(){ clearTimeout(placeTimer); placeTag.classList.remove('show'); pendingPlace = null; }
  function startStop(stop){
    var id = gameFor(stop), n = levelNumFor(stop), fin = isFinale(stop);
    var mod = Games[id], place = Places.forStop(stop);
    Places.enter(place); hidePlace();
    if(fin) n += 4;                                   // the finale plays like a much later level (the tenth bus)
    var level = mod.generate(n);
    var firstTime = !C.save.seenTut[id];               // stays true until this game is first won, so a retry still teaches
    screen = 'game'; gameStop = stop; paused = false; coachReset();
    C.setMusic(id === 'run' ? 'run' : 'calm');
    if(game && game.dispose) game.dispose();          // frees the old level's 3D scene
    game = mod.create(level, n, makeApi(firstTime, failsAt(stop)));
    game.isHard = !!(level.P && level.P.hard);
    game.isFinale = fin;
    playT0 = Date.now(); rwDone = []; logPlay('start');
    game.layout(G);
    tip(game.tip || null);
    buildBar(); bgDirty = true; refresh();
    // something new? say so, once, before play starts
    var card = (firstTime && INTRO[id] && !C.save.seenTwist['i_' + id]) ? id : (game.twist && !C.save.seenTwist[game.twist]) ? game.twist : fin ? 'finale' : null;
    if(card === id){ C.save.seenTwist['i_' + id] = 1; C.persist(); }

  /* The daily puzzle: one Métro map a day, the same for everyone that day. */
  function dayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function dayIndex(){ var d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000); }
  function startDaily(){
    var di = dayIndex(), n = [4, 5, 6, 7, 8, 6, 7][di % 7];

    Places.enter(place); C.setMusic('calm');
    screen = 'game'; gameStop = 0; paused = false;
    if(game && game.dispose) game.dispose();

  /* The endless dash: as far as you can go down today's street. */

    var firstTime = !C.save.seenTut.run;
    game = Games.run.create({n:0, endless:true, seed:(Date.now() % 100000) + 7, winter:C.season().id === 'winter'}, 0, makeApi(firstTime));
    game.isEndless = true;

  function restartCurrent(){

  /* ---------- "something new" cards ---------- */

      c.fillStyle = '#f6c945'; C.poly(c, [[-24, -18], [-18, -18], [-18, 18], [-24, 18]]); c.fill();
      c.fillStyle = '#4c5767'; c.beginPath(); c.arc(-8, 14, 5, 0, Math.PI*2); c.arc(8, 14, 5, 0, Math.PI*2); c.fill();
    } else if(kind === 'work' || kind === 'finale'){

    } else if(kind === 'amb'){
      c.fillStyle = '#ffffff'; c.strokeStyle = '#c9d2dc'; c.lineWidth = 2; C.rrect(c, -26, -12, 52, 26, 6); c.fill(); c.stroke();

      c.fillStyle = '#e03b30'; c.fillRect(-10, -18, 9, 6); c.fillStyle = '#2f6fe0'; c.fillRect(1, -18, 9, 6);

    } else if(kind === 'chain'){                          // a stopped car, and one behind that will not stop by itself

      c.fillStyle = '#2f6fe0'; C.rrect(c, -11, 6, 22, 30, 6); c.fill();
      c.fillStyle = 'rgba(255,255,255,.75)'; c.fillRect(-7, -26, 14, 7); c.fillRect(-7, 12, 14, 7);
      C.shapePath(c, 'octagon', 0, -17, 8); c.fillStyle = '#ffffff'; c.fill();
      c.strokeStyle = '#ffb020'; c.lineWidth = 3; c.lineCap = 'round';
      [[-20, 30], [20, 30], [-20, 40], [20, 40]].forEach(function(q){ c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q[0], q[1] + 6); c.stroke(); });
      c.fillStyle = '#ffd21f'; C.shapePath(c, 'star', 0, 2, 9); c.fill();

  function showIntro(kind){

  /* ---------- map drawing ---------- */
  function paintMapStatic(c){
    var W = G.W, H = G.H;
    var sn = C.season();
    var g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, sn.sky[0]); g.addColorStop(.55, sn.sky[1]); g.addColorStop(1, sn.sky[2]);
    c.fillStyle = g; c.fillRect(0, 0, W, H);

  /* The city either side of the path. Positions are fixed for a given district,
     so the map looks the same every time it is opened. */
  function pathXAt(contentY){
    var i = C.clamp((map.bottom - contentY)/map.spacing + 1, 1, DISTRICTS[0].stops);
    return G.W/2 + Math.sin(i*0.82)*map.amp;
  }
  function buildScenery(){
    var d = DISTRICTS[0], rng = window.DetourLogic.mulberry32(99173);
    var items = [], yy, side, row = 0;
    var bottom = map.bottom + 90;
    var contentTop = map.bottom - d.stops*map.spacing - 200;
    for(yy = bottom; yy > contentTop; yy -= 66, row++){
      for(side = 0; side < 2; side++){
        if(rng() < 0.08) continue;
        var r = rng();
        var kind = r < .30 ? 'house' : r < .40 ? 'shop' : r < .45 ? 'mural' : r < .49 ? 'metro'
                 : r < .63 ? 'pine' : r < .73 ? 'tree' : r < .79 ? 'lamp' : r < .93 ? 'car' : 'cone';
        items.push({kind:kind, side:side, y:yy + (rng()-.5)*22, x:38 + rng()*22,
                    s:0.9 + rng()*0.3, hue:Math.floor(rng()*6), col:Math.floor(rng()*C.COLORS.length)});
        // small things fill the gap between a building and the kerb
        if((kind === 'house' || kind === 'shop') && rng() < 0.55){
          var r2 = rng();
          items.push({kind:r2 < .4 ? 'tree' : r2 < .7 ? 'lamp' : 'cone', side:side, y:yy + 18 + rng()*8, x:96 + rng()*10,
                      s:0.85 + rng()*0.2, hue:0, col:0});
        }
      }
      if(row % 6 === 2){                  // a pocket park every few blocks
        items.push({kind:'park', side:(row % 12 === 2) ? 0 : 1, y:yy, x:56, s:1, hue:row});
      }
    }
    // each stop's landmark stands on the outside of the bend; clear room for it
    map.marks = [];
    for(var si = 1; si <= d.stops; si++){
      var pl = Places.forStop(si);
      if(!pl || !pl.lm || pl.lm === 'garland') continue;
      var sy0 = map.bottom - (si - 1)*map.spacing, sx0 = G.W/2 + Math.sin(si*0.82)*map.amp;
      map.marks.push({stop:si, lm:pl.lm, side:sx0 > G.W/2 ? 0 : 1, y:sy0});
    }
    items = items.filter(function(it){
      for(var k = 0; k < map.marks.length; k++){
        var mk = map.marks[k];
        if(it.kind !== 'park' && it.side === mk.side && Math.abs(it.y - mk.y) < 52) return false;
      }
      return true;
    });
    map.scenery = items;
  }
  var HOUSE = ['#d9574e','#e2a33b','#3fa3a3','#8f5fa8','#4a7fc1','#c96f3f'];
  var AWNING = ['#e04a4a','#2f8f6f','#3769c4','#e09a22'];
  function mixHex(a, b, f){
    var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    var r = Math.round(((pa >> 16) & 255)*(1-f) + ((pb >> 16) & 255)*f);
    var g = Math.round(((pa >> 8) & 255)*(1-f) + ((pb >> 8) & 255)*f);
    var bl = Math.round((pa & 255)*(1-f) + (pb & 255)*f);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  /* The shared block shape that makes a building look solid: a front face,
     a darker side face and a snowy roof slab. dir is +1 or -1. */
  function block(c, w, h, col, dir){
    var dep = 13*dir, dy = 9;
    c.fillStyle = mixHex(col, '#111a28', .34);               // side face
    C.poly(c, [[dir*w/2, -h], [dir*w/2 + dep, -h - dy], [dir*w/2 + dep, -dy], [dir*w/2, 0]]); c.fill();
    c.fillStyle = col;                                        // front face
    c.fillRect(-w/2, -h, w, h);
    c.fillStyle = mixHex(col, '#111a28', .16);
    c.fillRect(dir > 0 ? w/2 - 5 : -w/2, -h, 5, h);
    var sn2 = C.season();
    c.fillStyle = sn2.snowRoof ? '#f8fcff' : mixHex(col, '#2a3442', .45);   // roof slab
    C.poly(c, [[-w/2 - 3*dir, -h], [w/2 + 3*dir, -h],
               [w/2 + 3*dir + dep, -h - dy], [-w/2 - 3*dir + dep, -h - dy]]); c.fill();
    c.fillStyle = sn2.snowRoof ? '#dde8f2' : mixHex(col, '#141c28', .5);
    C.poly(c, [[-w/2 - 3*dir, -h], [w/2 + 3*dir, -h],
               [w/2 + 3*dir, -h + 3.5], [-w/2 - 3*dir, -h + 3.5]]); c.fill();
  }
  function blockShadow(c, w, dir){
    c.fillStyle = 'rgba(15,22,34,.16)';
    c.beginPath(); c.ellipse(dir*6, 5, w*.68, 9, 0, 0, Math.PI*2); c.fill();
  }
  function drawHouse(c, x, y, s, hue, dir){
    if(spr(c, 'house', hue % 6, dir, x, y, 12.4*s)) return;
    c.save(); c.translate(x, y); c.scale(s, s);
    var w = 58, h = 72, col = HOUSE[hue % HOUSE.length];
    blockShadow(c, w, dir); block(c, w, h, col, dir);
    c.scale(dir, 1);                       // interiors mirror with the side face
    c.fillStyle = '#ffe9b0';
    C.rrect(c, -w/2 + 8, -h + 13, 14, 17, 3); c.fill();
    c.fillStyle = '#cfe0ef';
    C.rrect(c, -w/2 + 30, -h + 13, 14, 17, 3); c.fill();
    C.rrect(c, -w/2 + 8, -h + 39, 14, 17, 3); c.fill();
    c.fillStyle = '#ffe9b0';
    C.rrect(c, -w/2 + 30, -h + 39, 14, 17, 3); c.fill();
    // the famous outdoor staircase, curling down the front
    c.strokeStyle = '#2f3a47'; c.lineWidth = 2.6; c.lineJoin = 'round';

  function drawShop(c, x, y, s, hue, dir){

  function drawMetro(c, x, y, s, dir){

  function drawMural(c, x, y, s, hue, dir){
    if(spr(c, 'mural', hue % 6, dir, x, y, 11.2*s)) return;

  function drawPark(c, x, y, s, hue){
    c.save(); c.translate(x, y);

      c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2;

  function drawPine(c, x, y, s){

      if(sn3.pineSnow){

  function drawTree(c, x, y, s){
    if(spr(c, 'tree', 0, 1, x, y, 10.5*s)) return;
    c.save(); c.translate(x, y); c.scale(s, s);
    c.fillStyle = 'rgba(15,22,34,.14)';
    c.beginPath(); c.ellipse(0, 3, 16, 6, 0, 0, Math.PI*2); c.fill();
    c.strokeStyle = '#7a5a3c'; c.lineWidth = 3.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -22);
    c.moveTo(0, -12); c.lineTo(-9, -24); c.moveTo(0, -15); c.lineTo(9, -26);
    c.moveTo(0, -22); c.lineTo(-5, -32); c.stroke();
    var sn4 = C.season();
    if(sn4.leaves){                                  // a full crown in leaf
      c.fillStyle = sn4.leaves;
      [[0,-26,13],[-10,-20,9],[10,-21,9],[-4,-33,8],[6,-32,7]].forEach(function(p){
        c.beginPath(); c.arc(p[0], p[1], p[2], 0, Math.PI*2); c.fill();
      });

        });
      }
    } else {                                         // bare, with snow on the forks
      c.fillStyle = '#f8fcff';
      [[0,-22],[-9,-24],[9,-26],[-5,-32]].forEach(function(p){
        c.beginPath(); c.arc(p[0], p[1], 3.2, 0, Math.PI*2); c.fill();
      });
    }
    c.restore();
  }
  function drawLamp(c, x, y, s){
    if(spr(c, 'lamp', 0, 1, x, y, 9*s)) return;
    c.save(); c.translate(x, y); c.scale(s, s);
    c.fillStyle = 'rgba(15,22,34,.14)';
    c.beginPath(); c.ellipse(0, 2, 9, 4, 0, 0, Math.PI*2); c.fill();
    c.strokeStyle = '#3c4654'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -34); c.stroke();
    c.fillStyle = '#ffd98a';
    c.beginPath(); c.arc(0, -37, 4.5, 0, Math.PI*2); c.fill();
    c.fillStyle = 'rgba(255,217,138,.22)';
    c.beginPath(); c.arc(0, -37, 10, 0, Math.PI*2); c.fill();
    c.restore();
  }
  /* A little car seen from the side, wheels and all, parked by the kerb. */
  function drawCar34(c, x, y, s, ci, dir){
    if(spr(c, 'car', ci % 9, dir, x, y + 4*s, 14.5*s)) return;
    var col = C.COLORS[ci % C.COLORS.length];
    c.save(); c.translate(x, y); c.scale(dir*s, s);
    c.fillStyle = 'rgba(15,22,34,.2)';
    c.beginPath(); c.ellipse(0, 7, 28, 6, 0, 0, Math.PI*2); c.fill();
    c.fillStyle = col.d;
    C.rrect(c, -26, -14, 52, 18, 7); c.fill();                // skirt
    c.fillStyle = col.c;
    C.rrect(c, -26, -17, 52, 18, 7); c.fill();                // body
    C.rrect(c, -15, -28, 30, 15, 6); c.fill();                // cabin
    c.fillStyle = '#26384f';
    C.rrect(c, -11, -25, 11, 10, 3); c.fill();
    C.rrect(c, 2, -25, 10, 10, 3); c.fill();                  // windows
    c.save(); C.rrect(c, -26, -17, 52, 18, 7); c.clip();
    c.fillStyle = 'rgba(255,255,255,.3)'; c.fillRect(-26, -17, 52, 5);
    c.restore();
    c.fillStyle = '#ffe9a8';
    C.rrect(c, 22, -14, 4, 5, 2); c.fill();                   // headlight
    [[-14, 2],[14, 2]].forEach(function(w){
      c.fillStyle = '#2b3342';
      c.beginPath(); c.arc(w[0], w[1], 6.5, 0, Math.PI*2); c.fill();
      c.fillStyle = '#8d99a8';
      c.beginPath(); c.arc(w[0], w[1], 2.8, 0, Math.PI*2); c.fill();
    });
    c.restore();
  }
  var HALFW = {house:34, shop:30, mural:28, metro:26, pine:16, tree:16, lamp:6, cone:7};
  /* Draw a prop as a picture of its 3D model when the device can make one.
     ppm is pixels per metre. Returns false so the caller draws the flat one. */
  function spr(c, kind, hue, dir, x, y, ppm){
    var K = window.Kit3D;
    if(!K || !K.available()) return false;
    var sp = K.sprite(kind, hue, dir);
    if(!sp) return false;
    K.drawSprite(c, sp, x, y, ppm);
    return true;
  }
  function drawScenery(c){
    if(!map.scenery) buildScenery();
    var W = G.W, i, it, y, x, dir;
    for(i = 0; i < map.scenery.length; i++){           // ground layer first
      it = map.scenery[i];
      if(it.kind !== 'park') continue;
      y = it.y + map.scroll;
      if(y < -120 || y > G.H + 120) continue;
      drawPark(c, it.side ? W - 74 : 74, y, it.s, it.hue);
    }
    for(i = map.scenery.length - 1; i >= 0; i--){      // then the town, top row first
      it = map.scenery[i];
      if(it.kind === 'park') continue;
      y = it.y + map.scroll;
      if(y < -110 || y > G.H + 110) continue;
      dir = it.side ? -1 : 1;                          // side faces lean toward the street
      x = it.side ? W - it.x : it.x;
      var px = pathXAt(it.y), hw = (HALFW[it.kind] || 12)*it.s;
      if(it.kind === 'car') x = px + (it.side ? 48 : -48);
      else if(!it.side) x = Math.min(x, px - 30 - hw);   // never under the road where it bends
      else x = Math.max(x, px + 30 + hw);
      if(it.kind === 'house') drawHouse(c, x, y, it.s*0.72, it.hue, dir);
      else if(it.kind === 'shop') drawShop(c, x, y, it.s*0.74, it.hue, dir);
      else if(it.kind === 'mural') drawMural(c, x, y, it.s*0.76, it.hue, dir);
      else if(it.kind === 'metro') drawMetro(c, x, y, it.s*0.76, dir);
      else if(it.kind === 'pine') drawPine(c, x, y, it.s);
      else if(it.kind === 'tree') drawTree(c, x, y, it.s);
      else if(it.kind === 'lamp') drawLamp(c, x, y, it.s);
      else if(it.kind === 'car') drawCar34(c, x, y, it.s*0.62, it.col, dir);
      else if(!spr(c, 'cone', 0, 1, x, y, 18*it.s)) C.drawCone(c, x, y, 26*it.s, 0);
    }
  }
  /* A point anywhere along the street, plus the direction it runs. */
  function pathPoint(t){
    var i = Math.max(1, Math.min(DISTRICTS[0].stops - 1, Math.floor(t)));
    var a = stopPos(i), b2 = stopPos(i + 1), f = t - i;
    var dx = b2.x - a.x, dy = b2.y - a.y, L = Math.hypot(dx, dy) || 1;
    return {x:a.x + dx*f, y:a.y + dy*f, nx:-dy/L, ny:dx/L};
  }
  function drawSnowbanks(c){
    var d = DISTRICTS[0], t, side, p, i = 0, sn = C.season();
    if(!sn.banks) return;                  // plowed snow piles are a winter thing
    for(t = 1; t <= d.stops; t += 0.16, i++){
      p = pathPoint(t);
      if(p.y < -60 || p.y > G.H + 60) continue;
      for(side = -1; side <= 1; side += 2){
        var r = (sn.banks ? 9 : 6) + ((i*5) % 5);
        var cx = p.x + p.nx*side*22, cy = p.y + p.ny*side*22;
        c.fillStyle = sn.vergeShade;
        c.beginPath(); c.ellipse(cx, cy + 2.5, r, r*0.62, 0, 0, Math.PI*2); c.fill();
        c.fillStyle = sn.verge;
        c.beginPath(); c.ellipse(cx, cy, r, r*0.6, 0, 0, Math.PI*2); c.fill();
      }
    }
  }
  function drawMap(c){
    var d = DISTRICTS[0], i;
    // snowy ground band the street runs along
    c.save();
    c.fillStyle = C.season().ground;
    c.beginPath();
    var first = stopPos(1), lastP = stopPos(d.stops);
    c.moveTo(0, Math.min(G.H + 40, first.y + 70));
    c.lineTo(G.W, Math.min(G.H + 40, first.y + 70));
    c.lineTo(G.W, Math.max(-40, lastP.y - 150));
    c.lineTo(0, Math.max(-40, lastP.y - 150));
    c.closePath(); c.fill();
    c.restore();
    drawScenery(c);
    drawMarks(c);
    drawSnowbanks(c);
    // the path
    c.save();
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    for(i = 1; i <= d.stops; i++){ var p = stopPos(i); i === 1 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y); }
    c.strokeStyle = 'rgba(70,86,105,.16)'; c.lineWidth = 42; c.stroke();   // kerb shadow
    c.strokeStyle = C.season().verge; c.lineWidth = 38; c.stroke();        // sidewalk
    c.strokeStyle = '#5c687a'; c.lineWidth = 26; c.stroke();               // asphalt
    c.strokeStyle = 'rgba(255,255,255,.1)'; c.lineWidth = 22; c.stroke();
    c.setLineDash([9, 13]); c.strokeStyle = '#f6c945'; c.lineWidth = 3; c.stroke();
    c.restore();
    // landmark above the last stop
    var last = stopPos(d.stops);
    if(last.y > -200 && last.y < G.H + 200) drawLandmark(c, G.W/2, last.y - map.spacing*1.1, Math.min(1, G.W/420));
    // stops
    var reached = C.save.reached;
    for(i = 1; i <= d.stops; i++){
      var pos = stopPos(i);
      if(pos.y < -60 || pos.y > G.H + 60) continue;
      var stars = starsAt(i), open = i <= reached, current = i === reached;
      var r = open ? 25 : 18;
      var RING = {bus:['#2f6fe0','#1c469c'], signs:['#ff8a1f','#b65a06'],
                  traffic:['#36b44a','#1f7a31'], find:['#9a5fd0','#6a3a9a'],
                  metro:['#e8413c','#a3271f'], plow:['#26a3c2','#167a93'], run:['#ee5fae','#a92d70']};
      var rc = isFinale(i) ? ['#f5b621','#b8860b'] : (RING[gameFor(i)] || RING.bus);
      var ring = !open ? '#9aa6b4' : rc[0];
      var ringDeep = !open ? '#7d8795' : rc[1];
      var bob = current ? Math.sin(map.time*3.2)*3 : 0;
      var py = pos.y + bob;
      c.fillStyle = 'rgba(15,22,34,.2)';
      c.beginPath(); c.ellipse(pos.x, pos.y + 13, r*.9, r*.34, 0, 0, Math.PI*2); c.fill();
      if(current){
        var pul = (Math.sin(map.time*3.2) + 1)/2;
        c.strokeStyle = 'rgba(255,138,31,' + (.18 + .34*pul) + ')'; c.lineWidth = 5 + pul*5;
        c.beginPath(); c.arc(pos.x, py, r + 9 + pul*5, 0, Math.PI*2); c.stroke();
      }
      c.beginPath(); c.arc(pos.x, py + 6, r, 0, Math.PI*2);     // the node has height too
      c.fillStyle = ringDeep; c.fill();
      c.beginPath(); c.arc(pos.x, py, r, 0, Math.PI*2);
      c.fillStyle = ring; c.fill();
      c.beginPath(); c.arc(pos.x, py, r - 4, 0, Math.PI*2);
      c.fillStyle = !open ? '#dde4ec' : '#ffffff'; c.fill();
      c.save(); c.beginPath(); c.arc(pos.x, py, r - 4, 0, Math.PI*2); c.clip();
      c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath();
      c.ellipse(pos.x, py - r*.5, r*.8, r*.45, 0, 0, Math.PI*2); c.fill(); c.restore();
      pos = {x:pos.x, y:py};
      if(!open){
        c.strokeStyle = 'rgba(96,108,122,.85)'; c.lineWidth = 2.2;
        c.beginPath(); c.arc(pos.x, pos.y - 2, 4, Math.PI, 0); c.stroke();
        c.fillStyle = 'rgba(96,108,122,.85)'; C.rrect(c, pos.x - 6, pos.y - 2, 12, 9, 2); c.fill();
      } else {
        gameIcon(c, gameFor(i), pos.x, pos.y - 3, 15);
        c.fillStyle = 'rgba(68,80,96,.55)'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = '800 10px Nunito, sans-serif';
        c.fillText(String(i), pos.x, pos.y + 14);
      }
      if(stars){
        for(var s = 0; s < 3; s++){
          var sx = pos.x + (s-1)*14, sy = pos.y + r + 9;
          starShape(c, sx, sy, 6.5, s < stars);
        }
      }
      if(open) placeLabel(c, i, pos.x, pos.y, r);
    }
    // district banner
    var bg2 = c.createLinearGradient(10, 8, G.W - 10, 52);
    bg2.addColorStop(0, '#d2550c'); bg2.addColorStop(1, '#ff8a2b');
    c.fillStyle = 'rgba(15,22,34,.22)'; C.rrect(c, 10, 12, G.W - 20, 44, 14); c.fill();
    c.fillStyle = bg2; C.rrect(c, 10, 8, G.W - 20, 44, 14); c.fill();
    c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle';
    c.font = '20px "Lilita One", Nunito, sans-serif';
    c.fillText(C.t(d.nameKey), 22, 24);
    c.font = '800 12px Nunito, sans-serif'; c.fillStyle = 'rgba(255,255,255,.85)';
    C.fitText(c, C.t(d.subKey), 22, 41, G.W - 150);
    var doneStops = 0;
    for(i = 1; i <= d.stops; i++) if(starsAt(i)) doneStops++;
    c.textAlign = 'right'; c.fillStyle = '#fff4cf';
    c.font = '18px "Lilita One", Nunito, sans-serif';
    c.fillText(doneStops + '/' + d.stops, G.W - 22, 30);
    C.drawSnow(c, map.flakes);
  }
  /* Each stop's landmark, standing beside the road: the route is a tour of
     the city. Stops not reached yet show theirs faded, as a promise. */
  function drawMarks(c){
    if(!map.marks) return;
    var K = window.Kit3D, reached = C.save.reached;
    for(var i = 0; i < map.marks.length; i++){
      var mk = map.marks[i], y = mk.y + map.scroll;
      if(y < -120 || y > G.H + 60) continue;
      var x = mk.side ? G.W - 58 : 58, h = 58, open = mk.stop <= reached;
      c.save(); if(!open) c.globalAlpha = 0.5;
      var sp = K && K.available() ? K.landmarkSprite(mk.lm, true) : null;
      if(sp){
        var sc = Math.min(h/sp.h, 104/sp.w);
        c.drawImage(sp.img, x - sp.ax*sc, y + 18 - sp.ay*sc, sp.w*sc, sp.h*sc);
      } else Places.silhouette(c, mk.lm, x, y + 18, h*0.9, '#8d9aab', '#ffffff');
      c.restore();
    }
  }
  /* The place's name by an open stop, on the side away from the bend. */
  function placeLabel(c, i, x, y, r){
    var name = Places.name(Places.forStop(i));
    if(!name) return;
    c.save();
    c.font = '800 10.5px Nunito, sans-serif';
    var w = Math.min(130, c.measureText(name).width + 14), left = x > G.W/2;
    var lx = left ? x - r - 8 - w : x + r + 8, ly = y - 9;
    c.fillStyle = 'rgba(255,255,255,.88)'; C.rrect(c, lx, ly, w, 18, 9); c.fill();
    c.fillStyle = '#3a4556'; c.textAlign = 'center'; c.textBaseline = 'middle';
    C.fitText(c, name, lx + w/2, ly + 9.5, w - 10);
    c.restore();
  }
  /* The little badge inside each stop: a bus for bus levels, a stop sign for sign levels. */
  /* A kid on a BMX, side on, for the map, the intro card and the home tile. */
  function drawBMX(c, x, y, r, accent){
    c.save(); c.translate(x, y); c.lineCap = 'round'; c.lineJoin = 'round';
    var wr = r*0.42;
    c.strokeStyle = '#2a2f37'; c.lineWidth = r*0.13;
    c.beginPath(); c.arc(-r*0.62, r*0.42, wr, 0, Math.PI*2); c.stroke();
    c.beginPath(); c.arc(r*0.62, r*0.42, wr, 0, Math.PI*2); c.stroke();
    c.strokeStyle = accent || '#e8413c'; c.lineWidth = r*0.11;
    c.beginPath(); c.moveTo(-r*0.62, r*0.42); c.lineTo(-r*0.05, r*0.42); c.lineTo(r*0.42, -r*0.12); c.lineTo(-r*0.3, -r*0.08); c.closePath(); c.stroke();
    c.beginPath(); c.moveTo(r*0.42, -r*0.12); c.lineTo(r*0.62, r*0.42); c.moveTo(r*0.42, -r*0.12); c.lineTo(r*0.36, -r*0.42); c.lineTo(r*0.5, -r*0.42); c.stroke();
    c.strokeStyle = '#36598f'; c.lineWidth = r*0.15;                  // legs
    c.beginPath(); c.moveTo(-r*0.18, -r*0.55); c.lineTo(r*0.12, -r*0.1); c.lineTo(-r*0.05, r*0.42); c.stroke();
    c.strokeStyle = '#1fb5a8'; c.lineWidth = r*0.2;                   // body
    c.beginPath(); c.moveTo(-r*0.18, -r*0.55); c.lineTo(r*0.15, -r*0.95); c.stroke();
    c.strokeStyle = '#c98e66'; c.lineWidth = r*0.1;                   // arm
    c.beginPath(); c.moveTo(r*0.12, -r*0.88); c.lineTo(r*0.45, -r*0.42); c.stroke();
    c.fillStyle = '#ff6b1a'; c.beginPath(); c.arc(r*0.26, -r*1.12, r*0.2, Math.PI*1.05, Math.PI*2.05); c.fill();   // helmet
    c.restore();
  }
  function gameIcon(c, kind, x, y, r){
    c.save(); c.translate(x, y);
    if(kind === 'metro'){
      [['#00a651', -r*.42], ['#f58220', 0], ['#0079c1', r*.42]].forEach(function(l){
        c.strokeStyle = l[0]; c.lineWidth = r*.24; c.lineCap = 'round';
        c.beginPath(); c.moveTo(-r*.75, l[1]); c.lineTo(r*.75, l[1]); c.stroke();
      });
      c.fillStyle = '#fff'; c.strokeStyle = '#1b2331'; c.lineWidth = r*.1;
      c.beginPath(); c.arc(0, 0, r*.2, 0, Math.PI*2); c.fill(); c.stroke();
    } else if(kind === 'run'){                           // a kid on a BMX
      drawBMX(c, 0, r*0.08, r*0.78);
    } else if(kind === 'plow'){
      c.fillStyle = '#e8792a'; C.rrect(c, -r*.45, -r*.42, r*1.0, r*.8, r*.18); c.fill();
      c.fillStyle = '#2a3b52'; C.rrect(c, -r*.05, -r*.28, r*.42, r*.3, r*.08); c.fill();
      c.fillStyle = '#f6c945'; c.fillRect(-r*.8, -r*.6, r*.24, r*1.2);
      c.fillStyle = '#2b3342'; c.beginPath(); c.arc(-r*.2, r*.45, r*.16, 0, Math.PI*2); c.arc(r*.35, r*.45, r*.16, 0, Math.PI*2); c.fill();
    } else if(kind === 'traffic'){
      c.strokeStyle = '#1f7a31'; c.lineWidth = r*.2; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-r*.8, 0); c.lineTo(r*.8, 0);
      c.moveTo(0, -r*.8); c.lineTo(0, r*.8); c.stroke();
      c.fillStyle = '#36b44a';
      c.beginPath(); c.arc(0, 0, r*.36, 0, Math.PI*2); c.fill();
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(0, 0, r*.15, 0, Math.PI*2); c.fill();
    } else if(kind === 'find'){
      c.strokeStyle = '#6a3a9a'; c.lineWidth = r*.17;
      c.beginPath(); c.arc(-r*.12, -r*.12, r*.46, 0, Math.PI*2); c.stroke();
      c.beginPath(); c.moveTo(r*.22, r*.22); c.lineTo(r*.72, r*.72);
      c.lineCap = 'round'; c.stroke();
      c.fillStyle = '#9a5fd0';
      c.beginPath(); c.arc(-r*.12, -r*.12, r*.3, 0, Math.PI*2); c.fill();
    } else if(kind === 'bus'){
      c.fillStyle = '#2f6fe0';
      C.rrect(c, -r*.8, -r*.55, r*1.6, r*1.0, r*.3); c.fill();
      c.fillStyle = '#ffffff';
      C.rrect(c, -r*.58, -r*.34, r*.46, r*.34, r*.1); c.fill();
      C.rrect(c, r*.12, -r*.34, r*.46, r*.34, r*.1); c.fill();
      c.fillStyle = '#1c469c';
      c.beginPath(); c.arc(-r*.42, r*.5, r*.2, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(r*.42, r*.5, r*.2, 0, Math.PI*2); c.fill();
    } else {
      c.strokeStyle = '#8d99a8'; c.lineWidth = r*.16;
      c.beginPath(); c.moveTo(0, -r*.1); c.lineTo(0, r*.72); c.stroke();
      C.shapePath(c, 'octagon', 0, -r*.22, r*.52);
      c.fillStyle = '#d6362b'; c.fill();
      c.strokeStyle = '#ffffff'; c.lineWidth = r*.1; c.stroke();
      c.fillStyle = '#ffffff'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '800 ' + (r*.3) + 'px Nunito, sans-serif';
      c.fillText('ARRÊT', 0, -r*.2);

    c.restore();
  }
  function starShape(c, x, y, r, filled){
    C.shapePath(c, 'star', x, y, r);
    c.fillStyle = filled ? '#ffd34d' : 'rgba(255,255,255,.55)'; c.fill();
    c.lineWidth = 1.4; c.strokeStyle = filled ? '#b8860b' : 'rgba(80,94,110,.5)'; c.stroke();
  }

  /* ---------- loop ---------- */
  function update(dt){
    if(screen === 'map'){
      map.time += dt;
      C.stepSnow(map.flakes, dt, G.W, G.H);
      if(map.target != null && !map.drag){
        map.scroll += (map.target - map.scroll)*(1 - Math.exp(-dt*9));
        if(Math.abs(map.target - map.scroll) < .5){ map.scroll = map.target; map.target = null; }
      }
      return;
    }
    if(game && !paused){
      game.update(dt);
      if(game.status === 'play' && !document.hidden) C.save.playS = (C.save.playS || 0) + dt;   // saved with the next win, loss or setting
    }
    coachTick(dt);
  }
  function render(){
    if(window.Kit3D) window.Kit3D.setBudget(4);      // a few new 3D sprites per frame, never a stall
    ctx.setTransform(1,0,0,1,0,0);
    if(bgDirty){
      bgx.setTransform(1,0,0,1,0,0); bgx.clearRect(0,0,bg.width,bg.height);
      bgx.setTransform(dpr*k,0,0,dpr*k,0,0);
      if(screen === 'map') paintMapStatic(bgx); else if(game) game.paintStatic(bgx);
      bgDirty = false;
    }
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(bg,0,0);
    ctx.setTransform(dpr*k,0,0,dpr*k,0,0);
    if(screen === 'map') drawMap(ctx);
    else if(game){ game.draw(ctx); drawCoach(ctx); }
  }
  var lastT = performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    if(C.save.battery && now - lastT < 1000/30 - 4) return;         // battery saver: every other frame
    var dt = Math.min(.05, Math.max(0, (now - lastT)/1000)); lastT = now;
    try{ update(dt); render(); }catch(err){ console.error(err); }
  }

  /* ---------- overlays ---------- */
  function confettiHTML(){
    if(reduceMotion) return '';
    var cols = ['#ff6b1a','#ffd34d','#36b44a','#2f6fe0','#ee5fae','#26bfd6','#ffffff'].map(function(h){ return C.softHex(h, 0.85); }), out = '', i;
    for(i = 0; i < 26; i++){
      out += '<i style="left:' + Math.round(Math.random()*100) + '%;background:' + cols[i % cols.length] +
             ';animation-delay:' + (Math.random()*0.5).toFixed(2) + 's;animation-duration:' +
             (1.5 + Math.random()*0.9).toFixed(2) + 's"></i>';
    }
    return '<div class="confetti" aria-hidden="true">' + out + '</div>';
  }
  function openOverlay(html, celebrate){

  var TWIST_AT = {bus:{n:3, id:'work'}, traffic:{n:2, id:'amb'}, metro:{n:3, id:'stations'}, signs:{n:3, id:'mystery'}};
  function newAt(stop){
    var id = gameFor(stop), n = levelNumFor(stop), tw = TWIST_AT[id];
    if((id === 'metro' || id === 'plow' || id === 'run') && n === 1 && !C.save.seenTut[id]) return true;
    if(!tw || n < tw.n || C.save.seenTwist[tw.id]) return false;

  var HRING = {bus:['#2f6fe0','#1c469c'], signs:['#ff8a1f','#b65a06'], traffic:['#36b44a','#1f7a31'],
               find:['#9a5fd0','#6a3a9a'], metro:['#e8413c','#a3271f'], plow:['#26a3c2','#167a93'], run:['#ee5fae','#a92d70']};
  Object.keys(HRING).forEach(function(k){ HRING[k] = HRING[k].map(function(h){ return C.softHex(h, 0.8); }); });

  function stopIcon(stop){
    var fin = isFinale(stop), kind = gameFor(stop), key = fin ? 'finale' : kind;
    if(iconCache[key]) return iconCache[key];
    var cv2 = document.createElement('canvas'), R = 48;
    cv2.width = cv2.height = R*2;
    var c = cv2.getContext('2d'), rc = fin ? ['#f5b621','#b8860b'] : (HRING[kind] || HRING.bus);
    var g = c.createLinearGradient(0, 0, 0, R*2); g.addColorStop(0, rc[0]); g.addColorStop(1, rc[1]);
    c.fillStyle = g; c.beginPath(); c.arc(R, R, R, 0, Math.PI*2); c.fill();
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(R, R, R*0.74, 0, Math.PI*2); c.fill();
    if(fin){ C.shapePath(c, 'star', R, R, R*0.44); c.fillStyle = '#f5b621'; c.fill(); }
    else gameIcon(c, kind, R, R + 2, R*0.5);
    return (iconCache[key] = cv2.toDataURL());
  }

  /* The home scene: a live 3D Montréal street when the device can draw it,
     the illustrated postcard when it cannot. */
  var homeArt = null, homeRaf = 0, homeLast = 0, homeSeason = '';
  function startHomeArt(){
    var box = document.getElementById('hmArt');
    var want3d = window.Kit3D && window.Kit3D.available();
    if(want3d && homeArt && homeSeason === C.seasonId()){ if(!homeRaf) loopHome(); return; }
    stopHomeArt();
    if(want3d){
      try {
        box.innerHTML = '<canvas id="hmCv" aria-hidden="true"></canvas>';
        box.classList.add('is3d');
        homeArt = window.Kit3D.homeView(document.getElementById('hmCv'));
        homeSeason = C.seasonId();
        placeHomeArt();
        homeArt.draw(0);
        loopHome();
        return;
      } catch(e){ homeArt = null; }
    }
    box.classList.remove('is3d');
    box.innerHTML = C.homeSVG();
    placeHomeArt();
  }
  function loopHome(){
    homeLast = performance.now();
    function tick(now){
      if(!homeArt || homeEl.hidden){ homeRaf = 0; return; }
      if(C.save.battery && now - homeLast < 1000/30 - 4){ homeRaf = requestAnimationFrame(tick); return; }
      var dt = Math.min(0.05, (now - homeLast)/1000); homeLast = now;
      if(!homeArt.draw(reduceMotion ? 0 : dt)){ stopHomeArt(); startHomeArt(); return; }
      homeRaf = requestAnimationFrame(tick);
    }
    homeRaf = requestAnimationFrame(tick);
  }
  function stopHomeArt(){
    if(homeRaf) cancelAnimationFrame(homeRaf);
    homeRaf = 0;
    if(homeArt){ homeArt.dispose(); homeArt = null; }
  }

  function starRow(nStars){
    var out = '<div class="starrow">';
    for(var i = 0; i < 3; i++) out += C.starSVG(i < nStars);

  }
  var WON_KEY = {bus:'wonBus', signs:'wonSigns', traffic:'wonTraffic', find:'wonFind', metro:'wonMetro', plow:'wonPlow', run:'wonRun'};
  function winTitle(){ return C.t(WON_KEY[game.isDaily ? 'metro' : gameFor(gameStop)] || 'cleared'); }
  function showDailyWin(){
    var res = game.result || {stars:1, coins:0}, d = C.save.daily || {}, first = !dailyDone(), gained = 0;
    if(first){
      d.streak = streakNow() + 1; d.last = dayKey(); d.best = Math.max(d.best || 0, d.streak);
      C.save.daily = d;
      gained = Math.min(30 + d.streak*10, 120) + (res.coins || 0);
      addCoins(gained); C.persist();
      rewardEvent('daily'); rewardEvent('win');
    }
    C.sfx.win(); C.haptic([20,40,30]);
    openOverlay('<h2>' + C.t('dailyDone') + '</h2>' +
      '<div class="wob">' + C.coneSVG('happy') + '</div>' + starRow(res.stars) +
      '<div class="streak"><span class="flame">' + flameIcon() + '</span><b>' + (d.streak || 1) + '</b> ' + C.t('streakDays') + '</div>' +
      (first ? '<div class="earn"><i class="coin"></i>+' + gained + ' <span class="small">' + C.t('earned') + '</span></div>'
             : '<p class="small">' + C.t('dailyAgain') + '</p>') +
      (window.Rewards ? window.Rewards.nextGoalHTML(rwDone) : '') +
      '<div class="stack"><button class="btn" id="dHome">' + C.t('home') + '</button></div>', true);
    $('#dHome').onclick = function(){ closeOverlay(); goMap(C.save.reached); showHome(); };
  }
  function showWin(){
    if(game.isDaily) return showDailyWin();
    if(!game.isEndless){                                   // learned: the first-time help can rest, the loss count starts over
      C.save.seenTut[gameFor(gameStop)] = 1;
      if(C.save.fails) delete C.save.fails[gameStop];
      C.persist();
    }
    var res = game.result || {stars:1, coins:0};
    var bonus = game.isFinale ? 100 : game.isHard ? 40 : 20;
    // a run of wins doubles the level bonus from the third win on
    var fresh = starsAt(gameStop) === 0;
    if(fresh) C.save.streak = (C.save.streak || 0) + 1;
    var streak = C.save.streak || 0, streakOn = fresh && streak >= 3;
    if(streakOn) bonus *= 2;
    if(window.Rewards) bonus = Math.round(bonus*window.Rewards.bonusRate());      // every rank adds 10%
    logPlay('win', {stars:res.stars});
    rewardEvent('win'); if(res.stars === 3) rewardEvent('stars3'); if(game.isHard) rewardEvent('hard');
    addCoins(bonus);
    var gained = (res.coins || 0) + bonus;
    var prev = starsAt(gameStop);
    var best = Math.max(prev, res.stars);
    C.save.stars[gameStop] = best;
    if(gameStop >= C.save.reached) C.save.reached = Math.min(gameStop + 1, DISTRICTS[0].stops);
    C.persist();
    C.sfx.win(); C.haptic([20,40,30]);
    var isLast = gameStop === DISTRICTS[0].stops;
    var here = Places.forStop(gameStop), pic = Places.photoSrc(here);
    openOverlay('<h2>' + winTitle() + '</h2>' +
      (pic ? '<div class="wphoto"><img src="' + pic + '" alt=""><span class="wcap">' + esc(Places.name(here)) + '<i>' + esc(Places.photoBy(here)) + '</i></span></div>'
           : '<div class="wob">' + C.coneSVG('happy') + '</div>') + starRow(res.stars) +
      (res.stars > prev && prev > 0 ? '<p class="small">' + C.t('newBest') + '</p>' : '') +
      '<div class="earn"><i class="coin"></i>+' + gained + ' <span class="small">' + C.t('earned') + '</span></div>' +
      (streakOn ? '<p class="wstreak">' + C.t('streakLbl').replace('{n}', streak) + '</p>' : '') +
      (window.Rewards ? window.Rewards.nextGoalHTML(rwDone) : '') +
      '<div class="stack">' +
      (isLast ? '' : '<button class="btn" id="wNext">' + C.t('next') + '</button>') +
      '<button class="btn alt" id="wMap">' + C.t('backToMap') + '</button></div>', true);
    // the first win is when we ask for the player's name, once (Skip keeps the fun one)
    function then(go){ return function(){ closeOverlay(); if(!C.save.named) askName(true, go); else go(); }; }
    if(!isLast) $('#wNext').onclick = then(function(){ startStop(gameStop + 1); });
    $('#wMap').onclick = then(function(){ if(isLast) showPostcard(); else goMap(C.save.reached); });
  }
  /* ---------- the player: name, colour, stats ---------- */
  function initial(n){ var ch = Array.from(String(n || '').trim())[0] || '?'; return ch.toLocaleUpperCase(); }
  function avatarHTML(big, col, name){
    var c = C.AVATARS[col == null ? C.save.avatar : col] || C.AVATARS[0];

  function playTime(sec){
    var m = Math.floor((sec || 0)/60);

  }
  function sinceText(){
    var p = String(C.save.since || '').split('-'), d = new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1);
    if(isNaN(d)) return '';
    try{ return C.t('since').replace('{d}', d.toLocaleDateString(C.save.lang === 'fr' ? 'fr-CA' : 'en-CA', {day:'numeric', month:'long', year:'numeric'})); }
    catch(e){ return C.t('since').replace('{d}', C.save.since); }
  }
  function showProfile(){
    var d = DISTRICTS[0], done = 0, i;

    openOverlay('<h2>' + C.t('yourProfile') + '</h2>' +
      '<div class="pf-head">' + avatarHTML(true) + '<div class="pf-n"><b>' + esc(C.save.name) + '</b><small>' + esc(sinceText()) + '</small></div>' +
      '<button class="xbtn pf-edit" id="pfEdit" aria-label="' + C.t('editName') + '">' + ic('pen') + '</button></div>' +
      '<div class="rboard pf-stats">' +
        tile(done + '<small>/' + d.stops + '</small>', C.t('stLevels')) + tile(totalStars() + '<small>/' + d.stops*3 + '</small>', C.t('stStars')) +
        tile('<i class="coin sm"></i>' + C.save.coins, C.t('stCoins')) + tile((C.save.runBest || 0) + ' m', C.t('stBmx')) +
        tile(playTime(C.save.playS), C.t('stTime')) + tile(streakNow(), C.t('stStreak')) +

      '<button class="lrow" id="pfBackup">' + ic('save') + rowText(C.t('backup'), C.t('backupSub')) + ic('chev', 'chev') + '</button>' +

    ov.querySelector('.card').classList.add('pfcard');
    $('#pfEdit').onclick = function(){ askName(false, showProfile); };
    $('#pfBackup').onclick = function(){ setUI.tab = 'more'; showSettings(); setUI.sub = 'backup'; renderPane(); };
    $('#pfDone').onclick = function(){ closeOverlay(); if(!homeEl.hidden) showHome(); };
  }
  /* first = asked after the first win (Skip keeps the fun name); then = what comes next */
  function askName(first, then){
    var pick = C.save.avatar, typed = first && !C.save.named ? '' : C.save.name, idea = C.save.name;
    openOverlay('<h2>' + C.t('nameQ') + '</h2>' +
      '<div class="nm-av" id="nmAv">' + avatarHTML(true, pick, typed || idea) + '</div>' +
      '<p class="small">' + C.t('nameTxt') + '</p>' +
      '<div class="nm-row"><input id="nmIn" type="text" maxlength="18" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done"' +
        ' aria-label="' + C.t('namePh') + '" placeholder="' + esc(idea) + '" value="' + esc(typed) + '">' +
        '<button class="nm-dice" id="nmDice" aria-label="' + C.t('roll') + '">' + ic('dice') + '</button></div>' +
      '<div class="nm-sw" role="radiogroup" aria-label="' + C.t('colourLbl') + '">' + C.AVATARS.map(function(c, k){
        return '<button role="radio" data-av="' + k + '" aria-checked="' + (k === pick) + '" aria-label="' + C.t('colourLbl') + ' ' + (k + 1) + '" style="background:' + c + '"></button>';
      }).join('') + '</div>' +
      '<div class="stack"><button class="btn" id="nmOk">' + C.t(first ? 'saveName' : 'saveBtn') + '</button>' +
      '<button class="linkbtn" id="nmSkip">' + C.t(first ? 'skipNow' : 'cancel') + '</button></div>');
    ov.querySelector('.card').classList.add('nmcard');
    var inp = $('#nmIn');
    function current(){ return C.cleanName(inp.value) || idea; }
    function paint(){ $('#nmAv').innerHTML = avatarHTML(true, pick, current()); }
    inp.oninput = paint;
    inp.onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); } };
    $('#nmDice').onclick = function(){
      var n = idea, k = 0; while(n === idea && k++ < 8) n = C.funName();
      idea = n; inp.value = ''; inp.placeholder = n; paint(); C.sfx.tap();
    };
    ov.querySelectorAll('[data-av]').forEach(function(b){
      b.onclick = function(){
        pick = +b.dataset.av; ov.querySelectorAll('[data-av]').forEach(function(x){ x.setAttribute('aria-checked', String(x === b)); });
        paint(); C.sfx.tap();
      };
    });
    $('#nmOk').onclick = function(){
      C.save.name = current(); C.save.avatar = pick; C.save.named = 2; C.persist();
      C.sfx.coin(); closeOverlay(); if(then) then(); else if(!homeEl.hidden) showHome();
    };
    $('#nmSkip').onclick = function(){
      if(first && !C.save.named){ C.save.named = 1; C.persist(); }
      closeOverlay(); if(then) then(); else if(!homeEl.hidden) showHome();
    };
  }
  function showPostcard(){
    var d = DISTRICTS[0];
    if(C.save.postcards.indexOf(d.id) < 0){ C.save.postcards.push(d.id); C.persist(); }
    openOverlay('<p class="small">' + C.t('postcard') + '</p>' +
      '<div class="postcard"><div class="pcart">' + C.landmarkSVG(d.id) + '</div>' +
      '<h2>' + C.t(d.landmarkKey) + '</h2><p>' + C.t(d.postcardKey) + '</p>' +
      '<p class="sign">' + C.t('love') + '</p></div>' +
      '<div class="stack"><button class="btn" id="pcOk">' + C.t('done') + '</button></div>', true);

  }
  function showLose(){
    var info = game.lose || {title:'', sub:''};
    C.sfx.lose(); C.haptic(60);
    var primary = '';
    if(info.extraStop){
      primary = C.save.coins >= C.COST.stop
        ? '<button class="btn" id="lStop">' + C.t('extraStop') + ' <span class="pcost"><i class="coin sm"></i>' + C.COST.stop + '</span></button>'
        : '<button class="btn" id="lAd">' + C.t('adStop') + '</button>';
    } else if(info.undo){
      primary = '<button class="btn" id="lUndo">' + C.t('undo') + ' <span class="pcost"><i class="coin sm"></i>' + C.COST.undo + '</span></button>';
    } else if(info.revive){
      primary = C.save.coins >= C.COST.revive
        ? '<button class="btn" id="lStop">' + C.t('revive') + ' <span class="pcost"><i class="coin sm"></i>' + C.COST.revive + '</span></button>'
        : '<button class="btn" id="lAd">' + C.t('adRevive') + '</button>';
    }
    var lf = game.isEndless || game.isDaily ? 0 : failsAt(gameStop);
    var canSkip = lf >= 3 && !game.isFinale && gameStop < DISTRICTS[0].stops;
    openOverlay('<h2>' + info.title + '</h2>' + (info.html || (C.coneSVG('sad') + '<p>' + info.sub + '</p>')) +
      (lf >= 2 && game.canEase ? '<p class="small easier">' + C.t('easierNext') + '</p>' : '') +
      (window.Rewards ? window.Rewards.nextGoalHTML(rwDone) : '') +
      '<div class="stack">' + primary +
      '<button class="btn alt" id="lRetry">' + C.t('retry') + '</button>' +
      (canSkip ? '<button class="btn alt" id="lSkip">' + C.t('skipLvl') + '</button>' : '') +
      '<button class="linkbtn" id="lMap">' + C.t(info.endless ? 'home' : 'backToMap') + '</button></div>');
    var lk = $('#lSkip');
    if(lk) lk.onclick = function(){                        // after three losses: move on, and come back any time
      closeOverlay(); logPlay('skip');
      C.save.reached = Math.max(C.save.reached, gameStop + 1);
      C.persist(); toast(C.t('skippedTxt')); goMap(C.save.reached);
    };
    var ls = $('#lStop'), la = $('#lAd'), lu = $('#lUndo');
    if(ls) ls.onclick = function(){ if(!spend(info.revive ? C.COST.revive : C.COST.stop)) return; closeOverlay(); game.continueAfterLoss(); refresh(); };
    if(lu) lu.onclick = function(){
      closeOverlay();
      if(!game.booster('undo')){ showLose(); }
      refresh();
    };
    if(la) la.onclick = function(){
      openOverlay('<h2>' + C.t('adTitle') + '</h2><p>' + C.t('adBody') + '</p><div class="adbar"><i id="adFill"></i></div>');
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ var f = $('#adFill'); if(f) f.style.width = '100%'; }); });
      setTimeout(function(){ closeOverlay(); game.continueAfterLoss(); }, reduceMotion ? 600 : 2700);
    };
    $('#lRetry').onclick = function(){ closeOverlay(); restartCurrent(); };
    $('#lMap').onclick = function(){
      closeOverlay();
      if(game && game.isEndless){ goMap(C.save.reached); showHome(); } else goMap(gameStop);
    };
  }
  function seasonSeg(){
    var cur = C.save.season || 'auto';
    var opts = [['auto', C.t('seasonAuto')]];
    ['winter','spring','summer','fall'].forEach(function(k){
      opts.push([k, C.save.lang === 'fr' ? C.SEASONS[k].nameFr : C.SEASONS[k].nameEn]);
    });
    return '<span class="seg season">' + opts.map(function(o){
      return '<button data-season="' + o[0] + '" aria-pressed="' + (cur === o[0]) + '">' + o[1] + '</button>';
    }).join('') + '</span>';
  }
  /* Graphics: Best is the console-style look with post-processing on live
     scenes, Good keeps the realistic materials and lighting without it, Fast
     is the original matte look. Auto picks Best on computers and strong
     phones, Good on everything else. */
  function autoTier(){
    var K = window.Kit3D;
    if(!K || !K.available()) return 'off';
    var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    var mem = navigator.deviceMemory || 4, cores = navigator.hardwareConcurrency || 4;
    if(!coarse) return 'console';
    return mem >= 6 && cores >= 8 ? 'console' : 'high';
  }
  function applyGraphics(){
    var K = window.Kit3D;
    if(!K || !K.setFX) return;
    var g = C.save.gfx || 'auto', tier = g === 'best' ? 'console' : g === 'good' ? 'high' : g === 'fast' ? 'off' : autoTier();
    if(!K.setFX(tier)) return;
    bgDirty = true;
    if(screen === 'game' && game) game.layout(G);
    else layoutMap();
    if(screen === 'home'){ stopHomeArt(); startHomeArt(); placeHomeArt(); }
  }
  function gfxSeg(){
    var cur = C.save.gfx || 'auto';
    return '<span class="seg">' + [['auto', 'gfxAuto'], ['best', 'gfxBest'], ['good', 'gfxGood'], ['fast', 'gfxFast']].map(function(o){
      return '<button data-gfx="' + o[0] + '" aria-pressed="' + (cur === o[0]) + '">' + C.t(o[1]) + '</button>';
    }).join('') + '</span>';
  }

    user:'<circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/>'

  function ic(name, cls){
    return '<svg class="ic' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
  }
  var CH_ICON = {music:'music', sfx:'sound', amb:'amb'}, CH_LBL = {music:'music', sfx:'effects', amb:'ambience'};
  function chMuted(ch){ return !!C.save.mute[ch] || !(C.save.vol[ch] > 0); }
  function setMuted(ch, m){
    C.save.mute[ch] = m;
    if(!m && !(C.save.vol[ch] > 0)) C.save.vol[ch] = ch === 'sfx' ? 0.8 : 0.6;     // un-muting a channel at zero brings it back
    C.persist(); C.ensureAudio(); C.applyAudio();
  }
  var setUI = {tab:'sound', sub:null, from:null, testN:null};
  function showSettings(from){

      h = backRow() + '<div class="bk">' +

    } else if(sub === 'reset'){
      h = backRow() + '<div class="confirm">' + ic('trash') + '<b>' + T('resetQ') + '</b><p>' + T('resetTxt') + '</p>' +
        '<div class="pz-row"><button class="btn alt" id="sNo">' + T('cancel') + '</button><button class="btn danger" id="sYes">' + T('resetYes') + '</button></div></div>';
    } else {
      h = linkRow('sProf', 'user', T('profile'), T('profileSub')) +

  function hexOf(buf){ var a = new Uint8Array(buf), s = '', i; for(i = 0; i < a.length; i++) s += (a[i] < 16 ? '0' : '') + a[i].toString(16); return s; }

  function putFile(rel, buf){
    var a = new Uint8Array(buf), step = 393216, at = 0;

      (function next(){
        var piece = a.subarray(at, Math.min(a.length, at + step));
        if(!Native.put(rel, b64of(piece), at > 0)) return fail(new Error('write ' + rel));
        at += step;
        if(at >= a.length) done(); else setTimeout(next, 16);
      })();
    });
  }
  function otaCheck(force){
    if(!Native || !window.crypto || !crypto.subtle || ota.state === 'busy') return Promise.resolve(ota.state);
    var st = otaGet(), now = Date.now(), remote, base;
    if(!force && st.at && now - st.at < 4*3600e3) return Promise.resolve(ota.state);
    if(Native.pending && Native.pending()){ ota.state = 'ready'; return Promise.resolve('ready'); }
    st.at = now; otaSet(st); ota.state = 'busy'; paintUpd();
    return fetchOk(OTA_URL + 'ota-manifest.json?t=' + now, 'json').then(function(m){
      remote = m;
      if(!m || !m.files || !(m.version > APP_VERSION) || m.version === st.bad) throw 'none';
      if((m.api || 1) > (Native.api ? Native.api() : 1)) throw 'app';          // needs a newer APK
      return fetchOk('ota-base.json', 'json');

            });
          })
          .then(function(buf){ return putFile(rel, buf); }).then(next);

    }).then(function(){

      st = otaGet(); st.trying = remote.version; otaSet(st);
