<script>
/* Spot the Change level data.

   A level is one Montréal street, described in metres, plus a short list of
   changes that only the second photo shows. The street is laid out on fixed
   slots (four buildings along the back, the sidewalk in front of them, a row
   of parked cars, the near sidewalk), so things never pile on top of each
   other and every change stays in plain view.

   Each item may carry:
     only:'A' or 'B'   it is in one photo only (gone, or new)
     hueB, awB         its colour, or its shop awning, in photo B
     kindB             it is a different thing in photo B (tree to pine)

   Changes are whole, nameable things ("the door is a new colour", "a cat
   appeared"), never a slight nudge or resize, so the player can always say
   what they found. Early levels use only big changes; later ones mix in
   smaller ones. */
(function(){
  'use strict';
  var mulberry32 = window.DetourLogic.mulberry32;

  /* The camera, shared by the 3D view and the flat drawing: it looks at the
     street from across the road and a little above, and backs off until the
     whole street is in frame on any photo shape. */
  var CAM = {fov:30, tx:0, ty:3.0, tz:3.6, el:0.3, halfW:10.2, halfH:7.4};
  var BX = [-7.2, 0, 7.2], ZB = -5.4, FRONT = ZB + 2.75;
  var BACK_Z = 1.0, PARK_Z = 8.6, NEAR_Z = 11.6;
  /* How many colours each kind has (3D palettes in Kit3D, or the flat ones). */
  var NHUE = {house:6, shop:6, door:6, flowers:4, car:8, van:8, person:8, sign:6, bench:6, hydrant:6, bin:3, mailbox:2, cat:4};
  /* Rough size in metres (width, height) for the flat drawing's tap boxes. */
  var SIZE = {house:[6.4, 9.2], shop:[7.2, 4.9], door:[1.2, 2.2], light:[1.3, 1.5], flowers:[1.7, 0.7], dish:[1.1, 1.3],
              tree:[2.8, 4.6], pine:[2.4, 4.0], lamp:[1.6, 5.1], sign:[1.0, 2.8], person:[0.8, 1.95], hydrant:[0.6, 0.95],
              bin:[0.7, 1.0], mailbox:[0.6, 1.4], cone:[0.6, 0.75], ticone:[1.2, 1.8], cat:[0.5, 0.6], bench:[1.9, 1.0],
              car:[4.3, 1.6], van:[6.2, 2.1]};

  function generate(n, rich){
    if(rich == null) rich = !!(window.Kit3D && window.Kit3D.available());
    var rng = mulberry32(7700 + n*523);
    var hard = n % 5 === 0;
    var diffs = Math.min(2 + n, 6);                     // 3, 4, 5, then 6
    var items = [], nid = 0, free = [];
    function rnd(k){ return Math.floor(rng()*k); }
    function add(o){ o.id = 'p' + (nid++); items.push(o); return o; }
    function other(h, k, avoid){                         // a different colour, avoiding some
      for(var t = 0; t < 30; t++){
        var c = (h + 1 + rnd(k - 1)) % k;
        if(!avoid || avoid.indexOf(c) < 0) return c;
      }
      return (h + 1) % k;
    }

    /* ---- the buildings, no two neighbours the same colour ---- */
    var hues = [], shopAt = rng() < 0.6 ? rnd(3) : -1, houses = [];
    BX.forEach(function(bx, i){
      var h; do { h = rnd(6); } while(i && h === hues[i - 1]);
      hues.push(h);
      if(i === shopAt){ add({kind:'shop', x:bx, z:ZB, hue:h, aw:rnd(4), row:'b'}); return; }
      var b = add({kind:'house', x:bx, z:ZB, hue:h, pat:rnd(2), row:'b'});
      houses.push(b);
      if(!rich) return;
      add({kind:'door', x:bx - 1.5, z:FRONT + 0.06, hue:rnd(6), host:b.id, row:'b'});
      if(rng() < 0.45){ b.flowers = 1; add({kind:'flowers', x:bx - 1.4, y:rng() < 0.5 ? 3.79 : 6.59, z:FRONT + 1.2, hue:rnd(4), host:b.id, row:'b'}); }
      if(rng() < 0.3){ b.dish = 1; add({kind:'dish', x:bx + 1.7, y:8.66, z:ZB - 0.9, host:b.id, row:'b'}); }
    });

    /* ---- the back sidewalk: trees and lamps between the buildings ---- */
    [-3.6, 3.6].forEach(function(x){
      var r = rng();
      if(r < 0.42) add({kind:'tree', x:x, z:BACK_Z - 0.3, v:rnd(3), row:'s'});
      else if(r < 0.64) add({kind:'pine', x:x, z:BACK_Z - 0.3, row:'s'});
      else if(r < 0.86) add({kind:'lamp', x:x, z:BACK_Z - 0.6, row:'s'});
      else add({kind:'sign', x:x, z:BACK_Z - 0.6, hue:rnd(6), row:'s'});
    });
    /* small things in front of each building: left of the door, and between
       the door and the outdoor staircase */
    var SMALL_BACK = rich ? ['person','person','hydrant','bin','mailbox','cone','cat'] : ['person','person','hydrant','cone'];
    BX.forEach(function(bx){
      [[bx - 2.55, BACK_Z + 0.1], [bx + 0.25, BACK_Z + 0.4]].forEach(function(sl){
        if(rng() < 0.5) add(small(pick(SMALL_BACK), sl[0], sl[1], 's'));
        else free.push({x:sl[0], z:sl[1], row:'s'});
      });
    });

    /* ---- parked cars along the near kerb ---- */
    var PARK = [-5.6, 0.3, 5.9], empty = rng() < 0.4 ? rnd(3) : -1;
    PARK.forEach(function(x, i){
      if(i === empty) return;
      var van = rich && i === 1 && rng() < 0.4;          // a long van only fits the middle space
      add({kind:van ? 'van' : 'car', x:x, z:PARK_Z, hue:rnd(rich ? 8 : 6), rot:rng() < 0.5 ? 0 : Math.PI, row:'p'});
    });

    /* ---- the near sidewalk ---- */
    var SMALL_NEAR = rich ? ['person','person','cone','bench','hydrant','bin','cat','mailbox'] : ['person','person','cone','bench','hydrant'];
    [-6.3, -4.2, -2.1, 0, 2.1, 4.2, 6.3].forEach(function(x){
      if(rng() < 0.55) add(small(pick(SMALL_NEAR), x, NEAR_Z, 'n'));
      else free.push({x:x, z:NEAR_Z, row:'n'});
    });

    function pick(a){ return a[rnd(a.length)]; }
    function small(kind, x, z, row){
      var o = {kind:kind, x:x, z:z, row:row};
      if(kind === 'person'){ o.hue = rnd(8); o.coat = rnd(6); o.skin = rnd(5); o.rot = (rng() - 0.5)*1.2; }
      else if(kind === 'cat'){ o.hue = rnd(4); o.rot = (rng() - 0.5)*1.4; }
      else if(NHUE[kind]) o.hue = rnd(NHUE[kind]);
      return o;
    }

    /* ---- every change this street could take ---- */
    var cands = [];
    function cand(w, type, it, x){ cands.push({w:w, type:type, it:it, x:x || {}}); }
    items.forEach(function(it){
      var k = it.kind, m = it.row === 'n' ? 1.15 : 1;
      if(k === 'house') cand(5, 'colour', it);
      else if(k === 'shop') cand(rich ? 3.2 : 5, 'colour', it);
      else if(k === 'door') cand(2.3, 'colour', it);
      else if(k === 'flowers'){ cand(1.7, 'gone', it); cand(1.5, 'colour', it); }
      else if(k === 'dish') cand(2.1, 'gone', it);
      else if(k === 'car' || k === 'van'){ cand(4, 'colour', it); cand(4.2, 'gone', it); if(rich && Math.abs(it.x) < 1) cand(3.4, 'swap', it); }
      else if(k === 'tree' || k === 'pine'){ cand(4, 'gone', it); cand(3.5, 'swap', it); }
      else if(k === 'lamp') cand(3, 'gone', it);
      else if(k === 'sign'){ cand(2.5*m, 'colour', it); cand(2.7*m, 'gone', it); }
      else if(k === 'person'){ cand(3*m, 'gone', it); cand(2.3*m, 'colour', it); }
      else if(k === 'bench'){ cand(2.5*m, 'colour', it); cand(2.7*m, 'gone', it); }
      else if(k === 'hydrant' || k === 'bin' || k === 'mailbox'){ cand(1.8*m, 'colour', it); cand(2*m, 'gone', it); }
      else if(k === 'cone') cand(2.4*m, 'gone', it);
      else if(k === 'cat') cand(2.3*m, 'gone', it);
    });
    free.forEach(function(sl){
      var m = sl.row === 'n' ? 1.15 : 1;
      cand(3*m, 'new', null, {slot:sl, kind:'person'});
      cand(2.4*m, 'new', null, {slot:sl, kind:'cone'});
      if(rich) cand(2.3*m, 'new', null, {slot:sl, kind:'cat'});
      if(rich && sl.row === 'n') cand(3.2, 'new', null, {slot:sl, kind:'ticone'});
    });
    if(rich) houses.forEach(function(h){
      // a light that goes on, or off, behind one of the unlit windows
      for(var f = 0; f < 3; f++) for(var c = 0; c < 2; c++){
        if(f === 0 && c === 0) continue;
        if((f + c + h.pat) % 2) continue;                 // already lit
        cand(2.1, 'lightOn', h, {f:f, c:c}); cand(2.0, 'lightOff', h, {f:f, c:c});
      }
      if(!h.dish) cand(2.1, 'new', null, {kind:'dish', host:h, at:{x:h.x + 1.7, y:8.66, z:ZB - 0.9}});
      if(!h.flowers) cand(1.6, 'new', null, {kind:'flowers', host:h, at:{x:h.x - 1.4, y:rng() < 0.5 ? 3.79 : 6.59, z:FRONT + 1.2}});
    });

    /* Roughly where a thing lands on the photo (shares of width and height),
       so two changes are never chosen on top of each other. */
    function screenBox(x, y, z, kind){
      var asp = 1.08, t = Math.tan(CAM.fov*Math.PI/360), dist = Math.max(CAM.halfW/(t*asp), CAM.halfH/t);
      var py = CAM.ty + dist*Math.sin(CAM.el), pz = CAM.tz + dist*Math.cos(CAM.el);
      var fy = CAM.ty - py, fz = CAM.tz - pz, fl = Math.hypot(fy, fz); fy /= fl; fz /= fl;
      function proj(px, h){ var dy = h - py, dz = z - pz, d = dy*fy + dz*fz, up = -dy*fz + dz*fy;
        return [(px/(d*t*asp) + 1)/2, (1 - up/(d*t))/2]; }
      var sz = SIZE[kind] || [1, 1];
      if(kind === 'house') z += 2.75; else if(kind === 'shop') z += 2.5;
      var a = proj(x - sz[0]/2, y), b = proj(x + sz[0]/2, y + sz[1]);
      return {x0:a[0], x1:b[0], y0:b[1], y1:a[1]};
    }
    function boxOf(c){
      var it = c.it, x = c.x;
      if(c.type === 'lightOn' || c.type === 'lightOff') return screenBox(it.x - 1.5 + 3*x.c, 0.95 + 2.8*x.f, FRONT + 0.15, 'light');
      if(x.slot) return screenBox(x.slot.x, 0, x.slot.z, x.kind);
      if(x.at) return screenBox(x.at.x, x.at.y, x.at.z, x.kind);
      var k = it.kind === 'car' && c.type === 'swap' ? 'van' : it.kind;
      return screenBox(it.x, it.y || 0, it.z, k);
    }
    function clash(a, b){
      function inside(r, px, py){ return px >= r.x0 && px <= r.x1 && py >= r.y0 && py <= r.y1; }
      return inside(a, (b.x0 + b.x1)/2, (b.y0 + b.y1)/2) || inside(b, (a.x0 + a.x1)/2, (a.y0 + a.y1)/2);
    }

    /* ---- choose: big changes first on early levels, then anything ---- */
    var thr = hard ? 1.4 : n <= 1 ? 3 : n === 2 ? 2.4 : n === 3 ? 2.1 : 1.5;
    var pool = cands.filter(function(c){ return c.w >= thr; });
    pool.forEach(function(c){ c.r = rng()*(hard ? 1/c.w : Math.sqrt(c.w)); });
    pool.sort(function(a, b){ return b.r - a.r; });
    var chosen = [], usedItem = {}, usedZone = {}, perFam = {}, wall = 0;
    function zoneOf(c){
      if(c.x.host) return c.x.host.id;
      var it = c.it, sl = c.x.slot;
      if(it && (it.host || it.kind === 'house' || it.kind === 'shop')) return it.host || it.id;
      var x = it ? it.x : sl.x, row = it ? it.row : sl.row;
      return row + Math.round(x/3);
    }
    for(var pass = 1; pass <= 3 && chosen.length < diffs; pass++){
      for(var i = 0; i < pool.length && chosen.length < diffs; i++){
        var c = pool[i], it = c.it, fam = c.type + ':' + (it ? it.kind : c.x.kind);
        if(c.done) continue;
        if(it && usedItem[it.id] && c.type !== 'lightOn' && c.type !== 'lightOff') continue;
        var z = zoneOf(c);
        if(usedZone[z]) continue;
        if((perFam[fam] || 0) >= pass) continue;
        var isWall = c.type === 'colour' && it && (it.kind === 'house' || it.kind === 'shop');
        if(isWall && wall >= 1) continue;
        if(c.x.slot && c.x.slot.used) continue;
        var bx = boxOf(c);
        if(chosen.some(function(o){ return clash(o.box, bx); })) continue;
        c.box = bx;
        c.done = true; usedZone[z] = 1; perFam[fam] = (perFam[fam] || 0) + 1;
        if(it) usedItem[it.id] = 1;
        if(isWall) wall++;
        if(c.x.slot) c.x.slot.used = true;
        chosen.push(c);
      }
    }

    /* ---- apply them ---- */
    var edits = chosen.map(function(c){
      var it = c.it, e;
      if(c.type === 'colour'){
        if(it.kind === 'shop' && rich){ it.awB = other(it.aw, 4); return {id:it.id, type:'colour', kind:'shop', what:'awning'}; }
        var avoid = null;
        if(it.kind === 'house' || it.kind === 'shop'){
          var bi = BX.indexOf(it.x);
          avoid = [hues[bi - 1], hues[bi + 1]].filter(function(v){ return v != null; });
        }
        it.hueB = other(it.hue, NHUE[it.kind] || 6, avoid);
        return {id:it.id, type:'colour', kind:it.kind, what:it.kind === 'person' ? 'tuque' : it.kind};
      }
      if(c.type === 'gone'){ it.only = 'A'; return {id:it.id, type:'gone', kind:it.kind}; }
      if(c.type === 'swap'){
        it.kindB = {tree:'pine', pine:'tree', car:'van', van:'car'}[it.kind];
        return {id:it.id, type:'swap', kind:it.kind, kindB:it.kindB};
      }
      if(c.type === 'lightOn' || c.type === 'lightOff'){
        var L = add({kind:'light', x:it.x - 1.5 + 3*c.x.c, y:1.7 + 2.8*c.x.f, z:FRONT + 0.15, host:it.id, row:'b',
                     only:c.type === 'lightOn' ? 'B' : 'A'});
        return {id:L.id, type:c.type, kind:'light'};
      }
      // new
      var o;
      if(c.x.slot) o = add(small(c.x.kind, c.x.slot.x, c.x.slot.z, c.x.slot.row));
      else o = add({kind:c.x.kind, x:c.x.at.x, y:c.x.at.y, z:c.x.at.z, hue:rnd(4), host:c.x.host.id, row:'b'});
      o.only = 'B';
      e = {id:o.id, type:'new', kind:o.kind};
      return e;
    });

    var time = Math.round((16 + 11*edits.length)*(hard ? 0.85 : 1));
    return {P:{hard:hard}, items:items, edits:edits, diffs:edits.length, time:time, rich:rich};
  }

  window.FindLogic = {generate:generate, CAM:CAM, SIZE:SIZE, NHUE:NHUE};
})();
</script>
<script>
/* Métro Lines level data. Pure logic, no drawing.

   The map is a square grid. Each line has two terminus stations of its
   colour; the player draws the line between them. Lines may not cross or
   share a square, and together they must cover the whole map. Some lines
   also have small stations on the way that they must serve.

   Every level is solvable by construction: the generator first lays one
   random path through every square of the map (a Hamiltonian path, shuffled
   with "backbite" moves), then cuts it into the lines. Those pieces are the
   reference solution, used by the hint and by the automated player. Any
   other arrangement that follows the rules also wins. */
(function(){
  'use strict';
  var mulberry32 = window.DetourLogic.mulberry32;

  /* Lines 1, 2, 4 and 5 wear the real Montréal metro colours; the rest are
     the lines the city has been promising for years. */
  var LINE_COLORS = [
    {c:'#00a651', d:'#00713a', num:1}, {c:'#f58220', d:'#b65a06', num:2},
    {c:'#ffcd00', d:'#b38f00', num:4}, {c:'#0079c1', d:'#00528a', num:5},
    {c:'#9a4fd8', d:'#66299a', num:6}, {c:'#ee5fae', d:'#a92d70', num:7},
    {c:'#26bfd6', d:'#10849a', num:8}, {c:'#e8413c', d:'#a3271f', num:9}
  ];

  function params(n){
    var hard = n >= 5 && n % 5 === 0;
    var size = n <= 2 ? 5 : n <= 4 ? 6 : n <= 9 ? 7 : 8;
    var lines = n <= 1 ? 3 : n <= 2 ? 4 : n <= 4 ? 5 : n <= 9 ? 6 : 7;
    if(hard){ lines = Math.max(3, lines - 1); size = Math.min(size, 7); }   // fewer, longer lines are harder to route; 7×7 keeps the search quick
    var stops = n < 3 ? 0 : n < 6 ? 1 : 2;              // stations a line must serve on its way
    return {n:n, hard:hard, size:size, lines:lines, stops:stops};
  }

  /* A random path through every square: start from a zigzag, then apply
     backbite moves, which keep it a single path through all squares. */
  function hamiltonian(W, H, rng, iters){
    var N = W*H, path = [], pos = new Int32Array(N), x, y, i;
    for(y = 0; y < H; y++) for(i = 0; i < W; i++){ x = y % 2 ? W - 1 - i : i; path.push(y*W + x); }
    function reindex(a, b){ for(var k = a; k <= b; k++) pos[path[k]] = k; }
    reindex(0, N - 1);
    for(var it = 0; it < iters; it++){
      if(rng() < 0.5){ path.reverse(); reindex(0, N - 1); }
      var end = path[N - 1], ex = end % W, ey = (end - ex)/W, nb = [];
      if(ex > 0) nb.push(end - 1);
      if(ex < W - 1) nb.push(end + 1);
      if(ey > 0) nb.push(end - W);
      if(ey < H - 1) nb.push(end + W);
      var j = pos[nb[Math.floor(rng()*nb.length)]];
      if(j === N - 2) continue;
      var a = j + 1, b = N - 1;
      while(a < b){ var t = path[a]; path[a] = path[b]; path[b] = t; a++; b--; }
      reindex(j + 1, N - 1);
    }
    return path;
  }
  function adjacent(a, b, W){
    var ax = a % W, ay = (a - ax)/W, bx = b % W, by = (b - bx)/W;
    return Math.abs(ax - bx) + Math.abs(ay - by) === 1;
  }
  /* How twisty a line is: a dead straight line is no puzzle. */
  function turns(seg, W){
    var t = 0;
    for(var i = 2; i < seg.length; i++){
      var d1 = seg[i - 1] - seg[i - 2], d2 = seg[i] - seg[i - 1];
      if(d1 !== d2) t++;
    }
    return t;
  }

  /* How hard a map really is, from every way to solve it (up to a cap).
     answers: how many solutions there are. twist: in the smoothest solution,
     the most turns any one line has to make. Players draw smooth lines by
     instinct, so a map whose every answer needs a snaking line is hard, and
     a map with only a few answers leaves no room for error. */
  function analyze(level, cap, nodeCap){
    var W = level.size, N = W*W, K = level.lines.length, c, i;
    var own = new Int8Array(N).fill(-1), term = new Int8Array(N).fill(-1), NB = [];
    level.lines.forEach(function(L, k){ term[L.a] = k; term[L.b] = k; });
    for(c = 0; c < N; c++){
      var x = c % W, y = (c - x)/W, o = [];
      if(x) o.push(c - 1); if(x < W - 1) o.push(c + 1); if(y) o.push(c - W); if(y < W - 1) o.push(c + W);
      NB.push(o);
    }
    var answers = 0, nodes = 0, best = 99, paths = level.lines.map(function(){ return []; });
    cap = cap || 400; nodeCap = nodeCap || 500000;
    function dead(head){
      for(var q = 0; q < N; q++){
        if(own[q] !== -1) continue;
        var k = 0, nb = NB[q];
        for(var j = 0; j < nb.length; j++) if(own[nb[j]] === -1 || nb[j] === head) k++;
        if(k < (term[q] !== -1 ? 1 : 2)) return true;
      }
      return false;
    }
    function line(li){
      if(answers >= cap || nodes > nodeCap) return;
      if(li === K){
        for(var q = 0; q < N; q++) if(own[q] === -1) return;
        answers++;
        var mx = 0; for(var j = 0; j < K; j++) mx = Math.max(mx, turns(paths[j], W));
        if(mx < best) best = mx;
        return;
      }
      var L = level.lines[li];
      own[L.a] = li; paths[li] = [L.a];
      walk(li, L, L.a);
      own[L.a] = -1;
    }
    function walk(li, L, head){
      if(answers >= cap || ++nodes > nodeCap) return;
      var nb = NB[head];
      for(var j = 0; j < nb.length; j++){
        var d = nb[j];
        if(d === L.b){
          own[d] = li; paths[li].push(d);
          if(L.stops.every(function(st){ return own[st] === li; }) && !dead(-1)) line(li + 1);
          own[d] = -1; paths[li].pop(); continue;
        }
        if(own[d] !== -1 || term[d] !== -1) continue;
        own[d] = li; paths[li].push(d);
        if(!dead(d)) walk(li, L, d);
        own[d] = -1; paths[li].pop();
      }
    }
    line(0);
    return {answers:answers, capped:answers >= cap || nodes > nodeCap, twist:best === 99 ? null : best};
  }
  /* What each level on the route should feel like. The first map is smooth;
     the second teaches snaking (one line has to zigzag); stations arrive on
     an easy map; the "hard" map is genuinely the hardest of the five. */
  function band(n){
    if(n <= 1) return {twistMax:3, answersMin:2};
    if(n === 2) return {twistMin:3, twistMax:4, answersMax:8};
    if(n === 3) return {twistMax:3, answersMin:3};
    if(n === 4) return {twistMax:4, answersMin:4};
    if(n === 5) return {twistMin:4, twistMax:5, answersMax:40};
    if(n <= 8) return {twistMax:5, answersMin:2};
    if(n % 5 === 0) return {twistMin:4, twistMax:6, answersMax:40};      // every fifth level is a hard one: few answers, a snaking line
    return {twistMax:6, answersMin:1};
  }
  function miss(b, m){                        // how far a map is from its band; 0 is a fit
    if(m.twist == null) return 99;
    var d = 0;
    if(b.twistMax != null && m.twist > b.twistMax) d += (m.twist - b.twistMax)*3;
    if(b.twistMin != null && m.twist < b.twistMin) d += (b.twistMin - m.twist)*3;
    if(b.answersMin != null && m.answers < b.answersMin) d += 1 + (b.answersMin - m.answers)*0.3;
    if(b.answersMax != null && !m.capped && m.answers > b.answersMax) d += 1 + Math.log(m.answers/b.answersMax);
    if(b.answersMax != null && m.capped) d += 4;
    return d;
  }

  function generate(n, seed){
    var P = params(n), W = P.size, N = W*W, b = band(n), best = null, tries = 0;
    var rng = mulberry32(seed != null ? seed : 4400 + n*7331);
    for(var attempt = 0; attempt < 400; attempt++){
      var path = hamiltonian(W, W, rng, 900 + N*30);
      // cut it into lines, each at least 3 squares, none trivially short
      var K = P.lines, minLen = N >= 36 ? 4 : 3, lens = [], i;
      for(i = 0; i < K; i++) lens.push(minLen);
      for(var left = N - K*minLen; left > 0; left--) lens[Math.floor(rng()*K)]++;
      var segs = [], at = 0, ok = true;
      for(i = 0; i < K; i++){ segs.push(path.slice(at, at + lens[i])); at += lens[i]; }
      for(i = 0; i < K && ok; i++){
        var s = segs[i];
        if(adjacent(s[0], s[s.length - 1], W)) ok = false;          // its two ends must not touch
        if(s.length >= 5 && turns(s, W) < 1) ok = false;              // and it must bend at least once
      }
      if(!ok) continue;
      // the order of colours on the map is shuffled, so line 1 is not always first along the path
      var order = segs.map(function(_, k){ return k; });
      for(i = order.length - 1; i > 0; i--){ var r = Math.floor(rng()*(i + 1)), tmp = order[i]; order[i] = order[r]; order[r] = tmp; }
      var lines = order.map(function(si, k){
        var sg = segs[si];
        return {c:k, a:sg[0], b:sg[sg.length - 1], path:sg.slice(), stops:[]};
      });
      // stations to serve: on the longest lines, never next to an end
      var byLen = lines.slice().sort(function(p, q){ return q.path.length - p.path.length; });
      for(i = 0; i < P.stops && i < byLen.length; i++){
        var L = byLen[i];
        if(L.path.length < 7) break;
        var idx = 2 + Math.floor(rng()*(L.path.length - 4));
        L.stops.push(L.path[idx]);
      }
      var level = {P:P, size:W, lines:lines, seed:seed};
      var m = analyze(level, 400, 400000), d = miss(b, m);
      level.answers = m.answers; level.twist = m.twist;
      if(!best || d < best.d){ best = {level:level, d:d}; }
      if(d === 0 || ++tries >= 40) break;
    }
    if(!best) throw new Error('metro: no level');
    return best.level;
  }

  /* Do these drawn paths win? paths[c] is a list of squares from one end. */
  function check(level, paths){
    var W = level.size, N = W*W, seen = new Uint8Array(N), covered = 0, connected = 0, served = true;
    level.lines.forEach(function(L){
      var p = paths[L.c] || [];
      var done = p.length >= 2 && ((p[0] === L.a && p[p.length - 1] === L.b) || (p[0] === L.b && p[p.length - 1] === L.a));
      for(var i = 0; i < p.length; i++){
        if(i && !adjacent(p[i - 1], p[i], W)) done = false;
        if(!seen[p[i]]){ seen[p[i]] = 1; covered++; }
      }
      if(done) connected++;
      L.stops.forEach(function(s){ if(p.indexOf(s) < 0) served = false; });
    });
    return {connected:connected, lines:level.lines.length, covered:covered, cells:N, served:served,
            won:connected === level.lines.length && covered === N && served};
  }

  window.MetroLogic = {generate:generate, check:check, params:params, adjacent:adjacent, analyze:analyze, band:band, turns:turns, COLORS:LINE_COLORS};
})();
</script>
<script>
/* Déneigement level data. Pure logic, no drawing.

   A grid of streets under snow, walled in by buildings and snowbanks. The
   plow slides in the direction you swipe until something stops it, clearing
   every square it passes. Clear every street.

   Levels are carved by driving: the generator drops a plow on an empty city
   and repeatedly picks a direction and a distance, opening that stretch of
   street and then letting the plow slide for real. A breadth-first solver

        S.lane = S.from; S.bumpT = 0.3; S.events.push({t:'bump', ob:ob});
        continue;
      }
      if(S.inv > 0) continue;
      ob.hit = true;
      if(S.shield){ S.shield = false; S.inv = 0.6; S.events.push({t:'shield', ob:ob}); continue; }
      S.hearts--; S.hits++; S.inv = 1.5; S.slow = 0.45; S.slideT = 0;
      S.events.push({t:'hit', ob:ob});
      if(S.hearts <= 0){ S.over = 'lost'; return S.events; }
    }
    // coins: a magnet pulls in every coin just ahead, from any lane
    var py = S.y + height(S)*0.5;
    for(var c = 0; c < T.coins.length; c++){
      var co = T.coins[c];
      if(co.got) continue;
      var dz = co.z - S.d;
      if(dz > 20) continue;
      if(S.magnetT > 0 && dz < 14 && dz > -1){
        var f = Math.min(1, dt*9);
        co.x += (S.x - co.x)*f; co.y += (py - co.y)*f; co.z -= Math.min(dz + 0.5, S.v*0.5*dt);
        co.mag = true;
      }
      if(Math.abs(dz) < 0.9 && Math.abs(co.x - S.x) < 0.95 && Math.abs(co.y - py) < 1.25){
        co.got = true; S.coins++; S.events.push({t:'coin', c:co});
      }
    }
    for(var p = 0; p < T.powers.length; p++){
      var pw = T.powers[p];
      if(pw.got || Math.abs(pw.z - S.d) > 1.0 || Math.abs(pw.x - S.x) > 1.0 || S.y > 1.8) continue;
      pw.got = true;
      if(pw.kind === 'hat') S.shield = true; else S.magnetT = 9;
      S.events.push({t:'power', p:pw});
    }
    if(!P.endless && S.d >= T.finish && S.finishT < 0){ S.finishT = 0; S.events.push({t:'finish'}); }
    return S.events;
  }
  /* After running out of hearts, one more go: a heart back, a moment of
     safety, and whatever you hit cleared away. */
  function revive(S){
    S.over = null; S.hearts = 1; S.inv = 2.2; S.slow = 0.5; S.revived++; S.y = 0; S.vy = 0; S.slideT = 0;
    S.x = (S.lane - 1)*LANE_W;
    S.T.obs.forEach(function(ob){ var oz = obZ(ob, S.d, S.v); if(oz < S.d + 14 && oz + ob.len > S.d - 2) ob.hit = true; });
  }
  function stars(S){ return S.revived ? 1 : Math.max(1, 3 - S.hits); }

  /* ---------- a player for the tests ----------
     It reads the rows ahead, heads for a lane it can pass, and jumps or
     slides at the right moment. It plays fair: it only reacts to what is
     within sight, and swerves only when the lanes it crosses are clear. */
  function bot(S){
    if(S.over || S.finishT >= 0) return -1;
    var T = S.T, pz = S.d, v = S.v;
    var rows = T.rows.filter(function(r){ return r.end > pz - HALF; });
    if(!rows.length) return -1;
    var r0 = rows[0], r1 = rows[1];
    function okLane(r, l){ return r.lanes[l] !== 'B' && r.lanes[l] !== 'X'; }
    function blockedAt(l, a, b){                  // anything solid in lane l between a and b?
      for(var i = 0; i < T.obs.length; i++){
        var ob = T.obs[i]; if(ob.hit || ob.lane !== l || ob.need !== 'block') continue;
        var oz = obZ(ob, pz, v);
        if(oz < b && oz + ob.len > a) return true;
      }
      return false;
    }
    // aim: the lane of the next row you can pass, closest to where you are,
    // that also leads on to the row after
    var cur = S.lane, best = -1, bs = 1e9;
    var target = r0.z - pz < -0.2 && r1 ? r1 : r0;
    for(var l = 0; l < 3; l++){
      if(!okLane(target, l)) continue;
      var sc = Math.abs(l - cur)*2;
      var nx = rows[rows.indexOf(target) + 1];
      if(nx){ var m = 9; for(var q = 0; q < 3; q++) if(okLane(nx, q)) m = Math.min(m, Math.abs(q - l)); sc += m*0.7; }
      if(target.lanes[l] !== '-') sc += 0.4;
      if(sc < bs){ bs = sc; best = l; }
    }
    if(best >= 0 && best !== cur && S.x === (cur - 1)*LANE_W){
      var nb = cur + (best > cur ? 1 : -1);
      if(!blockedAt(nb, pz - HALF - 0.6, pz + HALF + v*0.18 + 0.6)) return best > cur ? 1 : 3;
    }
    // jump or slide for whatever stands in this lane
    for(var i = 0; i < T.obs.length; i++){
      var ob = T.obs[i];
      if(ob.hit) continue;
      var inLane = ob.span ? true : ob.lane === S.lane;
      if(!inLane) continue;
      var dz = obZ(ob, pz, v) - (pz + HALF);
      if(dz < -ob.len || dz > v*0.6) continue;
      if(ob.need === 'low' && S.y === 0 && dz < v*0.2 + 0.3 && dz > -0.2) return 0;
      if(ob.need === 'high' && S.slideT < 0.25 && dz < v*0.14 + 0.5) return 2;
    }
    return -1;
  }

  window.RunLogic = {params:params, track:track, newRun:newRun, act:act, step:step, revive:revive, stars:stars,
                     bot:bot, obZ:obZ, speedAt:speedAt, height:height, LANE_W:LANE_W, BODY:BODY, CROUCH:CROUCH, UNDER:UNDER, LEN:LEN};
})();

<script>
/* STM Rush: the bus sorting game, as a plug-in module.
   Livery note: white body, deep blue skirt, dark window band and a route sign.
   The transit look is evoked, never copied: the emblem and the name on the
   bus are our own ("Ti-Bus" with a cone badge), not any real operator's mark. */
(function(){
  'use strict';
  var C = window.Core, LG = window.DetourLogic;
  var DIRA = {U:-Math.PI/2, D:Math.PI/2, L:Math.PI, R:0};
  var ROUTES = ['24','55','80','105','165','747','51','139','97','470'];
  var STATIONS = ['Berri-UQAM','Lionel-Groulx','Place-des-Arts','McGill','Peel','Guy-Concordia',
                  'Bonaventure','Square-Victoria','Saint-Laurent','Sherbrooke'];

  function mix(a, b, f){
    var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    var r = Math.round(((pa >> 16) & 255)*(1-f) + ((pb >> 16) & 255)*f);
    var g = Math.round(((pa >> 8) & 255)*(1-f) + ((pb >> 8) & 255)*f);

  function create(level, n, api){
    var S, G = null, flakes = C.makeSnow(34);

      var minY = Math.min.apply(null, LG.cellsOf(v).map(function(c){ return c[1]; }));
      return {id:i, type:v.type, L:v.L, cap:v.cap, dir:v.dir, hx:v.hx, hy:v.hy, color:v.color,
              route:ROUTES[i % ROUTES.length],

    });

      return {c:c, skin:C.SKINS[Math.floor(srng()*C.SKINS.length)], x:0, y:0, ph:srng()*6.28};
    });

    S = {
      P:P, gen:gen, cones:gen.cones, vehicles:vehicles, queue:queue,
      bays:[null,null,null,null,null], bayCount:4, extraUsed:false, parkCounter:0,
      flyers:[], parts:[], floats:[], coneShake:{},
      time:0, over:false, boardTimer:.5, stuckT:0, combo:0, lastDepart:-9,
      coinsEarned:0, towMode:false, winT:-1, bumps:0,
      station:(window.Places && window.Places.current() && window.Places.current().station) || STATIONS[(n-1) % STATIONS.length]
    };
    S.occ = new Int16Array(P.cols*P.rows).fill(-1);
    gen.cones.forEach(function(c){ S.occ[c.y*P.cols + c.x] = -2; });
    // construction season: work zones close squares until enough vehicles have left
    S.out = 0;
    S.zones = (gen.zones || []).map(function(z){ return {cells:z.cells, after:z.after, open:false, openT:0}; });
    S.zones.forEach(function(z){ z.cells.forEach(function(c){ S.occ[c.y*P.cols + c.x] = -3; }); });
    vehicles.forEach(function(v){ LG.cellsOf(v).forEach(function(cell){ S.occ[cell[1]*P.cols + cell[0]] = v.id; }); });

    var inst = {
      status:'play', result:null, lose:null, tip:null,
      boosters:['stop','tow'], subtitle:null, station:S.station,   // the station's name is on the Métro sign above the board twist:S.zones.length ? 'work' : null
    };

    /* ---------- geometry ---------- */
    function layout(g){
      G = g;
      var cols = P.cols, rows = P.rows, W = G.W, H = G.H;
      var small = H < 700;
      var stationMin = small ? 40 : 76, bayMin = small ? 72 : 84, walkH = 62;
      G.roadW = 30;
      var availH = H - (stationMin + walkH + 4 + bayMin + G.roadW) - G.roadW - 10;
      var availW = W - 2*G.roadW - 8;
      G.cell = Math.max(18, Math.floor(Math.min(availW/cols, availH/rows)));
      G.lotW = cols*G.cell; G.lotH = rows*G.cell;
      G.lotX = Math.round((W - G.lotW)/2);
      G.lotY = Math.round(H - G.roadW - 10 - G.lotH);
      G.bayBottom = G.lotY - G.roadW;
      G.bayDepth = C.clamp(G.bayBottom - (stationMin + walkH + 4), 64, 128);
      G.bayTop = G.bayBottom - G.bayDepth;
      G.walkBottom = G.bayTop - 4; G.walkTop = G.walkBottom - walkH; G.walkH = walkH;
      G.stationH = Math.max(24, G.walkTop);
      G.topRoadY = G.lotY - G.roadW/2; G.bottomRoadY = G.lotY + G.lotH + G.roadW/2;
      G.leftRoadX = G.lotX - G.roadW/2; G.rightRoadX = G.lotX + G.lotW + G.roadW/2;
      G.slotW = Math.min(76, (W - 28)/5); G.bayY = G.bayTop + G.bayDepth/2 + 4;
      G.bayX = [0,1,2,3,4].map(function(i){ return W/2 + (i-2)*G.slotW; });
      G.signX = 10; G.signW = 58;
      G.qx0 = G.signX + G.signW + 14; G.qSpacing = 14; G.qRowGap = 27; G.qRows = 2;
      G.qPerRow = Math.floor((W - 12 - G.qx0)/G.qSpacing) + 1;
      G.qRow0Y = G.walkBottom - 7;
      S.vehicles.forEach(snapVehicle);
      for(var i = 0; i < S.queue.length; i++){ var p = slotPos(i); S.queue[i].x = p.x; S.queue[i].y = p.y; }
      build3d();
    }
    /* ---------- the 3D layer ----------
       Vehicles and cones are real models, rendered over the painted board.
       Ground position is screen position, and height rises up the screen,
       so a model stands exactly on the cells the puzzle thinks it fills. */
    var lot3d = null;
    function build3d(){
      if(lot3d){ lot3d.dispose(); lot3d = null; }
      if(!window.Kit3D || !window.Kit3D.available()) return;
      try {
        lot3d = window.Kit3D.lotView(G);
        var KN = window.Kenney && window.Kenney.isReady() ? window.Kenney : null;
        // Bus Rush keeps our own buses and cars: their bold, simple shapes read

        S.vehicles.forEach(function(v){
          lot3d.vehicle('v' + v.id, v.type, C.COLORS[v.color], v.L*G.cell - 6, G.cell - 8);
        });
        S.cones.forEach(function(cn, i){
          if(KN) lot3d.add('c' + i, KN.cone(G.cell*0.82));
          else lot3d.cone('c' + i, G.cell*0.8);
        });
        S.zones.forEach(function(z, zi){
          z.cells.forEach(function(cn, j){
            if(KN) lot3d.add('z' + zi + '_' + j, KN.cone(G.cell*0.72));
            else lot3d.cone('z' + zi + '_' + j, G.cell*0.7);

    }
    function use3d(){ return lot3d && window.Kit3D.available(); }
    /* Where the roof of v sits on screen, and how big it is. */
    function roofTop(v){                       // how high the roof of v stands, unscaled
      var m = lot3d && lot3d.get('v' + v.id), K = window.Kit3D;
      if(m && m.userData && typeof m.userData.roof === 'object') return m.userData.roof.h;
      return (K.ROOF[v.type] || 0.78)*(G.cell - 8);
    }
    function roofOf(v){
      var K = window.Kit3D, rb = K.ROOFBOX[v.type] || K.ROOFBOX.car;
      var len = v.L*G.cell - 6, wd = G.cell - 8, s = v.scale*introScale(v);
      if(v.pop > 0) s *= 1 + .12*Math.sin(Math.PI*(1 - v.pop/.25));
      var m = lot3d && lot3d.get('v' + v.id), kr = m && m.userData && typeof m.userData.roof === 'object' ? m.userData.roof : null;
      var h = ((kr ? kr.h : (K.ROOF[v.type] || 0.78)*wd) + (v.state === 'lift' ? 9 : 0))*s;
      var cx = kr ? kr.cx*s : rb.cx*len*s;
      if(kr){
        return {x:v.x + Math.cos(v.ang)*cx + K.KX*h, y:v.y + Math.sin(v.ang)*cx - K.KY*h,
                len:Math.max(kr.l, len*0.42), wd:Math.min(kr.w, wd*0.86), s:s};
      }
      return {x:v.x + Math.cos(v.ang)*cx + K.KX*h, y:v.y + Math.sin(v.ang)*cx - K.KY*h,
              len:rb.l*len, wd:rb.w*wd, s:s};
    }
    function sync3d(){
      S.vehicles.forEach(function(v){
        var m = lot3d.get('v' + v.id);
        if(!m) return;
        var s = v.scale*introScale(v);
        if(v.state === 'gone' || s <= .01){ m.visible = false; return; }
        if(v.pop > 0) s *= 1 + .12*Math.sin(Math.PI*(1 - v.pop/.25));
        var ox = v.shake > 0 ? Math.sin(S.time*70)*2.4*(v.shake/.3) : 0;
        m.visible = true;
        // the body dips as it sets off
        var moving = v.path ? 1 : 0;
        m.position.set(v.x + ox, v.state === 'lift' ? 9*s : 0, v.y);
        m.rotation.set(0, -v.ang, moving ? Math.sin(Math.min(1, v.pt/0.18)*Math.PI)*0.06 : 0);
        m.scale.setScalar(s);
      });
      S.cones.forEach(function(cn, i){
        var m = lot3d.get('c' + i), sh = S.coneShake[cn.y*P.cols + cn.x] || 0;
        m.position.set(G.lotX + (cn.x + .5)*G.cell, 0, G.lotY + (cn.y + .5)*G.cell);
        m.rotation.set(0, 0.5, sh > 0 ? Math.sin(S.time*60)*sh*0.5 : 0);
      });
      S.zones.forEach(function(z, zi){
        z.cells.forEach(function(cn, j){
          var m = lot3d.get('z' + zi + '_' + j);
          if(!m) return;
          var sc = z.open ? Math.max(0, 1 - z.openT/0.35) : 1, sh = S.coneShake[cn.y*P.cols + cn.x] || 0;
          m.visible = sc > 0.01;
          m.position.set(G.lotX + (cn.x + .5)*G.cell + (j ? 4 : -3), z.open ? z.openT*40 : 0, G.lotY + (cn.y + .5)*G.cell);
          m.scale.setScalar(sc);
          m.rotation.set(0, 0.3 + j, sh > 0 ? Math.sin(S.time*60)*sh*0.5 : (z.open ? z.openT*8 : 0));
        });
      });
    }
    /* What the player needs to read, painted on each roof: the arrow while it
       waits in the lot, the seat dots once it is parked, the route number. */
    function drawRoof(c, v){
      if(v.state === 'gone') return;
      var r = roofOf(v);
      if(r.s <= .01) return;
      var col = C.COLORS[v.color], len = r.len, wd = r.wd;
      c.save(); c.translate(r.x, r.y); c.rotate(v.ang); c.scale(r.s, r.s);
      var showArrow = v.state === 'lot' || v.state === 'bump';
      if(showArrow){
        var shift = C.save.symbols ? 4 : 0, al = Math.min(len - 8 - shift, 30);
        if(v.type === 'bus') al = Math.min(len*0.6, 34);
        drawArrowFor(c, col, shift + (v.type === 'bus' ? -len*0.08 : 0), 0, al, Math.min(wd - 8, 20));
      } else {
        drawSeats(c, v, Math.max(len, 30), wd*1.05, r.s);
      }
      if(v.type === 'bus'){
        c.fillStyle = 'rgba(20,30,46,.9)';
        var ca = Math.cos(v.ang), sa = Math.sin(v.ang);
        // keep the route number upright whichever way the bus faces
        c.save(); c.translate(len/2 - wd*0.42, 0); c.rotate(ca < -0.1 || (Math.abs(ca) <= 0.1 && sa > 0) ? -Math.PI/2 : Math.PI/2);
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = '800 ' + Math.max(5, wd*.3) + 'px Nunito, sans-serif';
        C.fitText(c, v.route, 0, 0, wd*0.8);
        c.restore();
      }
      c.restore();
      if(C.save.symbols && showArrow){
        var lx = -len/2 + 7, sx = r.x + Math.cos(v.ang)*lx*r.s, sy = r.y + Math.sin(v.ang)*lx*r.s;
        C.symbolMark(c, col.shape, sx, sy, Math.max(3.5, (G.cell - 8)*.13));
      }
    }
    function slotPos(i){
      var per = G.qPerRow, row = Math.floor(i/per), col = i % per;
      if(row >= G.qRows) return {x:G.W + 20, y:G.qRow0Y - (G.qRows-1)*G.qRowGap};
      var x = row % 2 === 0 ? G.qx0 + col*G.qSpacing : G.qx0 + (per-1-col)*G.qSpacing;
      return {x:x, y:G.qRow0Y - row*G.qRowGap};
    }
    function lotCenter(v){
      var cs = LG.cellsOf(v), sx = 0, sy = 0;
      cs.forEach(function(c){ sx += c[0]; sy += c[1]; });
      return {x:G.lotX + (sx/cs.length + .5)*G.cell, y:G.lotY + (sy/cs.length + .5)*G.cell};
    }
    function parkScale(v){ return Math.min(1, (G.bayDepth-12)/(v.L*G.cell-6), (G.slotW-12)/(G.cell-8)); }
    function snapVehicle(v){
      if(v.state === 'lot' || v.state === 'bump'){
        var c = lotCenter(v); v.x = c.x; v.y = c.y; v.ang = DIRA[v.dir]; v.scale = 1; v.state = 'lot';
      } else if(v.state === 'toBay' || v.state === 'parked' || v.state === 'lift'){
        v.state = 'parked'; v.path = null; v.onDone = null;
        v.x = G.bayX[v.bay]; v.y = G.bayY; v.ang = -Math.PI/2; v.scale = parkScale(v);
      } else if(v.state === 'leaving'){ v.state = 'gone'; v.path = null; }
    }

    /* ---------- movement ---------- */
    function startMove(v, pts, o){
      var segs = [], len = 0, i;
      for(i = 1; i < pts.length; i++){
        var a = pts[i-1], b = pts[i], l = Math.hypot(b.x-a.x, b.y-a.y);
        if(l < .5) continue;
        segs.push({a:a, b:b, l:l, start:len, rev:!!b.rev}); len += l;
      }
      v.path = {segs:segs, len:len}; v.pt = 0;
      v.pT = Math.max(o.minT || .3, len/(o.speed || 1150)) + 0.12;     // a little extra for pulling away and braking
      v.s0 = v.scale; v.s1 = (o.scale != null ? o.scale : v.scale); v.onDone = o.done || null;
    }
    function stepMove(v, dt){
      v.pt += dt;
      var u = Math.min(1, v.pt/v.pT), e = C.trapez(v.pt, v.pT, 0.16, 0.24), d = e*v.path.len, segs = v.path.segs;
      if(segs.length){
        var seg = segs[segs.length-1], i;
        for(i = 0; i < segs.length; i++){ if(d <= segs[i].start + segs[i].l){ seg = segs[i]; break; } }
        var f = C.clamp((d - seg.start)/seg.l, 0, 1);
        v.x = seg.a.x + (seg.b.x - seg.a.x)*f; v.y = seg.a.y + (seg.b.y - seg.a.y)*f;
        var ta = Math.atan2(seg.b.y - seg.a.y, seg.b.x - seg.a.x);
        if(seg.rev) ta += Math.PI;
        v.ang = C.lerpAngle(v.ang, ta, 1 - Math.exp(-dt*16));
      }
      v.scale = v.s0 + (v.s1 - v.s0)*e;
      if(u >= 1){ v.path = null; var cb = v.onDone; v.onDone = null; if(cb) cb(); }
    }
    function exitPath(v, bay){
      var c = {x:v.x, y:v.y}, bx = G.bayX[bay], top = G.topRoadY, pts = [c];
      if(v.dir === 'U') pts.push({x:c.x, y:top});
      else if(v.dir === 'L') pts.push({x:G.leftRoadX, y:c.y}, {x:G.leftRoadX, y:top});
      else if(v.dir === 'R') pts.push({x:G.rightRoadX, y:c.y}, {x:G.rightRoadX, y:top});
      else {
        var sx = c.x < G.W/2 ? G.leftRoadX : G.rightRoadX;
        pts.push({x:c.x, y:G.bottomRoadY}, {x:sx, y:G.bottomRoadY}, {x:sx, y:top});
      }
      pts.push({x:bx, y:top}, {x:bx, y:G.bayY});
      return pts;
    }
    function blockerOf(v){ return LG.firstBlock(v, S.occ, P.cols, P.rows); }
    function removeFromOcc(v){
      LG.cellsOf(v).forEach(function(cell){
        var i = cell[1]*P.cols + cell[0];
        if(S.occ[i] === v.id) S.occ[i] = -1;
      });
    }
    function firstFreeBay(){ for(var i = 0; i < S.bayCount; i++) if(!S.bays[i]) return i; return -1; }
    function arrive(v){
      v.state = 'parked'; v.x = G.bayX[v.bay]; v.y = G.bayY; v.ang = -Math.PI/2; v.pop = .25;
      C.sfx.park();
    }
    /* One more vehicle has left the lot: any road work it was waiting on opens. */
    function leftLot(){
      S.out++;
      S.zones.forEach(function(z){
        if(z.open || S.out < z.after) return;
        z.open = true; z.openT = 0;
        z.cells.forEach(function(c){ var k = c.y*P.cols + c.x; if(S.occ[k] === -3) S.occ[k] = -1; });
        var c0 = z.cells[0], x = G.lotX + (c0.x + .5)*G.cell, y = G.lotY + (c0.y + .5)*G.cell;
        burst(x, y, 5, 14); floater(x, y - 26, C.t('roadOpen'), '#ffd34d', 18);
        C.sfx.clear(); C.haptic(20);
      });
    }
    function launch(v, bay){
      leftLot();
      removeFromOcc(v); v.state = 'toBay'; v.bay = bay; S.bays[bay] = v; v.order = ++S.parkCounter;
      startMove(v, exitPath(v, bay), {speed:1250, minT:.42, scale:parkScale(v), done:function(){ arrive(v); }});
      C.sfx.go(); C.haptic(8);
      if(S.tut === 1){ S.tut = 2; S.tutT = 0; inst.tip = C.t('tutBus2'); api.tip(inst.tip); }
    }
    function towVehicle(v){
      var b = firstFreeBay();
      if(b < 0){ api.toast(C.t('full')); return; }
      if(!api.spend(C.COST.tow)){ S.towMode = false; api.tip(null); api.refresh(); return; }
      S.towMode = false; api.tip(null); api.refresh();
      leftLot();
      removeFromOcc(v); v.state = 'lift'; v.bay = b; S.bays[b] = v; v.order = ++S.parkCounter;
      startMove(v, [{x:v.x,y:v.y},{x:v.x,y:v.y-24},{x:G.bayX[b],y:G.topRoadY},{x:G.bayX[b],y:G.bayY}],
                {speed:650, minT:.85, scale:parkScale(v), done:function(){ arrive(v); }});
      C.sfx.go(); C.haptic(15);
    }
    function startBump(v, blk){
      v.state = 'bump'; v.bt = 0; v.bT = .34; v.bDist = blk.free*G.cell + 7; v.blk = blk; v.bHit = false;
      S.bumps++;
    }
    function stepBump(v, dt){
      v.bt += dt;
      var u = Math.min(1, v.bt/v.bT), off = v.bDist*Math.sin(Math.PI*u), c = lotCenter(v), d = LG.DIRS[v.dir];
      v.x = c.x + d.dx*off; v.y = c.y + d.dy*off;
      if(!v.bHit && u >= .5){
        v.bHit = true;
        var b = v.blk;
        if(b.o >= 0){ var w = S.vehicles[b.o]; if(w) w.shake = .3; }
        else S.coneShake[b.y*P.cols + b.x] = .3;
        C.sfx.bump(); C.haptic(25);
      }
      if(u >= 1){ v.state = 'lot'; v.x = c.x; v.y = c.y; }
    }
    function depart(v){
      v.state = 'leaving';
      S.combo = (S.time - S.lastDepart < 2.2) ? S.combo + 1 : 1;
      S.lastDepart = S.time;
      var gain = 1 + (S.combo >= 2 ? Math.min(S.combo, 5) : 0);   // capped, so a long chain cannot run away
      api.coins(gain); S.coinsEarned += gain;
      floater(v.x, v.y - 30, '+' + gain, '#ffd34d', 18);
      if(S.combo >= 2) floater(v.x, v.y - 54, C.t('comboLbl') + ' x' + S.combo, '#ffffff', 16);
      burst(v.x, v.y, v.color, 18); C.sfx.honk(); C.haptic(18);
      startMove(v, [{x:v.x,y:v.y},{x:v.x,y:G.topRoadY,rev:true},{x:G.W+200,y:G.topRoadY}],
                {speed:900, minT:.75, done:function(){ v.state = 'gone'; }});
    }

    /* ---------- commuters ---------- */
    function updateBoarding(dt){
      S.boardTimer -= dt;
      if(S.boardTimer > 0 || !S.queue.length) return;
      var front = S.queue[0], best = null, i;
      for(i = 0; i < S.bayCount; i++){
        var v = S.bays[i];
        if(v && v.state === 'parked' && v.color === front.c && v.reserved < v.cap && (!best || v.order < best.order)) best = v;
      }
      if(!best) return;
      S.queue.shift(); best.reserved++;
      S.flyers.push({c:front.c, skin:front.skin, x0:front.x, y0:front.y, v:best, t:0, T:.24});
      if(best.reserved === best.cap) S.bays[best.bay] = null;
      S.boardTimer = .07; C.sfx.board(best.reserved);
    }
    function land(f){ var v = f.v; v.loaded++; if(v.loaded >= v.cap) depart(v); }

    /* ---------- effects ---------- */
    function burst(x, y, ci, n){
      for(var i = 0; i < n; i++){
        var a = Math.random()*Math.PI*2, sp = 80 + Math.random()*190;
        S.parts.push({x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 120, rot:Math.random()*6,
                      vr:(Math.random()-.5)*14, life:0, T:.8 + Math.random()*.4,
                      c:Math.random() < .35 ? '#ffffff' : C.COLORS[ci].c});
      }
    }
    function floater(x, y, text, color, size){ S.floats.push({x:x, y:y, text:text, color:color, size:size, t:0, T:1}); }

    /* ---------- drawing ---------- */
    function snowMound(c, x, y, r){
      c.fillStyle = '#d6e2ee'; c.beginPath(); c.arc(x+2, y+2, r, Math.PI, 0); c.fill();
      c.fillStyle = '#f9fcff'; c.beginPath(); c.arc(x, y, r, Math.PI, 0); c.fill();
    }
    function line(c, x1, y1, x2, y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
    function drawStation(c){
      var W = G.W, h = G.stationH, PL = window.Places;
      if(PL && PL.current()){
        // the terminal opens onto the place: its sky and landmark over a canopy
        PL.drawBand(c, 0, 0, W, h - 6, {near:false, lmAt:0.87, lmScale:1.12});
        var sn0 = C.season();
        c.fillStyle = '#2f3a4a'; c.fillRect(0, h - 8, W, 8);
        c.fillStyle = sn0.snowRoof ? '#fbfdff' : '#556274'; c.fillRect(0, h - 10, W, 3);
        var ph0 = C.clamp(h*.56, 22, 48);
        PL.drawPlaque(c, W/2, Math.max(8 + ph0/2, (h - 8)/2), Math.min(W - 40, 230), ph0, S.station, 'Métro');
        return;
      }
      c.fillStyle = '#9b4838'; c.fillRect(0, 0, W, h);
      c.strokeStyle = 'rgba(70,22,14,.28)'; c.lineWidth = 1;
      for(var y = 7, r = 0; y < h; y += 7, r++){
        c.beginPath(); c.moveTo(0, y+.5); c.lineTo(W, y+.5); c.stroke();
        for(var x = (r % 2 ? 0 : 10); x < W; x += 20){ c.beginPath(); c.moveTo(x+.5, y-7); c.lineTo(x+.5, y); c.stroke(); }
      }
      var wy = h*.24, wh = Math.max(10, h*.46), ww = 24;
      for(var wx = 14; wx < W - ww; wx += 56){
        if(Math.abs(wx + ww/2 - W/2) < 100) continue;
        c.fillStyle = '#5b2a20'; C.rrect(c, wx-2, wy-2, ww+4, wh+4, 10); c.fill();
        var g = c.createLinearGradient(0, wy, 0, wy+wh); g.addColorStop(0, '#c4e3f6'); g.addColorStop(1, '#7ea8c8');
        c.fillStyle = g; C.rrect(c, wx, wy, ww, wh, 9); c.fill();
        c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(wx + ww/2 - 1, wy+5, 2, wh-6);
        c.fillStyle = '#fbfdff'; C.rrect(c, wx-3, wy+wh, ww+6, 4, 2); c.fill();
      }
      c.fillStyle = '#6f3125'; c.fillRect(0, h-5, W, 5);
      c.fillStyle = '#fbfdff'; c.beginPath(); c.moveTo(0,0); c.lineTo(W,0); c.lineTo(W,5);
      for(var sx = W; sx > 0; sx -= 16) c.quadraticCurveTo(sx-8, (sx/16) % 2 ? 12 : 9, sx-16, 5);
      c.closePath(); c.fill();
      var ph = C.clamp(h*.56, 22, 48), pw = Math.min(W-40, 210), px = W/2 - pw/2, py = Math.max(8, (h-ph)/2 - 2);
      c.fillStyle = 'rgba(0,0,0,.25)'; C.rrect(c, px+2, py+3, pw, ph, 10); c.fill();
      c.fillStyle = '#1b2331'; C.rrect(c, px, py, pw, ph, 10); c.fill();
      c.strokeStyle = '#e9eef5'; c.lineWidth = 2; C.rrect(c, px+3, py+3, pw-6, ph-6, 8); c.stroke();
      c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '800 ' + Math.max(7, Math.round(ph*.22)) + 'px Nunito, sans-serif';
      c.fillText('Métro', W/2, py + ph*.3);
      c.font = Math.round(ph*.4) + 'px "Lilita One", Nunito, sans-serif';
      C.fitText(c, S.station, W/2, py + ph*.66, pw-22);
    }
    function drawSlot(c, i){
      var cx = G.bayX[i], w = G.slotW - 8, x = cx - w/2, y = G.bayTop + 8, h = G.bayDepth - 10;
      c.fillStyle = 'rgba(255,255,255,.05)'; C.rrect(c, x, y, w, h, 6); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.78)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x, y+h); c.lineTo(x, y+5); c.quadraticCurveTo(x, y, x+5, y);
      c.lineTo(x+w-5, y); c.quadraticCurveTo(x+w, y, x+w, y+5); c.lineTo(x+w, y+h); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.3)'; c.font = '12px "Lilita One", Nunito, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillText('BUS', cx, y + h - 6);
    }
    function paintStatic(c){
      var W = G.W, H = G.H;
      c.fillStyle = '#e7eef6'; c.fillRect(0, 0, W, H);
      drawStation(c);
      c.fillStyle = '#d4dce6'; c.fillRect(0, G.walkTop, W, G.walkH);
      c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1;
      for(var x = 0; x < W; x += 30) line(c, x+.5, G.walkTop, x+.5, G.walkBottom);
      line(c, 0, G.walkTop + G.walkH/2, W, G.walkTop + G.walkH/2);
      c.fillStyle = '#f2c94c'; c.fillRect(0, G.walkBottom - 3, W, 3);
      c.fillStyle = '#b3bfcc'; c.fillRect(0, G.walkBottom, W, 4);
      c.fillStyle = '#47505f'; c.fillRect(0, G.bayTop, W, G.bayDepth);
      c.fillStyle = '#3c4452';
      c.fillRect(0, G.lotY - G.roadW, W, G.roadW);
      c.fillRect(G.lotX - G.roadW, G.lotY, G.roadW, G.lotH + G.roadW);
      c.fillRect(G.lotX + G.lotW, G.lotY, G.roadW, G.lotH + G.roadW);
      c.fillRect(G.lotX - G.roadW, G.lotY + G.lotH, G.lotW + 2*G.roadW, G.roadW);
      for(var i = 0; i < 5; i++) drawSlot(c, i);
      c.save(); c.strokeStyle = 'rgba(245,200,70,.8)'; c.lineWidth = 2; c.setLineDash([10,9]);
      line(c, 0, G.topRoadY, W, G.topRoadY);
      line(c, G.leftRoadX, G.lotY+8, G.leftRoadX, G.bottomRoadY);
      line(c, G.rightRoadX, G.lotY+8, G.rightRoadX, G.bottomRoadY);
      line(c, G.leftRoadX, G.bottomRoadY, G.rightRoadX, G.bottomRoadY);
      c.restore();
      c.fillStyle = '#525b6b'; C.rrect(c, G.lotX, G.lotY, G.lotW, G.lotH, 6); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = 1;
      for(var ci = 1; ci < P.cols; ci++) line(c, G.lotX + ci*G.cell + .5, G.lotY+3, G.lotX + ci*G.cell + .5, G.lotY + G.lotH - 3);
      for(var cj = 1; cj < P.rows; cj++) line(c, G.lotX+3, G.lotY + cj*G.cell + .5, G.lotX + G.lotW - 3, G.lotY + cj*G.cell + .5);
      c.strokeStyle = '#cfd6df'; c.lineWidth = 2.5; C.rrect(c, G.lotX-1, G.lotY-1, G.lotW+2, G.lotH+2, 7); c.stroke();
      var side = G.lotX - G.roadW, mound = C.season().banks ? snowMound : bush;
      if(side > 8){
        for(var sy = G.lotY + 20; sy < H; sy += 46){
          mound(c, side/2 - 2, sy, Math.min(side*.7, 18));
          mound(c, W - side/2 + 2, sy + 20, Math.min(side*.7, 18));
        }
        if(side > 16){
          C.drawCone(c, side/2, G.lotY + G.lotH*.5, Math.min(side*1.2, 30), 0);
          C.drawCone(c, W - side/2, G.lotY + G.lotH*.3, Math.min(side*1.2, 30), 0);
        }
      }
      mound(c, 10, H+2, 26); mound(c, W-10, H+2, 30);
      if(window.Places) window.Places.shade(c, 0, G.stationH, W, H - G.stationH);
    }
    /* Outside winter the kerbs grow shrubs instead of snowbanks. */
    function bush(c, x, y, r){
      var sn = C.season(), leaf = sn.leaves || '#3f8f4a';
      c.fillStyle = 'rgba(15,22,34,.18)'; c.beginPath(); c.ellipse(x + 2, y + 2, r, r*0.5, 0, 0, Math.PI*2); c.fill();
      c.fillStyle = mix(leaf, '#1b2a1b', .25); c.beginPath(); c.arc(x, y - r*0.2, r*0.8, Math.PI, 0); c.fill();
      c.fillStyle = leaf; c.beginPath(); c.arc(x - r*0.15, y - r*0.32, r*0.6, 0, Math.PI*2); c.fill();
      if(sn.blossom){ c.fillStyle = sn.blossom; c.beginPath(); c.arc(x + r*0.2, y - r*0.5, r*0.16, 0, Math.PI*2); c.fill(); }
    }

    function introScale(v){
      if(v.delay == null) return 1;
      var u = (S.time - v.delay)/.34;
      if(u <= 0) return 0;
      if(u >= 1){ v.delay = null; return 1; }
      return C.easeOutBack(u);
    }
    function drawSeats(c, v, len, wd, s){
      var n = v.cap, per = Math.ceil(n/2), r = Math.min(wd*.17, 2.7/s);
      var span = Math.min(len - 22, (per-1)*r*2.7), step = per > 1 ? span/(per-1) : 0;
      for(var i = 0; i < n; i++){
        var row = i < per ? 0 : 1, j = row ? i - per : i;
        var x = -span/2 + j*step, y = (row ? 1 : -1)*wd*.21;
        c.beginPath(); c.arc(x, y, r, 0, Math.PI*2);
        c.fillStyle = i < v.loaded ? '#ffffff' : 'rgba(18,28,44,.32)'; c.fill();
      }
    }
    /* The livery. The game colour stays dominant, because matching it is the
       whole puzzle. The transit identity rides on top: a white destination
       band with a route number, a deep blue line down each side, dark glass
       at both ends, and our own cone badge. No real operator's mark is used. */
    function drawVehicle(c, v){
      var col = C.COLORS[v.color], cell = G.cell, len = v.L*cell - 6, wd = cell - 8;
      var s = v.scale*introScale(v);
      if(s <= .01) return;
      if(v.pop > 0) s *= 1 + .12*Math.sin(Math.PI*(1 - v.pop/.25));
      var ox = v.shake > 0 ? Math.sin(S.time*70)*2.4*(v.shake/.3) : 0;
      var lifted = v.state === 'lift', ly = lifted ? -9*s : 0;
      var x = v.x + ox, y = v.y, r = Math.min(8, wd*.3);
      var isBus = v.type === 'bus', isVan = v.type === 'van';

      // soft contact shadow on the ground
      c.save(); c.translate(x + 3*s, y + (lifted ? 20 : 11)*s); c.rotate(v.ang); c.scale(s,s);
      C.rrect(c, -len/2 + 2, -wd/2 + 2, len - 4, wd - 4, r);
      c.fillStyle = lifted ? 'rgba(15,22,34,.16)' : 'rgba(15,22,34,.26)'; c.fill();
      c.restore();
      // the body has real height: three stacked copies make the side wall,
      // darkest at the bottom, so the vehicle reads as a solid block
      var depth = Math.max(3.5, wd*0.26);
      for(var dz = 3; dz >= 1; dz--){
        c.save(); c.translate(x, y + ly + depth*(dz/3)*s); c.rotate(v.ang); c.scale(s,s);
        C.rrect(c, -len/2, -wd/2, len, wd, r);
        c.fillStyle = dz === 3 ? col.d : dz === 2 ? mix(col.d, col.c, .3) : mix(col.d, col.c, .6);
        c.fill(); c.restore();
      }
      c.save(); c.translate(x, y + ly); c.rotate(v.ang); c.scale(s,s);
      C.rrect(c, -len/2, -wd/2, len, wd, r); c.fillStyle = col.c; c.fill();
      c.save(); C.rrect(c, -len/2, -wd/2, len, wd, r); c.clip();

      // lighter roof panel, so the shape reads as a roof seen from above
      c.globalAlpha = .5; c.fillStyle = col.l;
      C.rrect(c, -len/2 + wd*.18, -wd/2 + 3.5, len - wd*.36, wd - 7, r*.6); c.fill();
      c.globalAlpha = 1;

      if(isBus){
        // deep blue line down each side
        c.fillStyle = '#1b4a96';
        c.fillRect(-len/2, -wd/2, len, Math.max(1.6, wd*.085));
        c.fillRect(-len/2, wd/2 - Math.max(1.6, wd*.085), len, Math.max(1.6, wd*.085));
        // white destination band behind the windshield
        var bandW = Math.max(5, wd*.3), bandX = len/2 - wd*.52 - bandW;
        c.fillStyle = '#f6f9fd'; c.fillRect(bandX, -wd/2 + 2, bandW, wd - 4);
        c.fillStyle = 'rgba(20,30,46,.9)';
        c.save(); c.translate(bandX + bandW/2, 0); c.rotate(Math.PI/2);
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = '700 ' + Math.max(4.5, wd*.33) + 'px Nunito, sans-serif';
        C.fitText(c, v.route, 0, 0, wd - 5);
        c.restore();
        // our own cone badge at the rear
        c.fillStyle = 'rgba(255,255,255,.92)';
        C.poly(c, [[-len/2 + wd*.52, -wd*.13], [-len/2 + wd*.52, wd*.13], [-len/2 + wd*.3, wd*.13]]);
        c.fill();
      }
      // dark glass at both ends
      c.fillStyle = 'rgba(26,38,56,.88)';
      if(isBus){
        C.rrect(c, len/2 - wd*.46, -wd/2 + 3, wd*.28, wd - 6, 3); c.fill();
        C.rrect(c, -len/2 + wd*.1, -wd/2 + 4, wd*.17, wd - 8, 3); c.fill();
      } else if(isVan){
        C.rrect(c, len/2 - wd*.44, -wd/2 + 3, wd*.26, wd - 6, 3); c.fill();
        C.rrect(c, -len/2 + wd*.14, -wd/2 + 4, wd*.18, wd - 8, 3); c.fill();
      } else {
        C.rrect(c, len/2 - wd*.56, -wd/2 + 4, wd*.32, wd - 8, 3); c.fill();
        C.rrect(c, -len/2 + wd*.18, -wd/2 + 5, wd*.24, wd - 10, 3); c.fill();
      }
      // gloss: a soft light band across the upper half of the roof
      var gl = c.createLinearGradient(0, -wd/2, 0, wd/2);
      gl.addColorStop(0, 'rgba(255,255,255,.34)');
      gl.addColorStop(.42, 'rgba(255,255,255,.08)');
      gl.addColorStop(.52, 'rgba(0,0,0,0)');
      gl.addColorStop(1, 'rgba(0,0,0,.16)');
      c.fillStyle = gl; c.fillRect(-len/2, -wd/2, len, wd);
      c.restore();                                  // end clip
      // crisp top edge, which is what sells the height
      c.lineWidth = 1.1; c.strokeStyle = 'rgba(255,255,255,.5)';
      c.beginPath(); c.moveTo(-len/2 + r, -wd/2 + .6); c.lineTo(len/2 - r, -wd/2 + .6); c.stroke();

      c.fillStyle = 'rgba(255,236,170,.95)';        // headlights
      c.beginPath(); c.arc(len/2 - 2.5, -wd/2 + 3.2, 1.5, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(len/2 - 2.5, wd/2 - 3.2, 1.5, 0, Math.PI*2); c.fill();

      var showArrow = v.state === 'lot' || v.state === 'bump';
      var rx0 = -len/2 + wd*(isBus ? .66 : .42), rx1 = len/2 - wd*(isBus ? .88 : .62);
      if(showArrow){
        var shift = C.save.symbols ? 5 : 0;
        drawArrowFor(c, col, (rx0 + rx1)/2 + shift, 0, Math.min(rx1 - rx0 - 4 - shift, 30), wd - 13);
      } else {
        drawSeats(c, v, len, wd, s);
      }
      c.restore();
      if(C.save.symbols && showArrow){
        var lx = rx0 + 4, sx = x + Math.cos(v.ang)*lx*s, sy = y + ly + Math.sin(v.ang)*lx*s;
        C.symbolMark(c, col.shape, sx, sy, Math.max(3.5, wd*.13));
      }
    }
    function drawArrowFor(c, col, cx, cy, L, h){
      // pale vehicles carry a dark arrow, so it never disappears into the body
      C.drawArrow(c, cx, cy, L, h, col.arrow, col.arrowEdge);
    }

    function drawSignPost(c){
      var x = G.signX, y = G.walkTop + 6, w = G.signW, h = G.walkH - 14;
      c.fillStyle = 'rgba(15,22,34,.25)'; C.rrect(c, x+2, y+3, w, h, 10); c.fill();
      c.fillStyle = '#1d4fa6'; C.rrect(c, x, y, w, h, 10); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 2; C.rrect(c, x+3, y+3, w-6, h-6, 7); c.stroke();
      c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '23px "Lilita One", Nunito, sans-serif';
      C.fitText(c, String(S.queue.length), x + w/2, y + h*.42, w - 12);
      c.font = '800 11px Nunito, sans-serif';
      C.fitText(c, C.t('left'), x + w/2, y + h*.78, w - 12);
    }
    function drawQueue(c){
      var vis = G.qPerRow*G.qRows, n = Math.min(S.queue.length, vis + 1), i;
      for(i = n - 1; i >= 0; i--){
        var q = S.queue[i];
        if(i === 0) C.drawCommuter(c, q.x, q.y + Math.sin(S.time*9)*1.2, q.c, q.skin, 1.18);
        else C.drawCommuter(c, q.x, q.y + Math.sin(S.time*3 + q.ph)*.5, q.c, q.skin, 1);
      }
    }
    function drawLockedSlot(c){
      var cx = G.bayX[4], w = G.slotW - 8, x = cx - w/2, y = G.bayTop + 8, h = G.bayDepth - 10;
      c.fillStyle = 'rgba(16,22,32,.45)'; C.rrect(c, x, y, w, h, 6); c.fill();
      C.drawCone(c, cx, G.bayY + 10, Math.min(w*.8, 34), 0);
      var ly = G.bayY - h*.22;
      c.strokeStyle = '#f3c64a'; c.lineWidth = 2.6;
      c.beginPath(); c.arc(cx, ly-3, 5, Math.PI, 0); c.stroke();
      c.fillStyle = '#f3c64a'; C.rrect(c, cx-7.5, ly-3, 15, 11, 2.5); c.fill();
      c.fillStyle = '#6b4c08'; c.fillRect(cx-1, ly+1, 2, 4);
    }
    function tutTarget(){
      for(var i = 0; i < S.gen.order.length; i++){
        var v = S.vehicles[S.gen.order[i]];
        if(v && v.state === 'lot' && !blockerOf(v)) return v;
      }
      return null;
    }
    function drawTutorial(c){
      if(S.tut !== 1 || S.time < .9) return;
      var v = tutTarget(); if(!v) return;
      var cs = LG.cellsOf(v), mx = 99, my = 99, Mx = -1, My = -1;
      cs.forEach(function(cell){
        mx = Math.min(mx, cell[0]); my = Math.min(my, cell[1]);
        Mx = Math.max(Mx, cell[0]); My = Math.max(My, cell[1]);
      });
      var p = (Math.sin(S.time*5) + 1)/2, pad = 3 + p*4;
      c.save(); c.strokeStyle = 'rgba(255,255,255,' + (.55 + .4*p) + ')'; c.lineWidth = 4;
      c.setLineDash([9,7]); c.lineDashOffset = -S.time*30;
      C.rrect(c, G.lotX + mx*G.cell - pad, G.lotY + my*G.cell - pad,
              (Mx-mx+1)*G.cell + pad*2, (My-my+1)*G.cell + pad*2, 12);
      c.stroke(); c.restore();
    }

    function draw(c){
      if(use3d()){ draw3d(c); return; }
      if(S.bayCount < 5) drawLockedSlot(c);
      S.cones.forEach(function(cn){
        C.drawCone(c, G.lotX + (cn.x + .5)*G.cell, G.lotY + (cn.y + .56)*G.cell, G.cell*.95,
                   S.coneShake[cn.y*P.cols + cn.x] || 0);
      });
      drawZones(c, true);
      var lot = [], bump = [], park = [], move = [];
      S.vehicles.forEach(function(v){
        if(v.state === 'gone') return;
        if(v.state === 'lot') lot.push(v);
        else if(v.state === 'bump') bump.push(v);
        else if(v.state === 'parked') park.push(v);
        else move.push(v);
      });
      lot.forEach(function(v){ drawVehicle(c, v); });
      bump.forEach(function(v){ drawVehicle(c, v); });
      drawZoneSigns(c);
      if(S.towMode){
        var p = (Math.sin(S.time*6) + 1)/2;
        c.save(); c.strokeStyle = 'rgba(255,207,64,' + (.5 + .5*p) + ')'; c.lineWidth = 4;
        c.setLineDash([12,8]); c.lineDashOffset = -S.time*40;
        C.rrect(c, G.lotX-6, G.lotY-6, G.lotW+12, G.lotH+12, 10); c.stroke(); c.restore();
      }
      park.forEach(function(v){ drawVehicle(c, v); });
      drawQueue(c); drawSignPost(c);
      move.forEach(function(v){ drawVehicle(c, v); });
      S.flyers.forEach(function(f){
        var u = f.t/f.T;
        C.drawCommuter(c, f.x0 + (f.v.x - f.x0)*u, f.y0 + (f.v.y - f.y0)*u - 44*Math.sin(Math.PI*u),
                       f.c, f.skin, 1.15 - .5*u);
      });
      S.parts.forEach(function(p){
        c.save(); c.globalAlpha = C.clamp(1 - p.life/p.T, 0, 1);
        c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.c; c.fillRect(-3,-2,6,4); c.restore();
      });
      S.floats.forEach(function(f){
        c.save(); c.globalAlpha = C.clamp(1 - f.t/f.T, 0, 1);
        c.font = f.size + 'px "Lilita One", Nunito, sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.lineWidth = 4; c.strokeStyle = 'rgba(17,24,36,.75)'; c.strokeText(f.text, f.x, f.y);
        c.fillStyle = f.color; c.fillText(f.text, f.x, f.y); c.restore();
      });
      drawTutorial(c);
      C.drawSnow(c, flakes);
    }

    /* Road work: striped barrier tape round the closed squares (and, without
       3D, the cones themselves), then a round sign counting down the
       vehicles still to leave. */
    function drawZones(c, flat){
      S.zones.forEach(function(z){
        if(z.open && z.openT > 0.4) return;
        var a = z.open ? Math.max(0, 1 - z.openT/0.4) : 1;
        c.save(); c.globalAlpha = a;
        z.cells.forEach(function(cn){
          var x = G.lotX + cn.x*G.cell + 2, y = G.lotY + cn.y*G.cell + 2, w = G.cell - 4;
          c.fillStyle = 'rgba(255,138,31,.18)'; C.rrect(c, x, y, w, w, 5); c.fill();
          c.lineWidth = 3; c.setLineDash([6, 5]);
          c.strokeStyle = '#ff8a1f'; C.rrect(c, x, y, w, w, 5); c.stroke();
          c.lineDashOffset = 5.5; c.strokeStyle = '#ffffff'; C.rrect(c, x, y, w, w, 5); c.stroke();
          c.setLineDash([]);
          if(flat) C.drawCone(c, x + w/2, y + w*0.58, G.cell*.8, S.coneShake[cn.y*P.cols + cn.x] || 0);
        });
        c.restore();
      });
    }
    function drawZoneSigns(c){
      S.zones.forEach(function(z){
        if(z.open) return;
        var c0 = z.cells[0], x = G.lotX + (c0.x + 1)*G.cell - 4, y = G.lotY + c0.y*G.cell + 4;
        var left = Math.max(0, z.after - S.out), r = Math.max(9, G.cell*0.24), pul = 1 + Math.sin(S.time*4)*0.05;
        c.fillStyle = 'rgba(20,28,40,.3)'; c.beginPath(); c.arc(x + 1, y + 2, r*pul, 0, Math.PI*2); c.fill();
        c.fillStyle = '#ff8a1f'; c.beginPath(); c.arc(x, y, r*pul, 0, Math.PI*2); c.fill();
        c.strokeStyle = '#ffffff'; c.lineWidth = 2; c.stroke();
        c.fillStyle = '#ffffff'; c.font = '400 ' + Math.round(r*1.2) + 'px "Lilita One", Nunito, sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(left), x, y + 1);
      });
    }
    function draw3d(c){
      if(S.bayCount < 5) drawLockedSlot(c);
      drawZones(c, false);
      sync3d();
      lot3d.drawTo(c);
      drawZoneSigns(c);
      var order = S.vehicles.filter(function(v){ return v.state !== 'gone'; });
      order.sort(function(a, b){ return a.y - b.y; });
      order.forEach(function(v){ if(v.state !== 'toBay' && v.state !== 'leaving' && v.state !== 'lift') drawRoof(c, v); });
      if(S.towMode){
        var p = (Math.sin(S.time*6) + 1)/2;
        c.save(); c.strokeStyle = 'rgba(255,207,64,' + (.5 + .5*p) + ')'; c.lineWidth = 4;
        c.setLineDash([12,8]); c.lineDashOffset = -S.time*40;
        C.rrect(c, G.lotX-6, G.lotY-6, G.lotW+12, G.lotH+12, 10); c.stroke(); c.restore();
      }
      drawQueue(c); drawSignPost(c);
      order.forEach(function(v){ if(v.state === 'toBay' || v.state === 'leaving' || v.state === 'lift') drawRoof(c, v); });
      S.flyers.forEach(function(f){
        var u = f.t/f.T, r = roofOf(f.v);
        C.drawCommuter(c, f.x0 + (r.x - f.x0)*u, f.y0 + (r.y - f.y0)*u - 44*Math.sin(Math.PI*u),
                       f.c, f.skin, 1.15 - .5*u);
      });
      S.parts.forEach(function(p2){
        c.save(); c.globalAlpha = C.clamp(1 - p2.life/p2.T, 0, 1);
        c.translate(p2.x, p2.y); c.rotate(p2.rot); c.fillStyle = p2.c; c.fillRect(-3,-2,6,4); c.restore();
      });
      S.floats.forEach(function(f){
        c.save(); c.globalAlpha = C.clamp(1 - f.t/f.T, 0, 1);
        c.font = f.size + 'px "Lilita One", Nunito, sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.lineWidth = 4; c.strokeStyle = 'rgba(17,24,36,.75)'; c.strokeText(f.text, f.x, f.y);
        c.fillStyle = f.color; c.fillText(f.text, f.x, f.y); c.restore();
      });
      drawTutorial(c);
      C.drawSnow(c, flakes);
    }

    /* ---------- update ---------- */
    function starsFor(){
      if(S.extraUsed) return 1;
      if(S.bumps <= 2) return 3;
      if(S.bumps <= 7) return 2;
      return 1;
    }
    function checkEnd(dt){
      if(!S.queue.length){
        if(!S.flyers.length && S.vehicles.every(function(v){ return v.state === 'gone' || v.state === 'leaving'; })){
          S.over = true; S.winT = 0; S.towMode = false; api.tip(null); api.refresh();
        }
        return;
      }
      if(S.flyers.length || S.boardTimer > 0 ||
         S.vehicles.some(function(v){ return v.state === 'toBay' || v.state === 'bump' || v.state === 'lift'; })){
        S.stuckT = 0; return;
      }
      var col = S.queue[0].c, occ = 0, match = false, i;
      for(i = 0; i < S.bayCount; i++){
        var v = S.bays[i];
        if(v){ occ++; if(v.color === col && v.reserved < v.cap) match = true; }
      }
      if(occ === S.bayCount && !match){
        S.stuckT += dt;
        if(S.stuckT > .5){
          S.over = true; S.stuckT = 0; S.towMode = false; api.tip(null);
          inst.status = 'lost';
          inst.lose = {title:C.t('stuck'), sub:C.t('stuckSub'), extraStop:!S.extraUsed};
          api.refresh();
        }
      } else S.stuckT = 0;
    }
    function update(dt){
      C.stepSnow(flakes, dt, G.W, G.H);
      S.time += dt;
      S.vehicles.forEach(function(v){
        if(v.state === 'gone') return;
        if(v.path) stepMove(v, dt);
        if(v.state === 'bump') stepBump(v, dt);
        if(v.shake > 0) v.shake = Math.max(0, v.shake - dt);
        if(v.pop > 0) v.pop = Math.max(0, v.pop - dt);
      });
      for(var key in S.coneShake){ S.coneShake[key] -= dt; if(S.coneShake[key] <= 0) delete S.coneShake[key]; }
      S.zones.forEach(function(z){ if(z.open) z.openT += dt; });
      for(var i = S.flyers.length - 1; i >= 0; i--){
        var f = S.flyers[i]; f.t += dt;
        if(f.t >= f.T){ S.flyers.splice(i,1); land(f); }
      }
      var a = 1 - Math.exp(-dt*14);
      for(var q = 0; q < S.queue.length; q++){
        var it = S.queue[q], p = slotPos(q);
        it.x += (p.x - it.x)*a; it.y += (p.y - it.y)*a;
      }
      if(!S.over) updateBoarding(dt);
      for(var pi = S.parts.length - 1; pi >= 0; pi--){
        var pt = S.parts[pi]; pt.life += dt;
        if(pt.life > pt.T){ S.parts.splice(pi,1); continue; }
        pt.vy += 600*dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.rot += pt.vr*dt;
      }
      for(var fi = S.floats.length - 1; fi >= 0; fi--){
        var fl = S.floats[fi]; fl.t += dt; fl.y -= 34*dt;
        if(fl.t > fl.T) S.floats.splice(fi,1);
      }
      if(S.tut === 2){ S.tutT += dt; if(S.tutT > 4.5){ S.tut = 0; api.tip(null); } }
      if(!S.over) checkEnd(dt);
      if(S.winT >= 0){
        S.winT += dt;
        if(S.winT > .8){
          S.winT = -1; inst.status = 'won';
          inst.result = {stars:starsFor(), coins:S.coinsEarned};
          api.refresh();
        }
      }
    }

    /* ---------- input ---------- */
    /* In 3D a vehicle's roof sits a little above the cells it fills, so a tap
       is tested against the whole solid shape, and the front-most one wins. */
    function pick3d(px, py){
      var K = window.Kit3D, hMax = 1.3*G.cell, best = null, bestY = -1e9, k;
      for(k = 0; k <= 10; k++){
        var t = hMax*k/10, gx = px - K.KX*t, gy = py + K.KY*t;
        var cx = Math.floor((gx - G.lotX)/G.cell), cy = Math.floor((gy - G.lotY)/G.cell);
        if(cx < 0 || cy < 0 || cx >= P.cols || cy >= P.rows) continue;
        var o = S.occ[cy*P.cols + cx], top, y;
        if(o >= 0){
          var v = S.vehicles[o];
          top = roofTop(v); y = lotCenter(v).y;
        } else if(o === -2 || o === -3){ top = G.cell; y = G.lotY + (cy + .5)*G.cell; }
        else continue;
        if(t > top + 2) continue;
        if(y > bestY){ bestY = y; best = {o:o, cx:cx, cy:cy}; }
      }
      return best;
    }
    function down(px, py){
      if(S.over) return;
      var cx, cy, o;
      if(use3d()){
        var hit = pick3d(px, py);
        if(!hit) return;
        cx = hit.cx; cy = hit.cy; o = hit.o;
      } else {
        cx = Math.floor((px - G.lotX)/G.cell); cy = Math.floor((py - G.lotY)/G.cell);
        if(cx < 0 || cy < 0 || cx >= P.cols || cy >= P.rows) return;
        o = S.occ[cy*P.cols + cx];
      }
      if(o === -2){ S.coneShake[cy*P.cols + cx] = .3; C.sfx.bump(); return; }
      if(o === -3){
        S.coneShake[cy*P.cols + cx] = .3; C.sfx.bump();
        var zz = S.zones.filter(function(z){ return !z.open && z.cells.some(function(q){ return q.x === cx && q.y === cy; }); })[0];
        if(zz) api.toast(C.t('workLeft').replace('{n}', Math.max(0, zz.after - S.out)));
        return;
      }
      if(o < 0) return;
      var v = S.vehicles[o];
      if(!v || v.state !== 'lot') return;
      if(S.towMode){ towVehicle(v); return; }
      var blk = blockerOf(v);
      if(blk){ startBump(v, blk); return; }
      var b = firstFreeBay();
      if(b < 0){ v.shake = .3; C.sfx.bump(); C.haptic(20); api.toast(C.t('full')); return; }
      launch(v, b);
    }
    function openExtraStop(){
      S.bayCount = 5; S.extraUsed = true; S.stuckT = 0; S.over = false;
      inst.status = 'play'; inst.lose = null;
      burst(G.bayX[4], G.bayY, 5, 22);
      api.toast(C.t('stopOpened')); C.sfx.coin(); C.haptic(20); api.refresh();
    }
    function booster(id){
      if(S.over) return false;
      if(id === 'stop'){
        if(S.extraUsed) return false;
        if(!api.spend(C.COST.stop)) return false;
        openExtraStop(); return true;
      }
      if(id === 'tow'){
        if(S.towMode){ S.towMode = false; api.tip(null); api.refresh(); return true; }
        if(C.save.coins < C.COST.tow){ api.toast(C.t('notEnough')); return false; }
        S.towMode = true; api.tip(C.t('towHint')); api.refresh(); return true;
      }
      return false;
    }
    function boosterState(id){
      if(id === 'stop') return {disabled:S.extraUsed || S.over, on:false, cost:C.COST.stop};
      if(id === 'tow') return {disabled:S.over, on:!!S.towMode, cost:C.COST.tow};
      return {disabled:true, on:false, cost:0};
    }
    function hud(){ return {main:String(S.queue.length), sub:C.t('left')}; }

    inst.tapSlop = 70;                                // pushing a vehicle with a swipe works like a tap
    inst.layout = layout; inst.paintStatic = paintStatic; inst.update = update; inst.draw = draw;
    inst.down = down; inst.booster = booster; inst.boosterState = boosterState; inst.hud = hud;
    inst.continueAfterLoss = openExtraStop;
    inst.dispose = function(){ if(lot3d){ lot3d.dispose(); lot3d = null; } };
    inst.__is3d = function(){ return !!use3d(); };
    inst.__roof = function(v){ return use3d() ? roofOf(v) : {x:v.x, y:v.y}; };
    inst.state = S;

    /* The coach: a vehicle that can leave right now. */
    inst.coachNow = function(){ return S.tut === 1 && S.time > 0.9 && !S.over; };
    inst.coachMove = function(){
      if(S.over || S.towMode) return null;
      var v = tutTarget();
      if(!v || firstFreeBay() < 0) return null;
      var p = lotCenter(v), x = p.x, y = p.y;
      if(use3d()){ var h = roofTop(v)*0.5; x += window.Kit3D.KX*h; y -= window.Kit3D.KY*h; }
      return {kind:'tap', x:x, y:y, r:G.cell*0.7, text:C.t(S.tut === 1 ? 'coBus' : 'coBusIdle')};
    };
    if(api.firstTime){ S.tut = 1; S.tutT = 0; }
    return inst;
  }

  window.Games = window.Games || {};
  window.Games.bus = {
    id:'bus', titleKey:'gameBus', boosters:['stop','tow'],
    generate:function(n){ return LG.generate(n); },
    create:create
  };
})();
</script>
<script>
/* Panneaux Stack: sort Montréal's famously stacked parking signs.
   Lift the top sign off a pole, drop it on a matching sign or an empty pole.
   A pole holding a full set of one sign is finished. */
(function(){
  'use strict';
  var C = window.Core, SL = window.SignLogic;

  function create(level, n, api){
    var P = level.P, cap = level.cap;
    var S = {
      poles: SL.clone(level.poles),
      frozen: {},          // "pole:index" -> taps still needed
      held: null,          // {type, from}
      drag: null,          // a sign carried under the finger: {x, y, on}
      anim: null,          // flying sign
      moves: 0, history: [],
      time: 0, over: false, winT: -1,
      shake: {}, done: {}, hintMove: null, hintT: 0, bounce: {}, popT: {},
      parts: [], floats: [], cap: cap
    };
    level.frozen.forEach(function(id){ S.frozen[id] = 2; });
    S.hidden = {};
    (level.hidden || []).forEach(function(id){ S.hidden[id] = 1; });

    var G = null, flakes = C.makeSnow(30);
    var inst = {
      status:'play', result:null, lose:null, tip:null,
      boosters:['undo','hint'], subtitle:null, showHud:true,
      twist:(level.hidden || []).length ? 'mystery' : null
    };

    /* ---------- rules ---------- */
    function canDrop(i, type){
      var p = S.poles[i];
      if(p.length >= cap) return false;
      return !p.length || p[p.length-1] === type;
    }
    function isDone(i){
      var p = S.poles[i];
      if(p.length !== cap) return false;
      for(var j = 1; j < p.length; j++) if(p[j] !== p[0]) return false;
      return true;
    }
    function frozenAt(i){
      var p = S.poles[i];
      if(!p.length) return 0;
      return S.frozen[i + ':' + (p.length-1)] || 0;
    }
    function anyMove(){
      if(S.held) {
        for(var j = 0; j < S.poles.length; j++) if(j !== S.held.from && canDrop(j, S.held.type)) return true;
        return true;        // can always put it back
      }
      return SL.legalMoves(S.poles, {cap:cap}).length > 0;
    }

    /* ---------- geometry ---------- */
    function layout(g){
      G = g;
      var W = G.W, H = G.H, nP = S.poles.length;
      G.top = Math.min(96, H*0.14);
      G.bottomPad = 48;                      // leave room for the road strip at the foot
      G.rows = nP <= 5 ? 1 : 2;
      G.perRow = Math.ceil(nP/G.rows);
      var usableH = H - G.top - G.bottomPad;
      G.rowH = usableH/G.rows;
      G.colW = (W - 16)/G.perRow;
      G.slot = Math.min(G.colW - 8, (G.rowH - 40)/cap);          // how big each sign is
      G.pitch = Math.min(G.slot*1.42, (G.rowH - 46)/cap);        // how far apart they sit
      G.signW = G.slot*0.96;
      G.poleH = G.pitch*cap;
      G.pos = [];
      for(var i = 0; i < nP; i++){
        var row = Math.floor(i/G.perRow), col = i % G.perRow;
        var inRow = Math.min(G.perRow, nP - row*G.perRow);
        var rowW = inRow*G.colW, x0 = (W - rowW)/2;
        var cx = x0 + col*G.colW + G.colW/2;
        // centre each row's poles in its band, so tall and short levels both sit well
        var baseY = G.top + row*G.rowH + G.rowH/2 + G.poleH/2;
        G.pos.push({x:cx, y:baseY});
      }
    }
    function slotXY(i, idx){
      var p = G.pos[i];
      return {x:p.x, y:p.y - G.pitch*0.5 - idx*G.pitch};
    }
    function liftXY(i){
      var p = G.pos[i];
      return {x:p.x, y:p.y - G.poleH - G.slot*0.55};
    }
    function poleAt(px, py){
      for(var i = 0; i < G.pos.length; i++){
        var p = G.pos[i];
        var x0 = p.x - G.colW/2, x1 = p.x + G.colW/2;
        var y1 = p.y + 16, y0 = p.y - G.poleH - G.slot*0.95;
        if(px >= x0 && px <= x1 && py >= y0 && py <= y1) return i;
      }
      return -1;
    }

    function poleNear(px, py){                  // where a dragged sign lands: generous, the nearest pole within reach
      var best = -1, bd = 1e9;
      for(var i = 0; i < G.pos.length; i++){
        var p = G.pos[i], top = p.y - G.poleH - G.slot*1.6, bot = p.y + 30;
        var dx = Math.abs(px - p.x), dy = py < top ? top - py : py > bot ? py - bot : 0;
        if(dx > G.colW*0.75 || dy > G.slot*1.2) continue;
        var d = dx + dy*1.5;
        if(d < bd){ bd = d; best = i; }
      }
      return best;
    }
    /* ---------- actions ---------- */
    function lift(i){
      var p = S.poles[i];
      if(!p.length) return;
      if(isDone(i)){ S.shake[i] = .25; C.sfx.bumpTone(); return; }   // a finished pole stays put
      var key = i + ':' + (p.length-1);
      if(S.frozen[key]){
        S.frozen[key]--;
        S.shake[i] = .3; C.sfx.bumpTone(); C.haptic(18);
        if(S.frozen[key] <= 0){ delete S.frozen[key]; burst(slotXY(i, p.length-1), '#cfe6f7', 10); }
        else api.toast(C.t('frozen'));
        return;
      }
      S.held = {type:p[p.length-1], from:i, t:0};
      p.pop();
      C.sfx.liftTone(); C.haptic(6);
      S.hintMove = null;
    }
    function drop(i, at){
      var h = S.held;
      if(i === h.from){
        if(at){ goHome(at); return; }
        S.poles[i].push(h.type); S.held = null; C.sfx.dropTone();
        return;
      }
      if(!canDrop(i, h.type)){
        S.shake[i] = .3; C.sfx.bumpTone(); C.haptic(20);
        if(at) goHome(at);                       // a dragged sign that cannot go there flies back where it came from
        return;
      }
      var from = at || liftXY(h.from), to = slotXY(i, S.poles[i].length);
      S.anim = {type:h.type, x:from.x, y:from.y, x0:from.x, y0:from.y, x1:to.x, y1:to.y, t:0, T:.22, to:i};
      S.history.push({from:h.from, to:i, type:h.type});
      S.held = null; S.moves++; S.tut = 0;
