      api.refresh();
    }
    function evaluate(){
      var r = ML.check(level, S.paths);
      if(r.won && !S.over){
        S.over = true; S.winT = 0;
        return;
      }
      if(r.connected === K && !S.over){
        if(r.covered < N){
          // which line borders the most empty squares: that one can wind through them
          var score = {}, bestC = -1;
          for(var q = 0; q < N; q++){
            if(ownerOf(q) >= 0) continue;
            var qx = q % W, qy = (q - qx)/W;
            [qx ? q - 1 : -1, qx < W - 1 ? q + 1 : -1, qy ? q - W : -1, qy < W - 1 ? q + W : -1].forEach(function(nb){
              if(nb < 0) return; var o = ownerOf(nb); if(o >= 0) score[o] = (score[o] || 0) + 1;
            });
          }
          for(var cc in score) if(bestC < 0 || score[cc] > score[bestC]) bestC = +cc;
          S.emptyPulse = 2.6; S.nudge = bestC;
          api.toast(bestC >= 0 ? C.t('metroFillLine').replace('{n}', COLS[bestC].num) : C.t('metroFill'));
        }
        else if(!r.served){ S.stopPulse = 2.2; if(S.nag++ < 2) api.toast(C.t('metroStops')); }
      }
    }

    /* ---------- effects ---------- */
    function burst(x, y, col, n){
      for(var i = 0; i < n; i++){
        var a = Math.random()*Math.PI*2, sp = 60 + Math.random()*120;
        S.parts.push({x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60, life:0, T:.6 + Math.random()*.3,
                      c:Math.random() < .35 ? '#ffffff' : col});
      }
    }

    /* ---------- painting ---------- */
    /* Every station has its own tiles, the way every real Montréal station
       has its own colours and art. */
    var TILES = ['#173764', '#1f4a3c', '#4a2f24', '#33285a', '#4a2430', '#1f4650', '#3a3f4c', '#5a3a1f'];
    function paintStatic(c){
      var PL = window.Places, place = PL.current(), ti = place ? PL.list.indexOf(place) % TILES.length : 0;
      var g = c.createLinearGradient(0, 0, 0, G.H);
      g.addColorStop(0, TILES[ti]); g.addColorStop(1, PL.mix(TILES[ti], '#050a16', .45));
      c.fillStyle = g; c.fillRect(0, 0, G.W, G.H);
      // tile wall, like a station platform
      c.strokeStyle = 'rgba(255,255,255,.04)'; c.lineWidth = 1;
      for(var y = 0; y < G.H; y += 22){ c.beginPath(); c.moveTo(0, y); c.lineTo(G.W, y); c.stroke(); }
      // the map card
      c.save();
      c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = 18; c.shadowOffsetY = 6;
      c.fillStyle = '#fbfaf5'; C.rrect(c, G.bx - 10, G.by - 10, G.bw + 20, G.bw + 20, 16); c.fill();
      c.restore();
      C.clayShade(c, G.bx - 10, G.by - 10, G.bw + 20, G.bw + 20, .45);            // a slab of pale clay
      // the grid, as faint dots where streets meet
      c.fillStyle = 'rgba(40,60,90,.16)';
      for(var i = 0; i <= W; i++) for(var j = 0; j <= W; j++){
        c.beginPath(); c.arc(G.bx + i*G.cell, G.by + j*G.cell, 1.6, 0, Math.PI*2); c.fill();
      }
      // a sliver of river along the bottom edge of the card, for the island feel
      c.fillStyle = 'rgba(80,150,210,.18)';
      C.rrect(c, G.bx - 10, G.by + G.bw + 4, G.bw + 20, 6, 3); c.fill();
      // up the stairs: the street above this station, and its name
      if(G.band && place){
        var wx = 14, wy = G.top - 4, ww = G.W - 28, wh = G.band;
        c.save(); C.rrect(c, wx, wy, ww, wh, 14); c.clip();
        PL.drawBand(c, wx, wy, ww, wh, {});
        c.restore();
        c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; C.rrect(c, wx, wy, ww, wh, 14); c.stroke();
        PL.drawPlaque(c, G.W/2, wy + wh, Math.min(ww - 30, 270), 40, place.station || place.name, 'Métro');
      }
    }
    function strokePath(c, cells, col, w){
      if(cells.length < 2) return;
      c.beginPath();
      cells.forEach(function(cell, i){ var p = cxy(cell); i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y); });
      c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke();
    }
    function draw(c){
      var cs = G.cell, i;
      // squares a line covers get a soft tint of its colour
      level.lines.forEach(function(L){
        var p = S.paths[L.c], col = COLS[L.c];
        c.fillStyle = col.c; c.globalAlpha = S.done[L.c] ? 0.2 : 0.12;
        p.forEach(function(cell){ var q = cxy(cell); C.rrect(c, q.x - cs/2 + 2, q.y - cs/2 + 2, cs - 4, cs - 4, 6); c.fill(); });
      });
      c.globalAlpha = 1;
      // empty squares pulse when everything is connected but the map is not full
      if(S.emptyPulse > 0){
        var pul = (Math.sin(S.time*9) + 1)/2*Math.min(1, S.emptyPulse);
        for(i = 0; i < N; i++){
          if(ownerOf(i) >= 0) continue;
          var e = cxy(i);
          c.strokeStyle = 'rgba(224,59,48,' + (0.35 + 0.5*pul) + ')'; c.lineWidth = 3;
          C.rrect(c, e.x - cs/2 + 4, e.y - cs/2 + 4, cs - 8, cs - 8, 6); c.stroke();
        }
      }
      // squares a hint took from your lines, fading out where they were
      S.ghosts.forEach(function(g){
        var q = cxy(g.cell), a = 1 - g.t/1.3;
        c.strokeStyle = COLS[g.c].c; c.globalAlpha = 0.85*a; c.lineWidth = 3; c.setLineDash([5, 4]);
        C.rrect(c, q.x - cs/2 + 5, q.y - cs/2 + 5, cs - 10, cs - 10, 7); c.stroke(); c.setLineDash([]);
      });
      c.globalAlpha = 1;
      // the line that could wind through the empty squares glows
      if(S.emptyPulse > 0 && S.nudge >= 0){
        var gl = (Math.sin(S.time*9) + 1)/2*Math.min(1, S.emptyPulse);
        strokePath(c, S.paths[S.nudge], 'rgba(255,214,80,' + (0.35 + 0.45*gl) + ')', cs*0.62);
      }
      // the lines: rolls of coloured clay pressed onto the map, with a pale rim
      level.lines.forEach(function(L){
        var p = S.paths[L.c], col = COLS[L.c];
        strokePath(c, p, 'rgba(255,255,255,.95)', cs*0.42);
        if(p.length < 2) return;
        c.beginPath();
        p.forEach(function(cell, i){ var q = cxy(cell); i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y); });
        C.claySnake(c, col.c, cs*0.3);
      });
      // stations on the way
      level.lines.forEach(function(L){
        L.stops.forEach(function(s){
          var q = cxy(s), served = S.paths[L.c].indexOf(s) >= 0, col = COLS[L.c];
          var warn = S.stopPulse > 0 && !served ? (Math.sin(S.time*9) + 1)/2 : 0;
          // a station: white with a ring of its line's colour; a waiting one also
          // shows a dot of the colour and a slow pulse, so it is easy to spot
          var rr = cs*0.21 + warn*3 + (served ? 0 : Math.sin(S.time*3)*1.2);
          C.clayBall(c, q.x, q.y, rr, '#ffffff');
          c.beginPath(); c.arc(q.x, q.y, rr, 0, Math.PI*2);
          c.strokeStyle = served ? col.d : col.c; c.lineWidth = cs*0.08; c.stroke();
          if(!served){ c.fillStyle = col.c; c.beginPath(); c.arc(q.x, q.y, cs*0.07, 0, Math.PI*2); c.fill(); }
        });
      });
      // trains on finished lines, shuttling end to end
      level.lines.forEach(function(L){
        var tr = S.trains[L.c], p = S.paths[L.c];
        if(!tr || !S.done[L.c] || p.length < 2) return;
        var fi2 = Math.max(0, Math.min(p.length - 1.001, tr.s)), k0 = Math.floor(fi2), fr2 = fi2 - k0;
        var b0 = cxy(p[k0]), b1 = cxy(p[k0 + 1]);
        var tx = b0.x + (b1.x - b0.x)*fr2, ty = b0.y + (b1.y - b0.y)*fr2, ang = Math.atan2(b1.y - b0.y, b1.x - b0.x);
        c.save(); c.translate(tx, ty); c.rotate(ang);
        c.fillStyle = 'rgba(0,0,0,.25)'; C.rrect(c, -cs*0.3, -cs*0.12 + 2, cs*0.6, cs*0.24, cs*0.1); c.fill();
        c.fillStyle = '#ffffff'; C.rrect(c, -cs*0.3, -cs*0.12, cs*0.6, cs*0.24, cs*0.1); c.fill();
        c.fillStyle = COLS[L.c].d; c.fillRect(-cs*0.22, -cs*0.035, cs*0.44, cs*0.07);
        C.rrect(c, -cs*0.3, -cs*0.12, cs*0.6, cs*0.24, cs*0.1); C.clayShade(c, -cs*0.3, -cs*0.12, cs*0.6, cs*0.24, .8);
        c.restore();
      });
      // termini
      level.lines.forEach(function(L){
        [L.a, L.b].forEach(function(cell){
          var q = cxy(cell), col = COLS[L.c], r = cs*0.36, pop = 0;
          S.pops.forEach(function(pp){ if(pp.cell === cell) pop = Math.max(pop, Math.sin(Math.PI*Math.min(1, pp.t/0.4))); });
          r *= 1 + pop*0.25;
          if(S.done[L.c]){ c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(q.x, q.y, r + 5, 0, Math.PI*2); c.fill(); }
          C.clayBall(c, q.x, q.y, r, col.c, col.d);
          c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(2, cs*0.06);
          c.beginPath(); c.arc(q.x, q.y, r*0.78, 0, Math.PI*2); c.stroke();
          c.fillStyle = col.num === 4 ? '#5a4500' : '#ffffff';
          c.font = '400 ' + Math.round(r*1.05) + 'px "Lilita One", Nunito, sans-serif';
          c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText(String(col.num), q.x, q.y + 1);
        });
      });
      // the pen tip while drawing
      if(S.active != null){
        var ap = S.paths[S.active], h = cxy(ap[ap.length - 1]);
        c.strokeStyle = COLS[S.active].c; c.lineWidth = 3; c.globalAlpha = 0.6;
        c.beginPath(); c.arc(h.x, h.y, cs*0.42 + Math.sin(S.time*10)*2, 0, Math.PI*2); c.stroke();
        c.globalAlpha = 1;
      }
      S.parts.forEach(function(p2){
        c.globalAlpha = C.clamp(1 - p2.life/p2.T, 0, 1);
        c.fillStyle = p2.c; c.beginPath(); c.arc(p2.x, p2.y, 3, 0, Math.PI*2); c.fill();
      });
      c.globalAlpha = 1;
      drawHud(c);
    }
    function drawHud(c){
      var r = ML.check(level, S.paths), y = 22, i;
      // one pill per line, filled in its colour once connected
      var pw = Math.min(30, (G.W - 160)/K - 6), tot = K*pw + (K - 1)*6, x0 = G.W/2 - tot/2;
      for(i = 0; i < K; i++){
        var x = x0 + i*(pw + 6), on = S.done[i];
        C.rrect(c, x, y - 7, pw, 14, 7);
        c.fillStyle = on ? COLS[i].c : 'rgba(255,255,255,.16)'; c.fill();
        if(on){
          c.strokeStyle = '#ffffff'; c.lineWidth = 2.2; c.lineCap = 'round'; c.lineJoin = 'round';
          c.beginPath(); c.moveTo(x + pw*0.3, y); c.lineTo(x + pw*0.45, y + 3.4); c.lineTo(x + pw*0.7, y - 3.4); c.stroke();
        }
      }
      // how much of the map is covered
      var frac = r.covered/r.cells, bx = 70, bw = G.W - 140, by = 46;
      C.rrect(c, bx, by - 5, bw, 10, 5); c.fillStyle = 'rgba(255,255,255,.14)'; c.fill();
      if(frac > 0){ C.rrect(c, bx, by - 5, Math.max(10, bw*frac), 10, 5); c.fillStyle = frac >= 1 ? '#7be08a' : '#ffffff'; c.fill(); }
      c.fillStyle = 'rgba(255,255,255,.85)'; c.font = '800 12px Nunito, sans-serif';
      c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(Math.round(frac*100) + '%', bx - 8, by);
      c.textAlign = 'left'; c.fillText(C.t('metroMap'), bx + bw + 8, by);
    }

    /* ---------- update ---------- */
    function update(dt){
      S.time += dt;
      // stuck for half a minute? the first hint on this map is on the house
      if(!S.freeHint && S.time > 30 && !S.over){ S.freeHint = true; api.refresh(); }
      for(var gi = S.ghosts.length - 1; gi >= 0; gi--){ S.ghosts[gi].t += dt; if(S.ghosts[gi].t > 1.3) S.ghosts.splice(gi, 1); }
      if(S.emptyPulse > 0) S.emptyPulse -= dt;
      if(S.stopPulse > 0) S.stopPulse -= dt;
      for(var i = S.pops.length - 1; i >= 0; i--){ S.pops[i].t += dt; if(S.pops[i].t > 0.45) S.pops.splice(i, 1); }
      for(var j = S.parts.length - 1; j >= 0; j--){
        var p = S.parts[j]; p.life += dt;
        if(p.life > p.T){ S.parts.splice(j, 1); continue; }
        p.vy += 300*dt; p.x += p.vx*dt; p.y += p.vy*dt;
      }
      for(var c in S.trains){
        var tr = S.trains[c], len = S.paths[c].length - 1;
        if(len < 1) continue;
        tr.s += tr.dir*dt*(S.over ? 6 : 3.2);
        if(tr.s >= len){ tr.s = len; tr.dir = -1; } else if(tr.s <= 0){ tr.s = 0; tr.dir = 1; }
      }
      if(S.winT >= 0){
        S.winT += dt;
        if(S.winT > 1.1 && inst.status === 'play'){
          // Trying things out is how this puzzle is solved, so redrawing is free;
          // only hints cost a star.
          var stars = S.hints === 0 ? 3 : S.hints === 1 ? 2 : 1;
          inst.status = 'won'; inst.result = {stars:stars, coins:K*4 + (stars === 3 ? 10 : 0)};
          api.refresh();
        }
      }
    }

    /* ---------- input and boosters ---------- */
    function pointer(type, x, y){
      if(S.over) return;
      if(type === 'down') press(x, y);
      else if(type === 'move') drag(x, y);
      else release();
    }
    function hint(){
      if(S.over) return false;
      // the first line that is not yet drawn exactly as in the solution (either way round)
      function same(p, sol){
        if(p.length !== sol.length) return false;
        var fwd = true, rev = true;
        for(var k = 0; k < p.length; k++){ if(p[k] !== sol[k]) fwd = false; if(p[k] !== sol[sol.length - 1 - k]) rev = false; }
        return fwd || rev;
      }
      // the line that is hardest to find on your own: the twistiest one not yet right
      var L = null;
      level.lines.forEach(function(cand){
        if(same(S.paths[cand.c], cand.path)) return;
        if(!L || ML.turns(cand.path, W) > ML.turns(L.path, W) ||
           (ML.turns(cand.path, W) === ML.turns(L.path, W) && cand.path.length > L.path.length)) L = cand;
      });
      if(!L) return false;
      var free = S.freeHint && !S.freeUsed;
      if(free) S.freeUsed = true;
      else if(!api.spend(C.COST.hint)) return false;
      L.path.forEach(function(cell){                                 // clear anything in its way
        var o = ownerOf(cell);
        if(o >= 0 && o !== L.c){
          var q = S.paths[o], at = q.indexOf(cell);
          // leave a fading outline of what moved, so nothing vanishes unexplained
          q.slice(Math.max(0, at)).forEach(function(cut){ S.ghosts.push({cell:cut, c:o, t:0}); });
          q.length = Math.max(0, at); S.done[o] = false;
        }
      });
      S.paths[L.c] = L.path.slice(); S.done[L.c] = true; S.trains[L.c] = {s:0, dir:1};
      S.hints++; S.pops.push({cell:L.a, t:0}); S.pops.push({cell:L.b, t:0});
      C.sfx.park(); evaluate(); api.refresh();
      return true;
    }
    function booster(id){ return id === 'hint' ? hint() : false; }
    function boosterState(id){
      var free = S.freeHint && !S.freeUsed;
      return {disabled:S.over, on:free, cost:free ? 0 : C.COST.hint, free:free};
    }
    function hud(){
      var d = 0; for(var c in S.done) if(S.done[c]) d++;
      return {main:d + '/' + K, sub:C.t('linesLbl')};
    }

    inst.layout = layout; inst.paintStatic = paintStatic; inst.update = update; inst.draw = draw;
    inst.down = function(){}; inst.pointer = pointer;
    inst.booster = booster; inst.boosterState = boosterState; inst.hud = hud;
    inst.state = S; inst.__level = level; inst.__cell = function(cell){ return cxy(cell); };
    inst.twist = level.lines.some(function(L){ return L.stops.length; }) ? 'stations' : n === 2 ? 'snake' : null;
    /* The coach: a line drawn by a hand along the route it must take. The
       first time, the shortest line; when stuck, the one hardest to find. */
    function same2(p, sol){
      if(p.length !== sol.length) return false;
      var fwd = true, rev = true;
      for(var k = 0; k < p.length; k++){ if(p[k] !== sol[k]) fwd = false; if(p[k] !== sol[sol.length - 1 - k]) rev = false; }
      return fwd || rev;
    }
    inst.coachNow = function(){
      if(S.over) return false;
      if(S.tut === 1) return true;
      // every pair joined but squares left empty: looks finished, is not. Show the fix at once.
      for(var c in S.done) if(!S.done[c]) return false;
      return true;
    };
    inst.coachMove = function(){
      if(S.over || S.active != null) return null;
      var L = null, allDone = true;
      level.lines.forEach(function(cand){ if(!S.done[cand.c]) allDone = false; });
      level.lines.forEach(function(cand){
        if(same2(S.paths[cand.c], cand.path)) return;
        if(!L) { L = cand; return; }
        if(S.tut === 1 ? cand.path.length < L.path.length
                       : ML.turns(cand.path, W) > ML.turns(L.path, W)) L = cand;
      });
      if(!L) return null;
      return {kind:'drag', path:L.path.map(cxy), r:G.cell*0.48, col:COLS[L.c].c, trail:Math.max(6, G.cell*0.28),
              text:C.t(allDone ? 'coMetroFill' : 'coMetro')};
    };
    if(api.firstTime) S.tut = 1;
    return inst;
  }

  window.Games = window.Games || {};
  window.Games.metro = {
    id:'metro', titleKey:'gameMetro', boosters:['hint'],
    generate:function(n, o){ return ML.generate(n, o && o.seed); },
    create:create
  };
})();
</script>
<script>
/* Déneigement: swipe to drive the snowplow. It slides until a snowbank or a
   building stops it, clearing every square it passes. Clear every street.
   A quick, satisfying breather between the thinkier levels. */
(function(){
  'use strict';
  var C = window.Core, PL = window.PlowLogic;
  var HOUSE = ['#c9574d','#d99a3a','#3f9a9a','#8a5aa8','#4a7fc1','#bf6a3b'];
  var SPEED = 15;                                   // squares a second

  function create(level, n, api){
    var W = level.W, H = level.H, road = level.road;
    var S = {
      pos:level.start, cleared:new Uint8Array(W*H), dirOf:new Int8Array(W*H).fill(-1),
      moves:0, hist:[], anim:null, queue:null, time:0, over:false, winT:-1,
      parts:[], floats:[], hintDir:-1, hintT:0, face:1, tut:0, undos:0, shake:0
    };
    S.cleared[S.pos] = 1;
    var nRoad = 0;
    for(var i = 0; i < W*H; i++) nRoad += road[i];
    var G = null, blockCol = {}, park = {};
    // rooftops in the colours of this neighbourhood's buildings
    var STYLE_PAL = {brick:['#a4472f','#8f3f2e','#b5603f','#7d3a2a','#9a5236','#c0714a'],
                     greystone:['#a9a397','#8f8b84','#b9b3a7','#7f7a72','#c4beb2','#9a948a'],
                     victorian:['#d98fa3','#7fbfae','#e8c46a','#8fa6dd','#e7a07a','#a98fd0']};
    var place0 = window.Places && window.Places.current(), PAL = (place0 && STYLE_PAL[place0.style]) || HOUSE;
    var inst = {status:'play', result:null, lose:null, tip:null, boosters:['undo','hint'], subtitle:null, showHud:true};

    // buildings: neighbouring wall squares form one block with one colour; some blocks are parks
    (function(){
      var seen = new Int16Array(W*H).fill(-1), b = 0, rng = window.DetourLogic.mulberry32(n*31 + 7);
      for(var s = 0; s < W*H; s++){
        if(road[s] || seen[s] >= 0) continue;
        var stack = [s], col = PAL[Math.floor(rng()*PAL.length)], isPark = rng() < 0.22;
        seen[s] = b;
        while(stack.length){
          var c = stack.pop(), x = c % W, y = (c - x)/W;
          blockCol[c] = col; if(isPark) park[c] = 1;
          [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
            var nx = x + d[0], ny = y + d[1], k = ny*W + nx;
            if(nx < 0 || ny < 0 || nx >= W || ny >= H || road[k] || seen[k] >= 0) return;
            seen[k] = b; stack.push(k);
          });
        }
        b++;
      }
    })();

    function layout(g){
      G = g;
      G.top = 58;
      var avW = g.W - 24, avH = g.H - G.top - 18;
      G.cell = Math.floor(Math.min(avW/W, avH/H));
      G.bw = G.cell*W; G.bh = G.cell*H;
      G.bx = Math.round((g.W - G.bw)/2);
      // when there is room, the neighbourhood's skyline sits above the streets
      var spare = avH - G.bh;
      G.band = spare >= 110 ? Math.min(220, spare - 36) : 0;
      G.by = G.band ? Math.round(G.top + G.band + 22) : Math.round(G.top + (avH - G.bh)/2 + 4);
    }
    function cxy(cell){ var x = cell % W, y = (cell - x)/W; return {x:G.bx + (x + 0.5)*G.cell, y:G.by + (y + 0.5)*G.cell}; }
    function clearedCount(){ var k = 0; for(var i = 0; i < W*H; i++) if(road[i] && S.cleared[i]) k++; return k; }

    /* ---------- moving ---------- */
    function go(d){
      if(S.over) return;
      if(S.anim){ S.queue = d; return; }
      var end = PL.slide(road, W, H, S.pos, d);
      S.face = d;
      if(end === S.pos){ S.shake = 0.25; C.sfx.bump(); C.haptic(14); return; }
      S.hist.push({pos:S.pos, cleared:S.cleared.slice(), dirOf:S.dirOf.slice(), moves:S.moves});
      S.moves++;
      var cells = PL.cellsBetween(W, S.pos, end);
      S.anim = {cells:cells, d:d, t:0, T:(cells.length - 1)/SPEED + 0.1, from:S.pos, to:end};
      S.hintDir = -1; S.hintT = 0;
      C.sfx.go(); C.haptic(8);
      if(S.tut){ S.tut = 0; }
      api.refresh();
    }
    function stepAnim(dt){
      var a = S.anim;
      a.t += dt;
      var u = Math.min(1, a.t/Math.max(a.T, 0.05)), e = C.trapez(a.t, a.T, 0.06, 0.14), reach = Math.floor(e*(a.cells.length - 1) + 0.5);
      for(var k = 0; k <= reach; k++){
        var c = a.cells[k];
        if(!S.cleared[c]){
          S.cleared[c] = 1; S.dirOf[c] = a.d;
          var p = cxy(c);
          for(var j = 0; j < 4; j++){                                 // snow thrown off the blade, to the side
            var side = j % 2 ? 1 : -1, px = PL.DY[a.d]*side, py = -PL.DX[a.d]*side;
            S.parts.push({x:p.x, y:p.y, vx:px*(70 + Math.random()*80) + PL.DX[a.d]*40, vy:py*(70 + Math.random()*80) + PL.DY[a.d]*40 - 30,
                          life:0, T:.45 + Math.random()*.3, r:2 + Math.random()*2.5});
          }
          if(S.time - (S.lastTick || 0) > 0.03){ S.lastTick = S.time; C.sfx.board(Math.min(14, clearedCount()/2)); }
        } else S.dirOf[c] = S.dirOf[c] < 0 ? a.d : S.dirOf[c];
      }
      if(u >= 1){
        S.pos = a.to; S.anim = null; C.haptic(6); S.settle = {t:0, d:a.d};          // a small lurch as it stops
        if(clearedCount() >= nRoad){ S.over = true; S.winT = 0; return; }
        if(S.queue != null){ var q = S.queue; S.queue = null; go(q); }
      }
    }
    function plowXY(){
      if(!S.anim) return cxy(S.pos);
      var a = S.anim, u = C.trapez(a.t, a.T, 0.06, 0.14), p0 = cxy(a.from), p1 = cxy(a.to);
      return {x:p0.x + (p1.x - p0.x)*u, y:p0.y + (p1.y - p0.y)*u};
    }

    /* ---------- painting ---------- */
    function paintStatic(c){
      var sn = C.season();
      var g = c.createLinearGradient(0, 0, 0, G.H);
      g.addColorStop(0, '#dfe9f3'); g.addColorStop(1, '#f2f6fa');
      c.fillStyle = g; c.fillRect(0, 0, G.W, G.H);
      var PL = window.Places;
      if(G.band && PL.current()){
        var wx = 12, wy = G.top, ww = G.W - 24, wh = G.band;
        c.save(); C.rrect(c, wx, wy, ww, wh, 14); c.clip(); PL.drawBand(c, wx, wy, ww, wh, {}); c.restore();
        c.strokeStyle = '#ffffff'; c.lineWidth = 3; C.rrect(c, wx, wy, ww, wh, 14); c.stroke();
      }
      c.save();
      c.shadowColor = 'rgba(16,24,38,.25)'; c.shadowBlur = 14; c.shadowOffsetY = 4;
      c.fillStyle = '#4c5767'; C.rrect(c, G.bx - 6, G.by - 6, G.bw + 12, G.bh + 12, 12); c.fill();
      c.restore();
      var cs = G.cell, x, y, k;
      for(y = 0; y < H; y++) for(x = 0; x < W; x++){
        k = y*W + x;
        var px = G.bx + x*cs, py = G.by + y*cs;
        if(road[k]){ c.fillStyle = '#525d6d'; c.fillRect(px, py, cs, cs); continue; }
        if(park[k]){
          c.fillStyle = '#9cc7a6'; c.fillRect(px, py, cs, cs);           // a little park: grass under light snow
          c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(px + cs*0.3, py + cs*0.75, cs*0.22, cs*0.1, 0, 0, Math.PI*2); c.fill();
          {
            c.fillStyle = 'rgba(30,60,40,.18)'; c.beginPath(); c.arc(px + cs*0.55, py + cs*0.6, cs*0.32, 0, Math.PI*2); c.fill();
            c.fillStyle = '#3f7d55'; c.beginPath(); c.arc(px + cs*0.5, py + cs*0.48, cs*0.3, 0, Math.PI*2); c.fill();
            c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(px + cs*0.44, py + cs*0.42, cs*0.17, 0, Math.PI*2); c.fill();
          }
          continue;
        }
        // a building, roof seen from above: strong colour, a snow cap, a darker
        // edge where it meets the street, and its lit front wall below
        var col = blockCol[k] || HOUSE[0];
        c.fillStyle = col; c.fillRect(px, py, cs, cs);
        c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(px + cs*0.12, py + cs*0.12, cs*0.76, cs*0.5);
        c.fillStyle = 'rgba(255,255,255,.78)'; C.rrect(c, px + cs*0.16, py + cs*0.14, cs*0.5, cs*0.26, cs*0.1); c.fill();
        c.strokeStyle = 'rgba(30,24,30,.35)'; c.lineWidth = 2;
        if(y === 0 || road[k - W]){ c.beginPath(); c.moveTo(px, py + 1); c.lineTo(px + cs, py + 1); c.stroke(); }
        if(x === 0 || road[k - 1]){ c.beginPath(); c.moveTo(px + 1, py); c.lineTo(px + 1, py + cs); c.stroke(); }
        if(x === W - 1 || road[k + 1]){ c.beginPath(); c.moveTo(px + cs - 1, py); c.lineTo(px + cs - 1, py + cs); c.stroke(); }
        var south = y === H - 1 || road[k + W];
        if(south){
          c.fillStyle = 'rgba(20,16,24,.42)'; c.fillRect(px, py + cs*0.74, cs, cs*0.26);
          c.fillStyle = '#ffe2a0'; c.fillRect(px + cs*0.24, py + cs*0.8, cs*0.18, cs*0.12); c.fillRect(px + cs*0.58, py + cs*0.8, cs*0.18, cs*0.12);
        }
        if((x*5 + y*11) % 4 === 0){ c.fillStyle = 'rgba(40,30,30,.55)'; c.fillRect(px + cs*0.66, py + cs*0.46, cs*0.14, cs*0.14); }
        C.rrect(c, px, py, cs, cs, cs*0.12); C.clayShade(c, px, py, cs, cs, .55);   // each roof a pressed block of clay
      }
      c.beginPath(); c.rect(G.bx - 6, G.by - 6, G.bw + 12, G.bh + 12); C.clayShade(c, G.bx - 6, G.by - 6, G.bw + 12, G.bh + 12, .25);
    }
    function draw(c){
      var cs = G.cell, k, p;
      // snow still on the streets, and tyre tracks where the plow has been
      for(k = 0; k < W*H; k++){
        if(!road[k]) continue;
        p = cxy(k);
        if(S.cleared[k]){
          var d = S.dirOf[k];
          c.strokeStyle = 'rgba(255,255,255,.1)'; c.lineWidth = 2;
          c.beginPath();
          if(d === 0 || d === 2){ c.moveTo(p.x - cs*0.2, p.y - cs/2); c.lineTo(p.x - cs*0.2, p.y + cs/2); c.moveTo(p.x + cs*0.2, p.y - cs/2); c.lineTo(p.x + cs*0.2, p.y + cs/2); }
          else if(d >= 0){ c.moveTo(p.x - cs/2, p.y - cs*0.2); c.lineTo(p.x + cs/2, p.y - cs*0.2); c.moveTo(p.x - cs/2, p.y + cs*0.2); c.lineTo(p.x + cs/2, p.y + cs*0.2); }
          c.stroke();
          continue;
        }
        // one continuous blanket of snow, shaded where a building casts its edge
        c.fillStyle = '#f4f8fc'; c.fillRect(p.x - cs/2, p.y - cs/2, cs, cs);
        var ky = (k - k % W)/W;
        if(ky > 0 && !road[k - W]){ c.fillStyle = 'rgba(90,110,140,.22)'; c.fillRect(p.x - cs/2, p.y - cs/2, cs, cs*0.2); }
        c.fillStyle = 'rgba(170,195,220,.28)'; c.beginPath(); c.ellipse(p.x + cs*0.12, p.y + cs*0.14, cs*0.26, cs*0.1, 0, 0, Math.PI*2); c.fill();
        var tw = (Math.sin(S.time*3 + k*1.7) + 1)/2;
        if(tw > 0.85){ c.fillStyle = 'rgba(255,255,255,' + ((tw - 0.85)*6) + ')'; c.beginPath(); c.arc(p.x - cs*0.15, p.y - cs*0.18, 1.6, 0, Math.PI*2); c.fill(); }
      }
      // the hint
      if(S.hintDir >= 0 && !S.anim){
        var hp = cxy(S.pos), pul = (Math.sin(S.time*7) + 1)/2;
        c.save(); c.translate(hp.x, hp.y); c.rotate(S.hintDir*Math.PI/2);
        c.fillStyle = 'rgba(154,95,208,' + (0.55 + pul*0.4) + ')';
        C.poly(c, [[0, -cs*1.15 - pul*4], [cs*0.32, -cs*0.7], [-cs*0.32, -cs*0.7]]); c.fill();
        c.restore();
      }
      drawPlow(c);
      S.parts.forEach(function(q){
        c.globalAlpha = C.clamp(1 - q.life/q.T, 0, 1);
        c.fillStyle = '#ffffff'; c.beginPath(); c.arc(q.x, q.y, q.r, 0, Math.PI*2); c.fill();
      });
      c.globalAlpha = 1;
      S.floats.forEach(function(f){
        c.globalAlpha = C.clamp(1 - f.t/1.1, 0, 1);
        c.font = '400 18px "Lilita One", Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.lineWidth = 4; c.strokeStyle = 'rgba(17,24,36,.75)'; c.strokeText(f.txt, f.x, f.y - f.t*26);
        c.fillStyle = f.col; c.fillText(f.txt, f.x, f.y - f.t*26);
      });
      c.globalAlpha = 1;
      drawHud(c);
    }
    function drawPlow(c){
      var p = plowXY(), cs = G.cell, s = cs/40, sh = S.shake > 0 ? Math.sin(S.time*70)*2*(S.shake/0.25) : 0;
      if(S.settle && S.settle.t < 0.22){                       // the plough rocks forward as it stops, then settles
        var lk = Math.sin(S.settle.t/0.22*Math.PI)*cs*0.07; p = {x:p.x + PL.DX[S.settle.d]*lk, y:p.y + PL.DY[S.settle.d]*lk};
      }
      c.save(); c.translate(p.x + sh, p.y); c.rotate(S.face*Math.PI/2); c.scale(s, s);
      c.fillStyle = 'rgba(0,0,0,.28)'; C.rrect(c, -13, -12, 28, 30, 6); c.fill();       // shadow
      c.fillStyle = '#e8792a'; C.rrect(c, -12, -6, 24, 24, 5); c.fill(); C.clayShade(c, -12, -6, 24, 24, .9);   // body
      c.fillStyle = '#c55e17'; C.rrect(c, -12, 10, 24, 8, 4); c.fill();
      c.fillStyle = '#2a3b52'; C.rrect(c, -9, -3, 18, 9, 3); c.fill();                 // windscreen
      var flash = Math.floor(S.time*6) % 2;
      c.fillStyle = flash ? '#ffd34d' : '#ffb020'; C.rrect(c, -5, 7, 10, 4, 2); c.fill(); // roof beacon
      c.fillStyle = '#f6c945'; C.poly(c, [[-17, -12], [17, -12], [14, -7], [-14, -7]]); c.fill();   // the blade
      c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(-14, -8, 28, 1.5);
      if(S.anim){ c.fillStyle = 'rgba(255,255,255,.9)'; C.rrect(c, -16, -18, 32, 6, 3); c.fill(); }   // a wave of snow at the blade
      c.restore();
    }
    function drawHud(c){
      var done = clearedCount(), frac = done/nRoad, bx = 80, bw = G.W - 160, by = 22;
      C.rrect(c, bx, by - 6, bw, 12, 6); c.fillStyle = 'rgba(80,96,118,.18)'; c.fill();
      C.rrect(c, bx, by - 6, Math.max(12, bw*frac), 12, 6); c.fillStyle = frac >= 1 ? '#2fae47' : '#4a7fc1'; c.fill();
      c.font = '800 12px Nunito, sans-serif'; c.textBaseline = 'middle';
      c.fillStyle = '#3a4659'; c.textAlign = 'right'; c.fillText(Math.round(frac*100) + '%', bx - 8, by);
      c.textAlign = 'left'; c.fillText(C.t('plowCleared'), bx + bw + 8, by);
      c.textAlign = 'center'; c.fillStyle = '#586477';
      c.fillText(C.t('plowBest').replace('{n}', level.opt), G.W/2, by + 20);
    }

    /* ---------- update ---------- */
    function update(dt){
      S.time += dt;
      if(S.anim) stepAnim(dt);
      if(S.settle) S.settle.t += dt;
      if(S.shake > 0) S.shake -= dt;
      if(S.hintT > 0){ S.hintT -= dt; if(S.hintT <= 0) S.hintDir = -1; }
      for(var i = S.parts.length - 1; i >= 0; i--){
        var q = S.parts[i]; q.life += dt;
        if(q.life > q.T){ S.parts.splice(i, 1); continue; }
        q.vy += 260*dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= 0.94;
      }
      for(var f = S.floats.length - 1; f >= 0; f--){ S.floats[f].t += dt; if(S.floats[f].t > 1.1) S.floats.splice(f, 1); }
      if(S.winT >= 0){
        S.winT += dt;
        if(S.winT > 0.8 && inst.status === 'play'){
          var stars = S.moves <= level.opt ? 3 : S.moves <= level.opt + 3 ? 2 : 1;
          inst.status = 'won'; inst.result = {stars:stars, coins:10 + (stars === 3 ? 10 : 0)};

    }

    /* ---------- input ---------- */
    var press = null;
    function pointer(type, x, y){
      if(type === 'down'){ press = {x:x, y:y}; return; }
      if(type !== 'up' || !press) return;
      var dx = x - press.x, dy = y - press.y; press = null;
      if(Math.hypot(dx, dy) < 18){                     // a tap: head toward where you tapped
        var p = plowXY(); dx = x - p.x; dy = y - p.y;
        if(Math.hypot(dx, dy) < G.cell*0.4) return;
      }
      go(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    }
    function booster(id){
      if(S.over || S.anim) return false;
      if(id === 'undo'){
        if(!S.hist.length) return false;
        if(!api.spend(C.COST.undo)) return false;
        var h = S.hist.pop(); S.pos = h.pos; S.cleared = h.cleared; S.dirOf = h.dirOf; S.moves = h.moves; S.undos++;
        C.sfx.tap(); api.refresh(); return true;
      }
      if(id === 'hint'){
        var sol = PL.solve(level, S.pos, S.cleared, 60000);
        if(!sol || !sol.length) return false;
        if(!api.spend(C.COST.hint)) return false;
        S.hintDir = sol[0]; S.hintT = 4; C.sfx.lift(); api.refresh(); return true;
      }
      return false;
    }
    function boosterState(id){
      if(id === 'undo') return {disabled:S.over || !S.hist.length, on:false, cost:C.COST.undo};
      return {disabled:S.over, on:S.hintT > 0, cost:C.COST.hint};
    }
    function hud(){ return {main:String(S.moves), sub:C.t('moves') + ' · ★★★ ' + level.opt}; }

    inst.layout = layout; inst.paintStatic = paintStatic; inst.update = update; inst.draw = draw;
    inst.down = function(){}; inst.pointer = pointer; inst.go = go;
    inst.booster = booster; inst.boosterState = boosterState; inst.hud = hud;
    inst.state = S; inst.__level = level; inst.__cell = function(k){ return cxy(k); };
    inst.__plow = plowXY;
    /* The coach: a swipe from the plow to where that slide will stop. */
    var cache = {key:null, d:-1};
    inst.coachNow = function(){ return S.tut === 1 && !S.over; };
    inst.coachMove = function(){
      if(S.over || S.anim) return null;
      var key = S.pos + ':' + S.moves + ':' + S.undos;
      if(key !== cache.key){
        cache.key = key; cache.d = -1;
        var sol = PL.solve(level, S.pos, S.cleared, 60000);
        if(sol && sol.length) cache.d = sol[0];
      }
      if(cache.d < 0) return null;
      var end = PL.slide(road, W, H, S.pos, cache.d), a = plowXY(), b = cxy(end);
      return {kind:'swipe', x:a.x, y:a.y, x2:b.x, y2:b.y, r:G.cell*0.55, text:C.t(S.tut ? 'coPlow' : 'coPlowIdle')};
    };
    if(api.firstTime) S.tut = 1;
    return inst;
  }

  window.Games = window.Games || {};
  window.Games.plow = {
    id:'plow', titleKey:'gamePlow', boosters:['undo','hint'],
    generate:function(n){ return PL.generate(n); },
    create:create
  };
})();
</script>
<script>
/* BMX dash: ride a BMX down a Montréal street, three lanes wide. Swipe left
   or right to change lanes, up to jump the low barriers (with a trick every
   time), down to skid under the signs. Grab the coins, dodge the parked cars,
   reach the finish line.
   Three hearts; every bump costs one. Stars are for a clean run.
   The rules live in RunLogic; this file draws, listens and makes noise. */
(function(){
  'use strict';
  var C = window.Core, RL = window.RunLogic;
  var LANE = RL.LANE_W;

  function create(level, n, api){
    var endless = !!level.endless;
    var S = RL.newRun(n, {seed:level.seed, endless:endless, winter:level.winter});
    var G = null, view3d = null, time = 0, startT = 1.35;
    var fx = {shake:0, flash:0, flashCol:'255,59,48'};
    var floats = [], sparks = [], lastCoinSfx = 0, hudT = 0, tipT = 0, best0 = C.save.runBest || 0;
    var tutDone = {}, tutNow = null, newBest = false;
    // the first ride holds the street still at each lesson until the player makes the move
    var teach = n === 1 && !endless && !(C.save.seenTut && C.save.seenTut.runLesson);
    var timeK = 1, lessonHold = false, holdT = 0, buffered = -1, wrongT = 9;
    var landT = 9, stumbleT = 9, hitStop = 0, crash = null, killer = null, runTricks = 0, coinBuf = 0, lastRide = 0;
    var look = window.Rewards ? window.Rewards.outfit() : {helmet:'#ff6b1a', shirt:'#1fb5a8', frame:'#e8413c'};
    function holdAt(r){ return r.tut === 'jump' ? S.v*0.44 : r.tut === 'slide' ? S.v*0.4 : S.v*0.65; }   // where acting at once just works
    function rightMove(need, d){ return (need === 'swipe' && (d === 1 || d === 3)) || (need === 'jump' && d === 0) || (need === 'slide' && d === 2); }
    // every jump is a trick; the airtime of a jump is 2*9.5/22 s
    var TRICKS = [['360', 'trick360'], ['tabletop', 'trickTable'], ['nohands', 'trickNoHands'], ['superman', 'trickSuperman'],
                  ['backflip', 'trickFlip'], ['tailwhip', 'trickWhip']];
    var AIR = 2*9.5/22, trick = null, trickT = 0, lastTrick = -1, pops = [];
    function startTrick(){
      var i = Math.floor(Math.random()*TRICKS.length);
      if(i === lastTrick) i = (i + 1 + Math.floor(Math.random()*(TRICKS.length - 1))) % TRICKS.length;
      lastTrick = i; trick = {kind:TRICKS[i][0], key:TRICKS[i][1]}; trickT = 0;
      pops.push({txt:C.t(TRICKS[i][1]), t:0});
    }
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;   // no camera shake then
    var inst = {status:'play', result:null, lose:null, tip:null, boosters:['hat','magnet'], subtitle:null, showHud:true,
                twist:null, isEndless:endless};

    /* ---------- layout ---------- */
    function layout(g){
      G = g;
      // the flat drawing's camera: horizon, where the runner stands, and a
      // scale that keeps the street's three lanes on screen
      G.hz = Math.round(g.H*0.34);
      G.feet = Math.round(g.H*0.82);
      G.back = 9;
      G.ch = Math.max(4.2, 3.4*(G.feet - G.hz)/(g.W*0.46));
      G.f = (G.feet - G.hz)*G.back/G.ch;
      if(view3d){ view3d.dispose(); view3d = null; }
      if(window.Kit3D && window.Kit3D.available() && window.Kit3D.runView){
        try {
          view3d = window.Kit3D.runView(G, {finish:endless ? 0 : S.T.finish, finishWord:C.t('runFinish').toUpperCase(),
                                            signWord:C.save.lang === 'fr' ? 'DÉTOUR' : 'DETOUR', outfit:look});
        } catch(e){ view3d = null; if(window.console) console.error(e); }
      }
    }
    function use3d(){ return view3d && window.Kit3D.available(); }

    /* ---------- input ---------- */
    function go(d){
      if(inst.status !== 'play' || startT > 0 || S.finishT >= 0 || S.over) return;
      if(teach && tutNow && !tutDone[tutNow.tut]){
        var right = rightMove(tutNow.tut, d), room = tutNow.z - S.d - holdAt(tutNow);
        if(lessonHold && !right){ wrongT = 0; C.haptic(8); return; }          // a held lesson only takes the move it teaches
        if(!lessonHold && right && tutNow.tut !== 'swipe' && room > 0 && room < S.v*0.35){ buffered = d; return; }   // a touch early: kept for the right moment
      }
      act(d);
    }
    function act(d){
      var lane0 = S.lane, ok = RL.act(S, d);
      if(!ok){ if(d === 1 || d === 3){ fx.shake = Math.max(fx.shake, 0.12); C.haptic(8); } return; }
      if(d === 0){ C.sfx.lift(); startTrick(); }
      else if(d === 2){ C.sfx.drop(); trick = null; }
      else C.sfx.tap();
      C.haptic(6);
      if(tutNow){
        var need = tutNow.tut, did = (need === 'swipe' && S.lane !== lane0) || (need === 'jump' && d === 0) || (need === 'slide' && d === 2);
        if(did){
          tutDone[need] = 1; tutNow = null;
          if(teach){
            lessonHold = false; say(C.t('runNice'), '#ffe17a');
            if(tutDone.swipe && tutDone.jump && tutDone.slide){ C.save.seenTut.runLesson = 1; C.persist(); }
          }
        }
      }
    }
    var press = null;
    function pointer(type, x, y){
      if(type === 'down'){ press = {x:x, y:y, done:false}; return; }
      if(!press) return;
      var dx = x - press.x, dy = y - press.y, far = Math.hypot(dx, dy);
      if(type === 'move'){
        // a swipe counts as soon as the finger has clearly moved: no waiting for the lift
        if(!press.done && far > 26){ press.done = true; go(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0)); }
        return;
      }
      if(type === 'up'){
        if(!press.done){
          if(far > 14) go(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
          else if(G){                                  // a tap: the sides change lanes, the middle jumps
            if(x < G.W*0.3) go(3); else if(x > G.W*0.7) go(1); else go(0);
          }
        }
        press = null;
      }
    }

    /* ---------- boosters ---------- */
    function booster(id){
      if(inst.status !== 'play' || S.over || S.finishT >= 0) return false;
      if(id === 'hat'){
        if(S.shield || !api.spend(C.COST.hat)) return false;
        S.shield = true; C.sfx.clear(); say(C.t('runHat'), '#ffd21f'); api.refresh(); return true;
      }
      if(id === 'magnet'){
        if(!api.spend(C.COST.magnet)) return false;
        S.magnetT = Math.max(S.magnetT, 0) + 9; C.sfx.clear(); say(C.t('runMagnet'), '#ff7ab8'); api.refresh(); return true;
      }
      return false;
    }
    function boosterState(id){
      var off = inst.status !== 'play' || !!S.over || S.finishT >= 0;
      if(id === 'hat') return {disabled:off || S.shield, on:S.shield, cost:C.COST.hat};
      return {disabled:off, on:S.magnetT > 0, cost:C.COST.magnet};
    }
    function hud(){
      if(endless){
        var b = Math.max(best0, Math.floor(S.d));
        return {main:Math.floor(S.d) + ' m', sub:'· ' + C.t('best') + ' ' + b + ' m'};
      }
      return {main:Math.max(0, Math.ceil(S.T.finish - S.d)) + ' m', sub:C.t('runToGo')};
    }

    /* ---------- update ---------- */
    function say(txt, colr){ floats.push({txt:txt, col:colr || '#ffffff', t:0}); }
    function where(){                                   // the runner on screen, for effects
      if(use3d()){ var p = view3d.project(S.x, S.y + 1.2, -S.d); return {x:p.x, y:p.y}; }
      return {x:G.W/2 + (S.x - camX())*G.f/G.back, y:G.feet - (S.y + 1.2)*G.f/G.back};
    }
    function handle(ev){
      for(var i = 0; i < ev.length; i++){
        var e = ev[i];
        if(e.t === 'coin'){
          api.coins(1); coinBuf++;
          if(time - lastCoinSfx > 0.07){ C.sfx.coin(); lastCoinSfx = time; }
          var p = where();
          for(var k = 0; k < 4; k++) sparks.push({x:p.x + (Math.random() - 0.5)*20, y:p.y - 10, vx:(Math.random() - 0.5)*90, vy:-60 - Math.random()*80, t:0});
        } else if(e.t === 'hit'){
          killer = e.ob; trick = null;
          if(S.over === 'lost'){ if(e.ob.need !== 'block') e.ob.hitAt = time; startCrash(); continue; }   // what he rode into stays put
          e.ob.hitAt = time; fx.shake = 0.5; fx.flash = 0.45; fx.flashCol = '255,59,48';
          C.sfx.bump(); C.haptic([40, 30, 40]);
          hitStop = 0.07; stumbleT = 0;                               // a beat of stillness, then he wobbles on
          if(S.hearts > 0) say(S.hearts === 1 ? C.t('runLastHeart') : C.t('runOuchShort'), '#ff6b5e');
        } else if(e.t === 'shield'){
          e.ob.hitAt = time; fx.shake = 0.25; fx.flash = 0.3; fx.flashCol = '255,210,31';
          C.sfx.drop(); C.haptic(20); say(C.t('runSaved'), '#ffd21f');
        } else if(e.t === 'bump'){
          fx.shake = Math.max(fx.shake, 0.2); C.sfx.bump(); C.haptic(14);
        } else if(e.t === 'power'){
          C.sfx.clear(); C.haptic(16);
          say(e.p.kind === 'hat' ? C.t('runHat') : C.t('runMagnet'), e.p.kind === 'hat' ? '#ffd21f' : '#ff7ab8');
          api.refresh();
        } else if(e.t === 'land'){
          landT = 0;
          var lp = screenAt(S.x, 0.05, 0.5);
          for(var q = 0; q < 3; q++) sparks.push({x:lp.x + (q - 1)*12, y:lp.y, vx:(q - 1)*40, vy:-14, t:0, dust:true});
        } else if(e.t === 'finish'){
          C.sfx.clear(); say(C.t('runMadeIt'), '#ffffff');
        }

    }
    function update(dt){
      time += dt;
      fx.shake = calm ? 0 : Math.max(0, fx.shake - dt*1.6); fx.flash = Math.max(0, fx.flash - dt*1.4);
      for(var i = floats.length - 1; i >= 0; i--){ floats[i].t += dt; if(floats[i].t > 1.2) floats.splice(i, 1); }
      for(i = pops.length - 1; i >= 0; i--){ pops[i].t += dt; if(pops[i].t > 0.9) pops.splice(i, 1); }
      if(S.slideT > 0 && G && Math.random() < 0.6){                // dust from the skidding back wheel
        var wp = where(); sparks.push({x:wp.x + 14, y:wp.y + 34, vx:30 + Math.random()*50, vy:-20 - Math.random()*30, t:0, dust:true});
      }
      for(i = sparks.length - 1; i >= 0; i--){
        var s = sparks[i]; s.t += dt; s.vy += (s.dust ? -30 : 300)*dt; s.x += s.vx*dt; s.y += s.vy*dt;
        if(s.t > (s.big ? 0.9 : 0.5)) sparks.splice(i, 1);
      }
      wrongT += dt;
      if(inst.status !== 'play') return;
      if(startT > 0){ startT -= dt; if(startT <= 0) C.sfx.go(); return; }
      if(inst.tip){ tipT += dt; if(tipT > 6){ inst.tip = null; api.tip(null); } }
      if(crash){ crashStep(dt); return; }
      // the first level teaches each move: the street brakes onto the spot where the move just works, and waits
      tutNow = null;
      for(i = 0; i < S.T.rows.length && i < 4; i++){
        var r = S.T.rows[i];
        if(!r.tut || tutDone[r.tut]) continue;
        var ahead = r.z - S.d;
        if(ahead < -1){ tutDone[r.tut] = 1; continue; }
        if(ahead < S.v*2.4) tutNow = r;
        break;
      }
      var target = 1; lessonHold = false;
      if(tutNow){
        var room = tutNow.z - S.d - holdAt(tutNow), brake = S.v*0.12;
        if(buffered >= 0 && room <= 0.05){ var bd = buffered; buffered = -1; act(bd); }
        else if(teach && room < brake){ lessonHold = true; target = room <= 0.01 ? 0 : Math.min(1, Math.sqrt(room/brake)); }
      }
      timeK = target < timeK ? target : Math.min(target, timeK + dt*7);    // a quick stop, and back to full speed in about 0.15 s
      holdT = lessonHold ? holdT + dt : 0;
      if(hitStop > 0) hitStop -= dt;
      var sdt = hitStop > 0 ? 0 : dt*timeK;
      if(sdt > 0){
        var steps = Math.max(1, Math.ceil(sdt/(1/90)));
        for(var k = 0; k < steps && !S.over; k++) handle(RL.step(S, sdt/steps));
      }
      landT += sdt; stumbleT += sdt;
      if(trick){
        trickT += sdt;
        if(S.y === 0 && trickT > 0.12){ trick = null; C.sfx.tap(); runTricks++; if(api.stat) api.stat('tricks', 1); }
      }
      hudT += dt;
      if(hudT > 0.2){ hudT = 0; flushStats(); api.refresh(); }
      if(endless && Math.floor(S.d) > best0 && best0 > 0 && !newBest){ newBest = true; say(C.t('newBest'), '#ffd34d'); C.sfx.clear(); }
      if(S.over === 'won'){
        flushStats();
        inst.status = 'won'; inst.result = {stars:RL.stars(S), coins:S.coins};
        api.refresh();
      }
    }
    function flushStats(){
      if(!api.stat) return;
      if(coinBuf){ api.stat('runcoins', coinBuf); coinBuf = 0; }
      if(endless && Math.floor(S.d/50) > lastRide){ lastRide = Math.floor(S.d/50); api.stat('ride', Math.floor(S.d)); }
    }
    /* The last heart: a beat of stillness, a moment of slow motion as he goes

    function startCrash(){

      crash = {u:0, real:0, side:side, thud:false, clank:false};
      fx.shake = 0.9; fx.flash = 0.6; fx.flashCol = '255,59,48';

    }
    function crashStep(dt){
      crash.real += dt;

        crash.thud = true; C.sfx.bump(); C.haptic(30); fx.shake = Math.max(fx.shake, 0.4);

        for(var q = 0; q < 7; q++) sparks.push({x:lp.x + (Math.random() - 0.5)*50, y:lp.y + (Math.random() - 0.5)*12, vx:(Math.random() - 0.5)*120, vy:-20 - Math.random()*40, t:0, dust:true, big:true});
      }

    function lose(){
      flushStats();
      var dist = Math.floor(S.d), wasBest = false;
      if(endless){
        wasBest = dist > (C.save.runBest || 0);
        if(wasBest){ C.save.runBest = dist; C.persist(); }
        if(api.stat) api.stat('ride', dist);
      }
      var tipKey = !killer ? 'tipBlock' : killer.need === 'low' ? 'tipLow' : killer.need === 'high' ? 'tipHigh' : 'tipBlock';
      function cell(v, l){ return '<div class="rs"><b>' + v + '</b><small>' + l + '</small></div>'; }
      var html = '<div class="rboard">' + cell(dist + ' m', C.t('rsRidden')) + cell('<i class="coin sm"></i>' + S.coins, C.t('rsCoins')) +
                 cell(runTricks, C.t('rsTricks')) + '</div>';
      if(endless){
        var best = Math.max(C.save.runBest || 0, dist);
        html += '<div class="rto">' + (wasBest ? '<p class="rnew">' + C.t('rsNewBest') + '</p>'
              : '<span class="mb"><i style="width:' + Math.round(dist/Math.max(1, best)*100) + '%"></i></span><p>' + C.t('rsBest').replace('{b}', best) + '</p>') + '</div>';
      } else {
        var toGo = Math.max(1, Math.ceil(S.T.finish - S.d)), near = toGo <= S.T.finish*0.25;
        html += '<div class="rto"><span class="mb"><i style="width:' + Math.round(Math.min(1, S.d/S.T.finish)*100) + '%"></i></span><p>' +
                C.t(near ? 'rsClose' : 'rsToGo').replace('{m}', toGo) + '</p></div>';
      }
      html += '<p class="small rtip">' + C.t(tipKey) + '</p>';
      inst.lose = endless ? {title:C.t('runOver'), sub:'', revive:S.revived < 1, endless:true, html:html}
                          : {title:C.t('runOuch'), sub:C.t('runOuchSub'), revive:S.revived < 1, html:html};
      C.haptic(60);

    }
    function continueAfterLoss(){
      RL.revive(S); crash = null; hitStop = 0; timeK = 1; stumbleT = 9; landT = 9;
      if(view3d && view3d.revive) view3d.revive();
      S.T.obs.forEach(function(ob){ if(ob.hit && ob.hitAt == null) ob.hitAt = time; });     // what he crashed into is pushed aside
      inst.status = 'play'; inst.lose = null; startT = 0.9; fx.flash = 0;
      say(C.t('runGo'), '#ffffff'); api.refresh();
    }
    function screenAt(x, y, dz){                       // a point dz metres ahead of the rider, on screen
      if(use3d()){ var p = view3d.project(x, y, -(S.d + dz)); return {x:p.x, y:p.y}; }
      var q = P(x, y, S.d + dz); return q || {x:G.W/2, y:G.feet};
    }

    /* ---------- drawing ---------- */
    function paintStatic(c){
      var PL = window.Places, m = PL ? PL.mood() : null, sky = m && m.sky ? m.sky : C.season().sky;
      var g = c.createLinearGradient(0, 0, 0, G.hz);
      g.addColorStop(0, sky[0]); g.addColorStop(0.6, sky[1]); g.addColorStop(1, sky[2]);
      c.fillStyle = g; c.fillRect(0, 0, G.W, G.hz + 1);
      if(PL && PL.current()){                          // the neighbourhood's skyline on the horizon
        var bh = Math.min(170, G.hz*0.7);
        c.save(); c.beginPath(); c.rect(0, G.hz - bh, G.W, bh); c.clip();
        PL.drawBand(c, 0, G.hz - bh, G.W, bh, {near:false});
        c.restore();
      }
      c.fillStyle = C.season().ground; c.fillRect(0, G.hz, G.W, G.H - G.hz);
    }
    function camX(){ return S.x*0.5; }
    function P(x, y, z){                               // track point to screen; z is metres along the track
      var dz = z - (S.d - G.back);
      if(dz < 0.6) return null;
      var s = G.f/dz;
      return {x:G.W/2 + (x - camX())*s, y:G.hz + (G.ch - y)*s, s:s};
    }
    function quad(c, a, b, cc, d, fill){
      if(!a || !b || !cc || !d) return;
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.lineTo(cc.x, cc.y); c.lineTo(d.x, d.y); c.closePath();
      c.fillStyle = fill; c.fill();
    }
    var WALLS = {brick:['#a4442c','#d8b25a','#6e4636','#cf7a48','#8f8a84','#e3cfa6'],
                 greystone:['#b9b3a7','#d9c49a','#7f8c94','#c48f6a','#8a7a66','#e6e1d6'],
                 victorian:['#e5809f','#5fb8a3','#f0c64a','#6f8fdc','#ee8f55','#a57bd6'],
                 chinatown:['#b8312a','#c9472e','#a32a2a','#d0603a','#b04030','#c23a2e'],
                 glass:['#5d86a8','#6f97b5','#4f7896','#7da3bf','#5a7f9e','#86aac4'],
                 triplex:['#d9574e','#e2a33b','#3fa3a3','#8f5fa8','#4a7fc1','#c96f3f']};
    function draw2D(c){
      var sn = C.season(), PL = window.Places, place = PL && PL.current(), style = (place && place.style) || 'triplex';
      var pal = WALLS[style] || WALLS.triplex, near = S.d - G.back + 0.8, far = S.d + 115, i, z;
      // street, sidewalks and kerbs
      var walk = '#c9d0da';
      quad(c, P(-6.2, 0, near), P(-3.2, 0, near), P(-3.2, 0, far), P(-6.2, 0, far), walk);
      quad(c, P(3.2, 0, near), P(6.2, 0, near), P(6.2, 0, far), P(3.2, 0, far), walk);
      quad(c, P(-3.2, 0, near), P(3.2, 0, near), P(3.2, 0, far), P(-3.2, 0, far), place && place.ground === 'cobble' ? '#77706a' : '#5a6476');
      for(z = Math.ceil(near/8)*8; z < far; z += 8){
        [-1, 1].forEach(function(x){ quad(c, P(x - 0.07, 0, z), P(x + 0.07, 0, z), P(x + 0.07, 0, z + 3.4), P(x - 0.07, 0, z + 3.4), 'rgba(255,255,255,.85)'); });
      }
      [-3.1, 3.1].forEach(function(x){ quad(c, P(x - 0.06, 0, near), P(x + 0.06, 0, near), P(x + 0.06, 0, far), P(x - 0.06, 0, far), 'rgba(255,214,90,.85)'); });
      for(z = Math.floor(near/40)*40 + 6; z < far; z += 40){            // a crosswalk at every corner
        if(z + 2.4 < near) continue;
        for(var zx = -2.75; zx <= 2.76; zx += 0.92) quad(c, P(zx - 0.23, 0, Math.max(z, near)), P(zx + 0.23, 0, Math.max(z, near)), P(zx + 0.23, 0, z + 2.4), P(zx - 0.23, 0, z + 2.4), 'rgba(240,244,248,.9)');
      }
      // the houses along each side, far ones first
      var k0 = Math.floor(near/6.4), k1 = Math.ceil(far/6.4);
      for(var k = k1; k >= k0; k--){
        [-1, 1].forEach(function(side){
          var za = k*6.4, zb = za + 6.0, h = 7.4 + ((k*7 + side*3) & 3)*0.7, hue = ((k*5 + (side > 0 ? 3 : 0)) % 6 + 6) % 6;
          var x = side*6.2, a = P(x, 0, Math.max(za, near)), b = P(x, 0, zb), b2 = P(x, h, zb), a2 = P(x, h, Math.max(za, near));
          if(!a || !b) return;

            var wz = za + 1.2 + w*3, wy = 1.4 + f*2.4;
            if(wz + 1.3 < near) continue;
            quad(c, P(x, wy, wz), P(x, wy, wz + 1.3), P(x, wy + 1.4, wz + 1.3), P(x, wy + 1.4, wz), (f + w + k) % 3 ? 'rgba(207,224,239,.85)' : 'rgba(255,233,176,.95)');
          }
        });
      }
      // what is on the road, far to near
      var items = [];
      S.T.obs.forEach(function(ob){ var oz = RL.obZ(ob, S.d, S.v); if(oz < far && oz + ob.len > near) items.push({z:oz, ob:ob}); });
      S.T.coins.forEach(function(co){ if(!co.got && co.z < far && co.z > near) items.push({z:co.z, co:co}); });
      S.T.powers.forEach(function(p){ if(!p.got && p.z < far && p.z > near) items.push({z:p.z, pw:p}); });

    function shade(hex, f){

    }
    function drawItem2D(c, it){

        var co = it.co; p = P(co.x, co.y + 0.12, co.z); if(!p) return;
        var r = 0.34*p.s, sq = Math.abs(Math.cos(time*3.4 + co.z*0.4));
        c.fillStyle = '#b8860b'; c.beginPath(); c.ellipse(p.x, p.y, Math.max(1, r*sq) + 1, r + 1, 0, 0, Math.PI*2); c.fill();
        c.fillStyle = '#ffc83a'; c.beginPath(); c.ellipse(p.x, p.y, Math.max(0.6, r*sq), r, 0, 0, Math.PI*2); c.fill();
        return;
      }
      if(it.pw){
        var pw = it.pw; p = P(pw.x, 1.05 + Math.sin(time*3)*0.12, pw.z); if(!p) return; s = p.s;
        c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(p.x, p.y, 0.6*s, 0, Math.PI*2); c.fill();
        if(pw.kind === 'hat'){ c.fillStyle = '#ffd21f'; c.beginPath(); c.arc(p.x, p.y, 0.34*s, Math.PI, 0); c.fill(); c.fillRect(p.x - 0.48*s, p.y - 0.02*s, 0.96*s, 0.08*s); }
        else { c.strokeStyle = '#e8413c'; c.lineWidth = 0.18*s; c.beginPath(); c.arc(p.x, p.y - 0.05*s, 0.28*s, Math.PI, 0, true); c.stroke(); c.fillStyle = '#dfe6ee'; c.fillRect(p.x - 0.4*s, p.y - 0.16*s, 0.22*s, 0.16*s); c.fillRect(p.x + 0.18*s, p.y - 0.16*s, 0.22*s, 0.16*s); }
        return;
      }
      if(it.fin){
        var l = P(-3.7, 0, it.z), rr = P(3.7, 0, it.z), lt = P(-3.7, 4.5, it.z), rt = P(3.7, 4.5, it.z); if(!l || !rr) return;
        c.fillStyle = '#e9eef4'; c.fillRect(l.x - 2, lt.y, 4, l.y - lt.y); c.fillRect(rr.x - 2, rt.y, 4, rr.y - rt.y);
        var bh = 1.2*l.s; c.fillStyle = '#ff6b1a'; c.fillRect(lt.x, lt.y, rt.x - lt.x, bh);
        c.fillStyle = '#ffffff'; c.font = Math.max(8, 0.8*l.s) + 'px "Lilita One", Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(C.t('runFinish').toUpperCase(), (lt.x + rt.x)/2, lt.y + bh/2);
        return;
      }
      var ob = it.ob, oz = it.z;
      x = ob.span ? 0 : (ob.lane - 1)*LANE;
      if(ob.hit && ob.hitAt != null){ var k2 = Math.min(1, (time - ob.hitAt)/0.7); if(k2 >= 1 && ob.need !== 'block') return; x += (x <= 0 ? -1 : 1)*k2*3; }
      p = P(x, 0, oz); if(!p) return; s = p.s;
      c.save();
      if(ob.need === 'block'){
        var H = ob.kind === 'bus' ? 2.9 : ob.kind === 'truck' || ob.kind === 'plow' ? 2.6 : ob.kind === 'van' ? 2.1 : 1.45, W = 1.85;
        var hn = ob.hue % C.COLORS.length, hue = ob.kind === 'bus' && (hn === 1 || hn === 8) ? ob.hue + 1 : ob.hue;      // no blue or white city buses
        var colr = ob.kind === 'plow' ? {c:'#f28a1e', d:'#a95a0c'} : C.COLORS[hue % C.COLORS.length];
        var f1 = P(x - W/2, 0, oz), f2 = P(x + W/2, 0, oz), f3 = P(x + W/2, H, oz), f4 = P(x - W/2, H, oz);
        var b1 = P(x - W/2, H, oz + ob.len), b2 = P(x + W/2, H, oz + ob.len);
        quad(c, f4, f3, b2, b1, shade(colr.c, 1.1 > 1 ? 1 : 1));                 // roof
        var sideX = x > camX() ? -1 : 1, sx2 = x + sideX*W/2;
        quad(c, P(sx2, 0, oz), P(sx2, 0, oz + ob.len), P(sx2, H, oz + ob.len), P(sx2, H, oz), colr.d);   // the side you can see

        c.strokeStyle = tg; c.lineWidth = 16; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.stroke();
      }
      if(ph < 0.34){ var rr = (ph/0.34); c.strokeStyle = 'rgba(255,255,255,' + (1 - rr) + ')'; c.lineWidth = 3; c.beginPath(); c.arc(sx, sy, 18 + rr*26, 0, Math.PI*2); c.stroke(); }
      // the arrow it is heading for
      c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath();
      var hx = cx + dx*(L/2 + 30), hy = cy + dy*(L/2 + 30), ux = dx, uy = dy, vx = -uy, vy = ux;
      c.moveTo(hx + ux*14, hy + uy*14); c.lineTo(hx - ux*8 + vx*15, hy - uy*8 + vy*15); c.lineTo(hx - ux*8 - vx*15, hy - uy*8 - vy*15); c.closePath(); c.fill();
      // the fingertip
      c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 10; c.shadowOffsetY = 3;
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(ex, ey, 17 - (ph > 0.14 && ph < 0.66 ? 2 : 0), 0, Math.PI*2); c.fill();
      c.shadowColor = 'transparent'; c.strokeStyle = '#ff6b1a'; c.lineWidth = 4; c.stroke();
      c.restore();
    }
    function bigWord(c, txt, a){
      c.font = '400 44px "Lilita One", Nunito, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = 7; c.strokeStyle = 'rgba(16,24,38,' + 0.55*a + ')'; c.strokeText(txt, G.W/2, G.H*0.36);
      c.fillStyle = '#ffffff'; c.fillText(txt, G.W/2, G.H*0.36);
    }

    inst.layout = layout; inst.paintStatic = paintStatic; inst.update = update; inst.draw = draw;
    inst.down = function(){}; inst.pointer = pointer; inst.go = go;
    inst.__view = function(){ return view3d; };
    inst.booster = booster; inst.boosterState = boosterState; inst.hud = hud; inst.continueAfterLoss = continueAfterLoss;
    inst.dispose = function(){ if(view3d){ view3d.dispose(); view3d = null; } };
    inst.state = S; inst.__S = S; inst.__level = level; inst.__lesson = function(){ return lessonHold && tutNow ? tutNow.tut : null; }; inst.__skipStart = function(){ startT = 0; }; inst.__is3d = use3d; inst.__view = function(){ return view3d; };
    if(api.firstTime && !teach) inst.tip = C.t('tutRun');
    return inst;
  }

  window.Games = window.Games || {};
  window.Games.run = {
    id:'run', titleKey:'gameRun', boosters:['hat','magnet'],
    generate:function(n){ return {n:n, seed:9001 + n*7333, winter:C.season().id === 'winter', P:RL.params(n)}; },
    create:create
  };
})();
</script>
<script>
/* Rewards: the reasons to come back tomorrow.

   - A daily gift on a 7-day calendar. Coming back the next day moves you one
     box along; missing a day starts the calendar again. Day 7 is a chest.
   - Three missions at a time ("land 10 BMX tricks", "win 3 levels in a
     row"...). Each pays coins when done; finishing all three opens a chest
     and raises your rank, and every rank adds 10% to level bonuses.
   - A star chest every 12 stars.
   - The garage, where coins buy looks for the BMX rider (helmet, shirt,
     bike). Two looks only come out of chests.

   Everything is kept in the save on this device. The shell hands in a few
   helpers through init(); the rest is self-contained. */
(function(){
  'use strict';
  var C = window.Core;
  var UI = null;

  /* ---------- the garage ---------- */
  var LOOKS = {
    helmet:[{id:'orange', hex:'#ff6b1a', price:0}, {id:'red', hex:'#e8413c', price:150}, {id:'blue', hex:'#2f6fe0', price:150},
            {id:'mint', hex:'#2ec4a6', price:200}, {id:'night', hex:'#2a2f37', price:250}, {id:'chrome', hex:'#dfe6ee', price:0, chest:true}],
    shirt:[{id:'teal', hex:'#1fb5a8', price:0}, {id:'maple', hex:'#d93a32', price:150}, {id:'lemon', hex:'#ffd21f', price:150},
           {id:'grape', hex:'#8f5fd0', price:200}, {id:'snow', hex:'#f2f4f6', price:200}, {id:'navy', hex:'#24355c', price:250}],
    frame:[{id:'red', hex:'#e8413c', price:0}, {id:'chrome', hex:'#c9d2dc', price:200}, {id:'lime', hex:'#7be33a', price:250},
           {id:'grape', hex:'#8f5fd0', price:250}, {id:'black', hex:'#1f252e', price:300}, {id:'gold', hex:'#ffcc33', price:0, chest:true}]
  };
  var SLOTS = ['helmet', 'shirt', 'frame'];
  function look(slot, id){ var l = LOOKS[slot]; for(var i = 0; i < l.length; i++) if(l[i].id === id) return l[i]; return l[0]; }

  /* ---------- missions ---------- */
  var POOL = {
    win:{n:[2, 3, 4, 5], coins:50, kind:'level'},      stars3:{n:[2, 3, 3, 4], coins:60, kind:'level'},
    hard:{n:[1, 1, 2, 2], coins:80, kind:'level'},     streak:{n:[2, 3, 3, 4], coins:70, kind:'level'},
    tricks:{n:[5, 10, 15, 20], coins:50, kind:'bmx'},  runcoins:{n:[25, 50, 80, 120], coins:60, kind:'bmx'},
    ride:{n:[300, 500, 800, 1200], coins:70, kind:'bmx'},
    daily:{n:[1, 1, 1, 1], coins:60, kind:'any'},     coins:{n:[100, 150, 250, 400], coins:40, kind:'any'}
  };
  function today(off){
    var d = new Date(); d.setDate(d.getDate() + (off || 0));
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function st(){
    var s = C.save.rw;
    if(!s || !s.v){
      s = C.save.rw = {v:1, daily:{day:0, last:''}, missions:null, rank:1, chests:0, run:0, setReady:false,
                       owned:{helmet:['orange'], shirt:['teal'], frame:['red']}, wear:{helmet:'orange', shirt:'teal', frame:'red'}};
    }
    if(!s.missions) s.missions = newSet(s.rank);
    return s;
  }
  // one level mission, one BMX mission, one of anything: always something you can work on right now
  function newSet(rank){
    var r = Math.min(3, Math.max(0, rank - 1)), out = [], used = {};
    ['level', 'bmx', 'any'].forEach(function(kind){
      var keys = Object.keys(POOL).filter(function(k){ return POOL[k].kind === kind && !used[k]; });
      if(kind === 'any' && UI && UI.dailyDone && UI.dailyDone()) keys = keys.filter(function(k){ return k !== 'daily'; });
      var k = keys[Math.floor(Math.random()*keys.length)]; used[k] = 1;
      out.push({k:k, n:POOL[k].n[r], prog:0, coins:POOL[k].coins + r*10, done:false});
    });
    return out;
  }
  function missionText(m){
    var key = m.k === 'hard' && m.n === 1 ? 'mHard1' : 'm_' + m.k;
    return C.t(key).replace('{n}', m.n);
  }
  /* Something happened in the game. Returns the missions it finished. */
  function event(k, v){
    var s = st(), done = [];
    if(k === 'win') s.run = (s.run || 0) + 1;
    if(k === 'lose') s.run = 0;
    s.missions.forEach(function(m){
      if(m.done) return;
      if(m.k === 'streak' && (k === 'win' || k === 'lose')) m.prog = Math.max(m.prog, s.run);
      else if(m.k === k) m.prog = k === 'ride' ? Math.max(m.prog, v) : m.prog + (v == null ? 1 : v);
      if(m.prog >= m.n){ m.prog = m.n; m.done = true; done.push(m); }
    });
    done.forEach(function(m){ UI.addCoins(m.coins, true); });
    if(done.length && s.missions.every(function(m){ return m.done; })) s.setReady = true;
    C.persist();
    return done;
  }
  function bonusRate(){ return 1 + 0.1*(st().rank - 1); }

  /* ---------- star chests and the daily calendar ---------- */
  var STAR_STEP = 12, GIFTS = [40, 60, 80, 100, 120, 150, 'chest'];
  function starChestsReady(totalStars){ return Math.max(0, Math.floor(totalStars/STAR_STEP) - st().chests); }
  function daily(){
    var s = st(), d = s.daily, t = today();
    if(d.last === t) return {ready:false, day:d.day};
    return {ready:true, day:d.last === today(-1) ? d.day : 0};          // a missed day starts the calendar again
  }
  function hasNews(totalStars){ return daily().ready || st().setReady || starChestsReady(totalStars) > 0; }

  /* A chest: coins, and a look you do not own yet when one is left. */
  function openChest(coins, exclusive){
    var s = st(), pool = [];
    SLOTS.forEach(function(slot){
      LOOKS[slot].forEach(function(l){
        if(s.owned[slot].indexOf(l.id) < 0 && (exclusive ? true : !l.chest)) pool.push({slot:slot, l:l});
      });
    });
    if(exclusive){ var ex = pool.filter(function(p){ return p.l.chest; }); if(ex.length) pool = ex; }
    var prize = pool.length && (exclusive || Math.random() < 0.6) ? pool[Math.floor(Math.random()*pool.length)] : null;
    if(prize) s.owned[prize.slot].push(prize.l.id);
    UI.addCoins(coins, true); C.persist();
    return {coins:coins, prize:prize};
  }

  /* ---------- screens ---------- */
  function swatch(hex, big){ return '<i class="sw' + (big ? ' big' : '') + '" style="background:' + hex + '"></i>'; }
  function chestHTML(title, got, next){
    return '<h2>' + title + '</h2>' +
      '<div class="chest"><div class="glow"></div><div class="box"></div><div class="lid"></div></div>' +
      '<div class="earn"><i class="coin"></i>+' + got.coins + '</div>' +
      (got.prize ? '<p class="prize">' + swatch(got.prize.l.hex, true) + '<span>' + C.t('newLook') + ' <b>' +
                   C.t('look_' + got.prize.slot + '_' + got.prize.l.id) + '</b> (' + C.t('slot_' + got.prize.slot).toLowerCase() + ')</span></p>' : '') +
      (next ? '<p class="small">' + next + '</p>' : '');
  }
  function showDaily(after){
    var dd = daily(), s = st(), html = '<h2>' + C.t('dailyGift') + '</h2><p>' + C.t('dailyGiftSub') + '</p><div class="cal">';
    GIFTS.forEach(function(g, i){
      var state = i < dd.day ? 'got' : i === dd.day ? (dd.ready ? 'now' : 'got') : '';
      html += '<span class="cd ' + state + '"><small>' + C.t('dayN').replace('{n}', i + 1) + '</small>' +
              (g === 'chest' ? '<i class="mini-chest"></i>' : '<i class="coin"></i><b>' + g + '</b>') + '</span>';
    });
    html += '</div>';
    if(dd.ready) html += '<div class="stack"><button class="btn" id="dgGo">' + C.t('collect') + '</button></div>';
    else html += '<p class="small">' + C.t('dailyBack').replace('{x}', giftName(GIFTS[s.daily.day])) + '</p><div class="stack"><button class="btn" id="dgOk">' + C.t('done') + '</button></div>';
    UI.open(html);
    var go = document.getElementById('dgGo'), ok = document.getElementById('dgOk');
    if(ok) ok.onclick = function(){ UI.close(); if(after) after(); };
    if(go) go.onclick = function(){
      var g = GIFTS[dd.day], got;
      s.daily.last = today(); s.daily.day = (dd.day + 1) % 7; C.persist();
      got = g === 'chest' ? openChest(200, true) : (UI.addCoins(g, true), {coins:g, prize:null});
      C.sfx.clear(); C.haptic(30);
      UI.open(chestHTML(C.t('dayN').replace('{n}', dd.day + 1), got, C.t('dailyBack').replace('{x}', giftName(GIFTS[s.daily.day]))) +
              '<div class="stack"><button class="btn" id="dgOk2">' + C.t('done') + '</button></div>', true);
      document.getElementById('dgOk2').onclick = function(){ UI.close(); UI.refresh(); if(after) after(); };
    };
  }
  function giftName(g){ return g === 'chest' ? C.t('aChest') : g + ' ' + C.t('coinsWord'); }

  function missionRow(m){
    var pct = Math.round(m.prog/m.n*100);
    return '<div class="ms' + (m.done ? ' done' : '') + '"><span class="mt">' + missionText(m) + '</span>' +
           '<span class="mr"><i class="coin sm"></i>' + m.coins + '</span>' +
           '<span class="mb"><i style="width:' + pct + '%"></i></span><span class="mp">' + (m.done ? '✓' : m.prog + '/' + m.n) + '</span></div>';
  }
  function showGoals(totalStars, extra){
    var s = st(), sc = starChestsReady(totalStars), into = totalStars % STAR_STEP, dd = daily();
    var html = '<h2>' + C.t('goals') + '</h2>' +
      '<p class="rank">' + (s.rank === 1 ? C.t('rank1Lbl') : C.t('rankLbl').replace('{r}', s.rank).replace('{p}', Math.round((bonusRate() - 1)*100))) + '</p>' +
      '<div class="msl">' + s.missions.map(missionRow).join('') + '</div>' +
      (s.setReady ? '<button class="btn" id="gSet">' + C.t('openSetChest') + '</button>'
                  : '<p class="small">' + C.t('setHint') + '</p>') +
      '<div class="grow"><span>' + C.t('starChest') + '</span>' +
        (sc > 0 ? '<button class="btn mini" id="gStar">' + C.t('open') + '</button>'
                : '<span class="mb wide"><i style="width:' + Math.round(into/STAR_STEP*100) + '%"></i></span><b>' + into + '/' + STAR_STEP + '</b>') + '</div>' +
      '<div class="grow"><span>' + C.t('dailyGift') + '</span>' +
        (dd.ready ? '<button class="btn mini" id="gDaily">' + C.t('collect') + '</button>' : '<b class="soft">' + C.t('tomorrow') + '</b>') + '</div>' +
      '<div class="stack" style="margin-top:14px"><button class="btn alt" id="gGarage">' + C.t('garage') + '</button>' +
      (extra ? '<button class="btn alt" id="gExtra">' + extra.label + '</button>' : '') +
      '<button class="btn" id="gOk">' + C.t('done') + '</button></div>';
    UI.open(html);
    var back = function(){ showGoals(totalStars, extra); };
    document.getElementById('gOk').onclick = function(){ UI.close(); UI.refresh(); };
    document.getElementById('gGarage').onclick = function(){ showGarage('helmet', back); };
    if(extra) document.getElementById('gExtra').onclick = extra.go;
    var b;
    if((b = document.getElementById('gDaily'))) b.onclick = function(){ showDaily(back); };
    if((b = document.getElementById('gStar'))) b.onclick = function(){
      s.chests++; var got = openChest(100, false); C.sfx.clear(); C.haptic(30);
      UI.open(chestHTML(C.t('starChest'), got) + '<div class="stack"><button class="btn" id="gc">' + C.t('done') + '</button></div>', true);
      document.getElementById('gc').onclick = back;
    };
    if((b = document.getElementById('gSet'))) b.onclick = function(){
      var got = openChest(150 + 50*s.rank, s.rank % 2 === 0);
      s.rank++; s.setReady = false; s.missions = newSet(s.rank); C.persist(); C.sfx.clear(); C.haptic(40);
      UI.open(chestHTML(C.t('rankUp').replace('{r}', s.rank), got, C.t('rankLbl').replace('{r}', s.rank).replace('{p}', Math.round((bonusRate() - 1)*100))) +
              '<div class="stack"><button class="btn" id="gc">' + C.t('done') + '</button></div>', true);
      document.getElementById('gc').onclick = back;
    };
  }
  var previewCache = {};
  function preview(w){
    var key = JSON.stringify(st().wear);
    if(previewCache[key]) return previewCache[key];
    var url = null;
    try { if(window.Kit3D && window.Kit3D.available() && window.Kit3D.riderPreview) url = window.Kit3D.riderPreview(outfit(), 260, 260); } catch(e){ url = null; }
    if(url) previewCache[key] = url;
    return url;
  }
  function showGarage(slot, back){
    var s = st(), pv = preview();
    var html = '<h2>' + C.t('garage') + '</h2>' +
      (pv ? '<img class="gprev" alt="" src="' + pv + '">' : '<div class="gprev flat">' + SLOTS.map(function(sl){ return swatch(look(sl, s.wear[sl]).hex, true); }).join('') + '</div>') +
      '<div class="seg gtabs" role="group">' + SLOTS.map(function(sl){
        return '<button data-slot="' + sl + '" aria-pressed="' + (sl === slot) + '">' + C.t('slot_' + sl) + '</button>'; }).join('') + '</div>' +
      '<div class="glist">';
    LOOKS[slot].forEach(function(l){
      var owned = s.owned[slot].indexOf(l.id) >= 0, worn = s.wear[slot] === l.id;
      var act = worn ? '<b class="soft">' + C.t('wearing') + '</b>'
              : owned ? '<button class="btn mini" data-wear="' + l.id + '">' + C.t('wear') + '</button>'
              : l.chest ? '<b class="soft">' + C.t('chestOnly') + '</b>'
              : '<button class="btn mini buy" data-buy="' + l.id + '"><i class="coin sm"></i>' + l.price + '</button>';
      html += '<div class="gi' + (worn ? ' on' : '') + '">' + swatch(l.hex) + '<span>' + C.t('look_' + slot + '_' + l.id) + '</span>' + act + '</div>';
    });
    html += '</div><div class="stack" style="margin-top:12px"><button class="btn" id="gaOk">' + C.t('done') + '</button></div>';
    UI.open(html);
    var ov = document.getElementById('overlay');
    ov.querySelectorAll('[data-slot]').forEach(function(b){ b.onclick = function(){ showGarage(b.dataset.slot, back); }; });
    ov.querySelectorAll('[data-wear]').forEach(function(b){ b.onclick = function(){ s.wear[slot] = b.dataset.wear; C.persist(); C.sfx.tap(); showGarage(slot, back); }; });
    ov.querySelectorAll('[data-buy]').forEach(function(b){ b.onclick = function(){
      var l = look(slot, b.dataset.buy);
      if(!UI.spend(l.price)) return;
      s.owned[slot].push(l.id); s.wear[slot] = l.id; C.persist(); C.sfx.clear(); C.haptic(20); showGarage(slot, back);
    }; });
    document.getElementById('gaOk').onclick = function(){ if(back) back(); else { UI.close(); UI.refresh(); } };
  }
  /* The rider's colours, for the 3D view and the flat drawing. */
  function outfit(){
    var s = st();
    return {helmet:look('helmet', s.wear.helmet).hex, shirt:look('shirt', s.wear.shirt).hex, frame:look('frame', s.wear.frame).hex};
  }
  /* The one line on a win or lose card that says what to do next. */
  function nextGoalHTML(justDone){
    var s = st(), out = '';
    (justDone || []).forEach(function(m){
      out += '<div class="goal ok"><b>' + C.t('missionDone') + '</b> ' + missionText(m) + ' <span><i class="coin sm"></i>+' + m.coins + '</span></div>';
    });
    if(s.setReady){ out += '<div class="goal ok"><b>' + C.t('openSetChest') + '</b></div>'; return out; }
    var open = s.missions.filter(function(m){ return !m.done; }).sort(function(a, b){ return b.prog/b.n - a.prog/a.n; })[0];
    if(open) out += '<div class="goal"><b>' + C.t('mission') + '</b> ' + missionText(open) + ' <span>' + open.prog + '/' + open.n + '</span>' +
                    '<i class="gb"><i style="width:' + Math.round(open.prog/open.n*100) + '%"></i></i></div>';
    return out;
  }

  window.Rewards = {
    init:function(ui){ UI = ui; st(); },
    event:event, bonusRate:bonusRate, daily:daily, hasNews:hasNews, starChestsReady:starChestsReady,
    showDaily:showDaily, showGoals:showGoals, showGarage:showGarage, outfit:outfit, nextGoalHTML:nextGoalHTML,
    missions:function(){ return st().missions; }, rank:function(){ return st().rank; }, LOOKS:LOOKS
  };
})();
</script>
<script>
/* Détour! shell. Owns the canvas, the map, the HUD and the overlays.
   A mini-game only has to implement: layout, paintStatic, update, draw, down,
   booster, boosterState, hud. It never touches the DOM. */
(function(){
  'use strict';
  var C = window.Core, Games = window.Games;
  var $ = function(s){ return document.querySelector(s); };

  /* ---------- content: districts and stops ---------- */
  var DISTRICTS = [{
    id:'downtown', nameKey:'d1', subKey:'d1sub', stops:25,
    landmarkKey:'pc1', postcardKey:'pc1txt',
    sky:['#9fc4e4','#dce9f5'], brick:'#9b4838'
  }];
  /* The route through a district. Difficulty follows the route, not how many
     times you have played a game: each game's first stop teaches it (level 1),
     and after that its level number tracks how far along the route you are.
       Stops 1 to 7   meet the seven games, one each.
       Stops 8 to 11  a new twist every stop (snake lines, work zones,
                      mystery signs, ambulances), each on a normal board.
       Stops 12 to 25 a sawtooth: hard stops at 12, 16, 19 and 23 (a
                      game's level 5 or 10 is its hard level), each
                      followed by a lighter stop, and the finale at 25.
     Each entry is [game, that game's level number]. Past the district the
     route repeats, a little harder each lap. */
  var ROUTE = [['bus',1],['metro',1],['signs',1],['traffic',1],['run',1],['plow',1],['find',1],['metro',2],['bus',3],['signs',3],
               ['traffic',3],['plow',5],['metro',4],['run',2],['find',4],['signs',5],['traffic',4],['metro',6],['bus',5],['plow',6],
               ['signs',6],['run',3],['metro',10],['find',6],['bus',6]];
  /* A hard stop: a game's fifth or tenth level, or the finale. */
  function isHardStop(stop){
    var id = gameFor(stop), n = levelNumFor(stop);
    return isFinale(stop) || (id !== 'run' && n >= 5 && n % 5 === 0);
  }
  function gameFor(stop){ return ROUTE[(stop - 1) % ROUTE.length][0]; }
  function isFinale(stop){ return stop === DISTRICTS[0].stops; }
  function levelNumFor(stop){
    var i = (stop - 1) % ROUTE.length, lap = Math.floor((stop - 1)/ROUTE.length), id = ROUTE[i][0], most = 0;
    ROUTE.forEach(function(r){ if(r[0] === id) most = Math.max(most, r[1]); });
    return ROUTE[i][1] + lap*most;
  }
  function totalStops(){ return DISTRICTS.reduce(function(a,d){ return a + d.stops; }, 0); }
  function starsAt(stop){ return C.save.stars[stop] || 0; }
  function totalStars(){
    var t = 0;
    for(var k in C.save.stars) t += C.save.stars[k];
    return t;
  }

  /* ---------- canvas ---------- */
  var cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage');
  var bg = document.createElement('canvas'), bgx = bg.getContext('2d');
  var mqReduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var reduceMotion = mqReduce || !!C.save.calm;
  var APP_VERSION = 31;
  var dpr = 1, k = 1, bgDirty = true;
  var G = {W:420, H:800};
  var screen = 'map', game = null, gameStop = 0, paused = false;
  var map = {scroll:0, maxScroll:0, target:null, drag:null, time:0, flakes:C.makeSnow(26), pulse:0};

  function layout(){
    var r = stage.getBoundingClientRect();
    var w = Math.max(200, r.width), h = Math.max(300, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    bg.width = cv.width; bg.height = cv.height;
